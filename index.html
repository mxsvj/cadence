<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="theme-color" content="#14110F">
<meta name="description" content="Cadence — tracker d'habitudes, discipline et régularité.">
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2314110F'/%3E%3Ctext x='90' y='124' font-size='96' text-anchor='middle' fill='%23FF4D36' font-family='Helvetica,Arial' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
<style>
/* ============ tokens ============ */
:root{
  --bg:#14110F; --bg2:#1B1714; --card:#211C19; --card2:#2A2320; --line:#342D28;
  --txt:#F7F2EE; --mut:#9C8F87; --mut2:#6E635C;
  --acc:#FF4D36; --grn:#3ECF8E; --gld:#FFC94D; --blu:#59A9FF; --vio:#B47DFF;
  --sh:0 6px 18px rgba(0,0,0,.45); --sh2:0 16px 34px rgba(0,0,0,.55);
  --r:18px; --r2:14px; --maxw:560px;
}
html[data-theme="light"]{
  --bg:#FBF7F4; --bg2:#F2EAE4; --card:#FFFFFF; --card2:#F7F1EC; --line:#E8DED6;
  --txt:#1A1411; --mut:#7B6D64; --mut2:#A79A91;
  --sh:0 4px 14px rgba(70,45,30,.09); --sh2:0 14px 30px rgba(70,45,30,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Manrope',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-weight:700;margin:0;line-height:1.05}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
input,textarea,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;line-height:1.5}
.muted{color:var(--mut)} .small{font-size:12.5px} .center{text-align:center}
.grn{color:var(--grn)} .acc{color:var(--acc)} .gld{color:var(--gld)}
.hide{display:none!important}

/* ============ layout ============ */
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  background:linear-gradient(180deg,var(--bg) 68%,rgba(20,17,15,0));}
html[data-theme="light"] #topbar{background:linear-gradient(180deg,var(--bg) 68%,rgba(251,247,244,0))}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;letter-spacing:.16em;text-transform:uppercase;user-select:none}
.logo b{color:var(--acc)}
.tbr{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .12s,background .15s}
.iconbtn:active{transform:scale(.88)}
@media (hover:hover){.iconbtn:hover{background:var(--card2)}}
main{flex:1;padding:2px 16px 148px}
.sec{margin:24px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:19px}
.sec span{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}

/* ============ cards & buttons ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:14px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
@media (hover:hover){.card.lift:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#443A34}}
html[data-theme="light"] .card.lift:hover{border-color:#DDD0C6}
.card.lift:active{transform:scale(.983)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  font-weight:800;font-size:14px;transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.94)}
@media (hover:hover){.btn:hover{filter:brightness(1.12)}}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 18px rgba(255,77,54,.28)}
.btn.ok{background:var(--grn);border-color:var(--grn);color:#08130D;box-shadow:0 8px 18px rgba(62,207,142,.24)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--mut)}
.chip b{color:var(--txt);font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emo{font-size:26px;line-height:1;display:inline-block;will-change:transform}
@keyframes bounce{0%{transform:translateY(0) scale(1)}28%{transform:translateY(-7px) scale(1.16)}
  58%{transform:translateY(0) scale(.96)}80%{transform:translateY(-2px) scale(1.03)}100%{transform:translateY(0) scale(1)}}
@media (hover:hover){.lift:hover .emo{animation:bounce .55s ease}}
.lift:active .emo{animation:bounce .45s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .28s ease both}

/* ============ tabbar ============ */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;
  padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
.tabs{pointer-events:auto;width:100%;max-width:var(--maxw);display:grid;grid-template-columns:repeat(5,1fr);
  gap:2px;background:rgba(33,28,25,.92);border:1px solid var(--line);border-radius:20px;padding:7px 6px;
  box-shadow:var(--sh2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html[data-theme="light"] .tabs{background:rgba(255,255,255,.92)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;
  font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut2);
  transition:transform .12s,color .15s,background .15s}
.tab i{font-style:normal;font-size:18px;line-height:1;transition:transform .18s}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--acc);background:rgba(255,77,54,.10)}
.tab.on i{transform:translateY(-1px) scale(1.1)}

/* ============ FAB ============ */
#fab{position:fixed;z-index:46;right:max(16px,calc(50vw - var(--maxw)/2 + 16px));
  bottom:calc(env(safe-area-inset-bottom) + 86px);width:56px;height:56px;border-radius:19px;
  background:var(--acc);color:#fff;font-size:30px;font-weight:400;line-height:52px;
  box-shadow:0 12px 26px rgba(255,77,54,.4);transition:transform .14s}
#fab:active{transform:scale(.86) rotate(90deg)}
@media (hover:hover){#fab:hover{transform:translateY(-2px) scale(1.04)}}

/* ============ banner ============ */
#banner{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:39;margin:0 16px 8px;
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:16px;
  background:linear-gradient(135deg,#FF4D36,#FF7A45);color:#fff;box-shadow:0 12px 26px rgba(255,77,54,.35);
  animation:pop .3s ease both}
#banner .bn{font-weight:800;font-size:14px}
#banner .bs{font-size:12px;opacity:.9}
#banner .x{margin-left:auto;font-size:18px;opacity:.9;padding:4px 6px}

/* ============ jour ============ */
.dayhead{display:flex;gap:14px;align-items:center;padding:16px 15px}
.ringwrap{position:relative;width:96px;height:96px;flex:0 0 96px}
.ring{width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--acc);transition:stroke-dashoffset .6s cubic-bezier(.4,1.3,.4,1),stroke .3s}
.ring.full .fgc{stroke:var(--grn)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-family:'Barlow Condensed',sans-serif;font-size:29px;font-weight:700;line-height:1}
.ringtxt small{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.06em}
.dh{flex:1;min-width:0}
.dh .date{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.dh h1{font-size:25px;margin:3px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

.task{display:flex;align-items:center;gap:12px;padding:13px 13px;margin-bottom:10px;position:relative;overflow:hidden}
.task:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc);opacity:.9}
.tmain{flex:1;min-width:0}
.tname{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--mut);font-weight:600;margin-top:3px}
.tmeta .late{color:var(--acc);font-weight:800}
.tright{display:flex;align-items:center;gap:7px}
.chk{width:36px;height:36px;border-radius:12px;border:2px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:all .18s}
.chk:active{transform:scale(.88)}
@media (hover:hover){.chk:hover{border-color:var(--grn);color:rgba(62,207,142,.45)}}
.chk.on{background:var(--grn);border-color:var(--grn);color:#08130D}
.del{width:32px;height:32px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  font-size:13px;opacity:.65;transition:all .15s;display:flex;align-items:center;justify-content:center}
.del:active{transform:scale(.88)}
.del.sure{width:auto;padding:0 10px;background:var(--acc);border-color:var(--acc);color:#fff;opacity:1;font-size:12px;font-weight:800}
.task.done{opacity:.62}
.task.done:before{background:var(--grn)}
.task.done .tname{text-decoration:line-through;text-decoration-color:var(--mut2)}
.empty{padding:26px 14px;text-align:center;color:var(--mut);font-size:13.5px}
.empty .e{font-size:34px;display:block;margin-bottom:8px}
.quote{margin:26px 0 6px;padding:18px 16px;border-radius:var(--r);background:var(--card2);border:1px dashed var(--line);text-align:center}
.quote p{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
.quote small{display:block;margin-top:8px;color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.14em}

/* ============ sheet / modal ============ */
.modal{position:fixed;inset:0;z-index:70;display:none}
.modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--maxw);
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);animation:up .28s cubic-bezier(.2,.9,.3,1) both}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 14px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.shead .emo{font-size:36px}
.shead h2{font-size:23px}
.steps{margin:16px 0 6px}
.step{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 12px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r2);transition:transform .12s,background .15s}
.step:active{transform:scale(.98)}
.step .box{width:24px;height:24px;flex:0 0 24px;border-radius:8px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .18s}
.step.on .box{background:var(--grn);border-color:var(--grn);color:#08130D}
.step.on .lbl{color:var(--mut);text-decoration:line-through}
.step .lbl{flex:1;font-weight:600;font-size:14px}
.tmr{flex:0 0 auto;padding:6px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;transition:transform .12s}
.tmr:active{transform:scale(.9)}
.tmr.run{background:var(--gld);border-color:var(--gld);color:#1A1206}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:13px;transition:transform .12s}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:13px;transition:transform .12s}
.dchip:active{transform:scale(.9)}
.dchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.echips{display:flex;flex-wrap:wrap;gap:7px}
.echip{width:42px;height:42px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-size:20px;transition:transform .12s}
.echip:active{transform:scale(.86)}
.echip.on{border-color:var(--acc);background:rgba(255,77,54,.14)}
.cchips{display:flex;gap:9px;flex-wrap:wrap}
.cchip{width:36px;height:36px;border-radius:12px;border:2px solid transparent;transition:transform .12s}
.cchip:active{transform:scale(.86)}
.cchip.on{border-color:var(--txt);transform:scale(1.06)}
.sactions{display:flex;gap:9px;margin-top:16px}
.sactions .btn{flex:1}

/* ============ stats ============ */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-family:'Barlow Condensed',sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.mnav button{width:34px;height:34px;border-radius:11px;background:var(--card2);border:1px solid var(--line);transition:transform .12s}
.mnav button:active{transform:scale(.86)}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mhead div{text-align:center;font-size:10px;font-weight:800;color:var(--mut2);letter-spacing:.06em;margin-bottom:5px}
.mcell{aspect-ratio:1;min-height:30px;border-radius:8px;background:var(--card2);border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--mut2);
  transition:transform .12s}
.mcell:active{transform:scale(.9)}
.mcell.l1{background:rgba(62,207,142,.22);color:#BFE8D5}
.mcell.l2{background:rgba(62,207,142,.42);color:#0C1D15}
.mcell.l3{background:rgba(62,207,142,.68);color:#08130D}
.mcell.l4{background:var(--grn);color:#08130D}
.mcell.today{border-color:var(--acc);color:var(--acc);font-weight:800}
.mcell.today.l2,.mcell.today.l3,.mcell.today.l4{color:#08130D}
.mcell.pad{background:transparent}
.mcell.miss{background:rgba(255,77,54,.14);color:var(--mut)}
.mcell.fut{background:var(--card2);opacity:.4}
.legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:9px;font-size:10px;color:var(--mut2);font-weight:700}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:7px;padding-top:6px}
.barw{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end}
.bar{width:100%;border-radius:7px 7px 4px 4px;background:var(--card2);position:relative;min-height:3px;
  transition:height .5s cubic-bezier(.4,1.3,.4,1)}
.bar.best{background:var(--grn)}
.bar.has{background:linear-gradient(180deg,#FF7A45,var(--acc))}
.barw small{font-size:9.5px;color:var(--mut2);font-weight:700}
.barv{font-size:9.5px;color:var(--mut);font-weight:800}
.wtable{width:100%;border-collapse:collapse;font-size:12px}
.wtable th{font-size:10px;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.05em;padding:0 0 8px}
.wtable td{padding:7px 2px;border-top:1px solid var(--line);text-align:center}
.wtable td.n{text-align:left;font-weight:700;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.wtable .yes{color:var(--grn);font-weight:800}
.wtable .no{color:var(--acc);opacity:.75}
.wtable .na{color:var(--mut2);opacity:.5}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rec{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.rec b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1}
.rec small{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.bilan{padding:13px 14px;margin-bottom:9px}
.bilan h3{font-size:15px;margin-bottom:5px}
.bilan p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.55}
.bilan p b{color:var(--txt)}
.up{color:var(--grn);font-weight:800} .down{color:var(--acc);font-weight:800}

/* ============ habitudes ============ */
.hrow{display:flex;align-items:center;gap:11px;padding:12px;margin-bottom:9px}
.ord{display:flex;flex-direction:column;gap:3px}
.ord button{width:26px;height:20px;border-radius:7px;background:var(--card2);border:1px solid var(--line);font-size:10px;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.ord button:active{transform:scale(.85)}
.ord button:disabled{opacity:.28}

/* ============ journal ============ */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{aspect-ratio:1;min-height:56px;border-radius:15px;background:var(--card2);border:2px solid var(--line);font-size:26px;
  display:flex;align-items:center;justify-content:center;transition:transform .14s,border-color .15s,background .15s}
.mood:active{transform:scale(.88)}
.mood.on{border-color:var(--acc);background:rgba(255,77,54,.13);transform:scale(1.05)}
.saveflag{font-size:11px;color:var(--grn);font-weight:800;opacity:0;transition:opacity .3s}
.saveflag.on{opacity:1}
.spark{width:100%;height:auto;display:block}
.spark .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:url(#wgrad);opacity:.5}
.spark .dt{fill:var(--acc)}
.spark .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.spark text{fill:var(--mut2);font-size:9px;font-weight:700;font-family:'Manrope',sans-serif}
.hist{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist .hd{width:66px;flex:0 0 66px;font-size:11.5px;font-weight:800;color:var(--mut)}
.hist .hn{flex:1;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ profil ============ */
.rankcard{display:flex;align-items:center;gap:14px;padding:16px 15px;
  background:linear-gradient(135deg,var(--card),var(--card2))}
.rankcard .re{font-size:44px;line-height:1}
.rankcard h2{font-size:24px}
.prog{height:9px;border-radius:9px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:8px}

  transition:width .7s cubic-bezier(.4,1.3,.4,1)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}

.badge.on{border-color:rgba(255,201,77,.55);background:rgba(255,201,77,.09)}
.avarow{display:flex;flex-wrap:wrap;gap:7px}
.lbtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.lbtabs button{padding:9px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:12.5px;transition:transform .12s}
.lbtabs button:active{transform:scale(.94)}
.lbtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lbrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;margin-bottom:7px;

.lbrow .nm b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

details{background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px;margin-bottom:9px}

.pcard:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc);opacity:.9}

.tab.lock{opacity:.34}
.tab.lock i{filter:grayscale(1)}

/* ============ tutoriel (projecteur) ============ */
#coach{position:fixed;inset:0;z-index:88;display:none}
#coach.on{display:block}

  bottom:calc(env(safe-area-inset-bottom) + 96px);max-width:calc(100% - 32px);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh2);
  border-radius:14px;padding:11px 15px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;gap:8px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

<body>
<div id="app">
  <header id="topbar">
    <div class="logo">CA<b>DENCE</b></div>
    <div class="tbr">

<script>
"use strict";
/* ==========================================================================
   CADENCE — tracker d'habitudes. Tout tient dans ce fichier.
   Données : localStorage (clé "cadence_v1"), aucun serveur.
   ========================================================================== */

/* ---------------------------------------------------------- petits outils */
var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var pad = function(n){ return String(n).padStart(2,'0'); };
var esc = function(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
var uid = function(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };

var nowD    = function(){ return new Date(); };
var dk      = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var today   = function(){ return dk(nowD()); };
var fromKey = function(k){ var a=String(k).split('-'); return new Date(+a[0],+a[1]-1,+a[2]); };
var addDays = function(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
var mondayOf= function(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
var nowHM   = function(){ var d=nowD(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
var toMin   = function(t){ if(!t) return 0; var a=String(t).split(':'); return (+a[0])*60+(+a[1]||0); };
var mmss    = function(s){ s=Math.max(0,Math.round(s)); return pad(Math.floor(s/60))+':'+pad(s%60); };
var hhmmss  = function(s){ s=Math.max(0,Math.round(s));
  var h=Math.floor(s/3600); return (h?h+':':'')+pad(Math.floor(s%3600/60))+':'+pad(s%60); };
var num = function(v,d){ var n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:d; };

var DAYS   = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var DSHORT = ['dim','lun','mar','mer','jeu','ven','sam'];
var MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var MSHORT = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
var DL     = ['L','M','M','J','V','S','D'];   // affichage lundi -> dimanche
var DIDX   = [1,2,3,4,5,6,0];                 // getDay() correspondants
var frDate = function(d){ return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; };
var frShort= function(d){ return DSHORT[d.getDay()]+' '+d.getDate()+' '+MSHORT[d.getMonth()]; };

/* ------------------------------------------------------------- constantes */
var LS = 'cadence_v1';

var QUOTES = [
  "La discipline bat la motivation.",
  "Un jour de plus, pas un jour de moins.",
  "Ce que tu fais aujourd'hui achète ton demain.",
  "Personne ne viendra le faire à ta place.",
  "La régularité, c'est le vrai talent.",
  "Tu n'as pas besoin d'être motivé, juste d'être à l'heure.",
  "Les excuses ne font pas de répétitions.",
  "Fais-le fatigué. Fais-le quand même.",
  "Le corps suit la tête. La tête suit la routine.",
  "Chaque case cochée, c'est un vote pour toi.",
  "Petit aujourd'hui, énorme dans un an.",
  "Le progrès n'est pas spectaculaire, il est quotidien.",
  "Commence avant d'être prêt.",
  "La constance transforme l'ordinaire en extraordinaire.",
  "Tu ne rates pas deux fois de suite. Jamais.",
  "L'énergie vient après l'action, pas avant.",
  "Un pourcentage de mieux, tous les jours.",
  "On ne monte pas la montagne, on fait le pas suivant.",
  "Ta série vaut plus que ta meilleure journée.",
  "La version de toi que tu veux se construit maintenant.",
  "Ce qui est facile aujourd'hui était dur il y a un mois.",
  "Sois plus têtu que ta flemme.",
  "Le talent te fait démarrer. L'habitude te fait finir.",
  "Aucune séance parfaite. Que des séances faites.",
  "Ferme les onglets, ouvre la salle.",
  "Le futur toi regarde. Ne le déçois pas.",
  "Rien ne change si rien ne change.",
  "Fais aujourd'hui ce que les autres remettent à lundi.",
  "La douleur du travail ou celle du regret : choisis.",
  "Le vrai adversaire, c'est le toi d'hier."
];

var RANKS = [
  {xp:0,    n:'Recrue',      e:'🐣'},
  {xp:150,  n:'Soldat',      e:'🪖'},
  {xp:400,  n:'Guerrier',    e:'⚔️'},
  {xp:900,  n:'Machine',     e:'🤖'},
  {xp:2000, n:'Inarrêtable', e:'🔥'},
  {xp:4500, n:'Légende',     e:'👑'}
];

var AVATARS = ['💪','🔥','🥊','🏋️','🏃','🐺','🦁','👑','😈','🤖'];
var COLORS  = ['#FF4D36','#FFC94D','#3ECF8E','#59A9FF','#B47DFF','#FF7AB8'];
var EMOJIS  = ['🏋️','🏃','🍗','🧴','💧','📚','🧘','🛏️','🚿','💊','🥗','🚭','✍️','🧹','☎️','💻','🎸','🐕','🦷','☀️','🧠','💰'];
var MOODS   = ['😫','😕','😐','🙂','🔥'];

var DEFAULTS = [
  {name:'Séance muscu',      emoji:'🏋️', time:'18:00', type:'rec', days:[1,3,5],           color:'#FF4D36',
   steps:['Échauffement 5-10 min','Séance du jour','Étirements 5 min']},
  {name:'Cardio',            emoji:'🏃', time:'08:00', type:'rec', days:[2,4],             color:'#59A9FF',
   steps:['Échauffement 5 min','20-30 min course / vélo / corde','Retour au calme']},
  {name:'Préparer à manger', emoji:'🍗', time:'12:00', type:'rec', days:[0,1,2,3,4,5,6],   color:'#FFC94D',
   steps:['Choisir protéine + féculent + légumes','Cuisiner','Prévoir la portion suivante']},
  {name:'Skincare',          emoji:'🧴', time:'22:00', type:'rec', days:[0,1,2,3,4,5,6],   color:'#3ECF8E',
   steps:['Nettoyant doux','Sérum','Crème hydratante']}
];

var BADGES = [
  {id:'b1',  e:'🎯', n:'Première tâche',   d:'Valider une première tâche'},
  {id:'b2',  e:'💯', n:'Journée parfaite', d:'100% des tâches sur une journée'},
  {id:'b3',  e:'🔥', n:'Série de 7',       d:'7 jours parfaits d’affilée'},
  {id:'b4',  e:'🏆', n:'Série de 30',      d:'30 jours parfaits d’affilée'},
  {id:'b5',  e:'🥇', n:'Semaine à 100%',   d:'Une semaine complète sans rater'},
  {id:'b6',  e:'💪', n:'100 tâches',       d:'100 tâches validées au total'},
  {id:'b7',  e:'🦁', n:'500 tâches',       d:'500 tâches validées au total'},
  {id:'b8',  e:'🌅', n:'10 avant 9h',      d:'10 tâches validées avant 9h'},
  {id:'b9',  e:'🎧', n:'10 sessions focus',d:'Lancer 10 fois le mode focus'},
  {id:'b10', e:'📓', n:'7 notes',          d:'7 notes de journal d’affilée'},
  {id:'b11', e:'⚖️', n:'4 pesées',         d:'Noter son poids 4 fois'},
  {id:'b12', e:'🤝', n:'1 ami',            d:'Ajouter un ami au classement'}
];

/* ------------------------------------------------------------------ état */
function defaults(){
  return {
    v:1, theme:'dark', tab:'jour',
    planned:'',   /* date de la dernière journée validée : verrouille le reste tant qu'elle diffère d'aujourd'hui */
    off:{},       /* 'YYYY-MM-DD' -> [ids retirés de la journée]                                                 */
    tutoSeen:false, tutoStep:0,
    habits:[],
    log:{},      /* 'YYYY-MM-DD' -> { habitId:{done,steps[],pts,doneAt} }  */
    mood:{}, notes:{}, weight:{},
    focus:0,
    profile:{ id:uid(), name:'Moi', avatar:'💪' },
    friends:[],
    notified:{},
    seeded:false
  };
}
var state = defaults();

function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(!o || typeof o!=='object') return;
    var d = defaults();
    for(var k in d){ if(!(k in o)) o[k]=d[k]; }
    if(!Array.isArray(o.habits))  o.habits  = [];
    if(!Array.isArray(o.friends)) o.friends = [];
    if(!o.log     || typeof o.log!=='object')     o.log={};
    if(!o.mood    || typeof o.mood!=='object')    o.mood={};
    if(!o.notes   || typeof o.notes!=='object')   o.notes={};
    if(!o.weight  || typeof o.weight!=='object')  o.weight={};
    if(!o.notified|| typeof o.notified!=='object')o.notified={};
    if(!o.off     || typeof o.off!=='object')     o.off={};
    if(typeof o.planned!=='string') o.planned='';
    o.tutoStep=+o.tutoStep||0;
    if(!o.profile || !o.profile.id) o.profile = d.profile;
    o.focus = +o.focus || 0;
    state = o;
  }catch(e){
    console.warn('Cadence : lecture du stockage impossible, données par défaut.', e);
  }
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); }
  catch(e){ toast('Sauvegarde impossible (stockage plein ou navigation privée)','⚠️'); }
}
function seed(){
  if(state.seeded || state.habits.length) return;
  var t = today();
  state.habits = DEFAULTS.map(function(h){
    return {id:uid(), name:h.name, emoji:h.emoji, time:h.time, type:h.type,
            days:h.days.slice(), date:null, color:h.color, steps:h.steps.slice(), createdAt:t};
  });
  state.seeded = true;
  save();
}

/* ------------------------------------------------------- logique habitudes */
/* au calendrier : cette habitude tombe-t-elle ce jour-là ? */
function scheduled(h,key){
  if(h.createdAt && key < h.createdAt) return false;
  if(h.type==='once') return h.date===key;
  return (h.days||[]).indexOf(fromKey(key).getDay()) > -1;
}
/* retirée à la main de cette journée-là */
function isOff(key,id){ var a=state.off[key]; return !!(a && a.indexOf(id)>-1); }
/* retenue pour la journée = au calendrier ET pas retirée */
function planned(h,key){ return scheduled(h,key) && !isOff(key,h.id); }
function byTime(a,b){ return toMin(a.time)-toMin(b.time) || a.name.localeCompare(b.name); }
function scheduledFor(key){ return state.habits.filter(function(h){ return scheduled(h,key); }).sort(byTime); }
function habitsFor(key){ return state.habits.filter(function(h){ return planned(h,key); }).sort(byTime); }
/* la journée du jour a-t-elle été validée ? */
function dayReady(){ return state.planned===today(); }
/* tant qu'elle ne l'est pas : rien d'autre que Jour et Profil */
function locked(tab){ return !dayReady() && tab!=='jour' && tab!=='profil'; }
function habitById(id){
  for(var i=0;i<state.habits.length;i++) if(state.habits[i].id===id) return state.habits[i];
  return null;
}
function entry(key,id){ return (state.log[key] && state.log[key][id]) || null; }
function ensure(key,id){
  if(!state.log[key]) state.log[key]={};
  if(!state.log[key][id]) state.log[key][id]={done:false,steps:[],pts:0,doneAt:null};
  var e=state.log[key][id];
  if(!Array.isArray(e.steps)) e.steps=[];
  return e;
}
function isDone(key,id){ var e=entry(key,id); return !!(e&&e.done); }
function stepsDone(key,h){
  var e=entry(key,h.id); if(!e||!e.steps) return 0;
  var n=0, len=(h.steps||[]).length;
  for(var i=0;i<len;i++) if(e.steps[i]) n++;
  return n;
}
/* 10 pts par tâche, +5 si validée dans l'heure qui suit son horaire */
function computePts(h,doneAt){
  var p=10;
  if(h.time && doneAt){ var d=toMin(doneAt)-toMin(h.time); if(d>=0 && d<=60) p+=5; }
  return p;
}
function setDone(key,h,val){
  var e=ensure(key,h.id);
  if(val){
    if(!e.done){
      e.doneAt = (key===today()) ? nowHM() : (h.time||'12:00');
      e.pts    = computePts(h,e.doneAt);
    }
    e.done=true;
    if((h.steps||[]).length) e.steps = h.steps.map(function(){ return true; });
  }else{
    e.done=false; e.doneAt=null; e.pts=0;
  }
  save();
}
function toggleStep(key,h,i){
  var e=ensure(key,h.id);
  e.steps[i] = !e.steps[i];
  var all = (h.steps||[]).length>0 && h.steps.every(function(_,j){ return !!e.steps[j]; });
  if(all && !e.done){
    e.done=true; e.doneAt=(key===today())?nowHM():(h.time||'12:00'); e.pts=computePts(h,e.doneAt);
    save(); return 'done';
  }
  if(!all && e.done){ e.done=false; e.doneAt=null; e.pts=0; }
  save(); return 'step';
}

/* -------------------------------------------------------------- scores */
function dayStat(key){
  var hs=habitsFor(key), d=0;
  for(var i=0;i<hs.length;i++) if(isDone(key,hs[i].id)) d++;
  return {done:d, total:hs.length, pct: hs.length ? Math.round(d*100/hs.length) : 0};
}
function dayPoints(key){
  var m=state.log[key]||{}, s=0;
  for(var k in m) if(m[k].done) s += (+m[k].pts || 10);
  return s;
}
function rangePoints(from,to){
  var s=0, d=new Date(from.getTime());
  while(d<=to){ s+=dayPoints(dk(d)); d=addDays(d,1); }
  return s;
}
function rangeStat(from,to){
  var done=0,total=0,d=new Date(from.getTime());
  while(d<=to){ var st=dayStat(dk(d)); done+=st.done; total+=st.total; d=addDays(d,1); }
  return {done:done,total:total,pct: total?Math.round(done*100/total):0};
}
function totalXP(){
  var s=0;
  for(var day in state.log){ var m=state.log[day]; for(var id in m) if(m[id].done) s+=(+m[id].pts||10); }
  return s;
}
function totalDone(){
  var n=0;
  for(var day in state.log){ var m=state.log[day]; for(var id in m) if(m[id].done) n++; }
  return n;
}
function doneBefore9(){
  var n=0;
  for(var day in state.log){ var m=state.log[day];
    for(var id in m){ var e=m[id]; if(e.done && e.doneAt && toMin(e.doneAt)<540) n++; } }
  return n;
}
function rankOf(xp){
  var i=0;
  for(var k=0;k<RANKS.length;k++) if(xp>=RANKS[k].xp) i=k;
  var cur=RANKS[i], nxt=RANKS[i+1]||null;
  var pct = nxt ? clamp(Math.round((xp-cur.xp)*100/(nxt.xp-cur.xp)),0,100) : 100;
  return {i:i, cur:cur, next:nxt, pct:pct, need: nxt ? nxt.xp-xp : 0};
}

/* premier jour connu (création d'habitude la plus ancienne ou plus vieux log) */
function firstDay(){
  var min=null;
  state.habits.forEach(function(h){ if(h.createdAt && (!min||h.createdAt<min)) min=h.createdAt; });
  for(var k in state.log){ if(!min||k<min) min=k; }
  return min || today();
}
function streakOf(h){
  var s=0, d=nowD(), t=today(), guard=0;
  while(guard++ < 1200){
    var key=dk(d);
    if(h.createdAt && key<h.createdAt) break;
    if(planned(h,key)){
      if(isDone(key,h.id)) s++;
      else if(key!==t) break;
    }
    d=addDays(d,-1);
  }
  return s;
}
function bestStreakOf(h){
  var best=0,cur=0,d=fromKey(h.createdAt||firstDay()),end=nowD();
  while(d<=end){
    var key=dk(d);
    if(planned(h,key)){
      if(isDone(key,h.id)){ cur++; if(cur>best) best=cur; }
      else if(key!==today()) cur=0;
    }
    d=addDays(d,1);
  }
  return best;
}
function globalStreak(){
  var s=0, d=nowD(), t=today(), first=firstDay(), guard=0;
  while(guard++ < 2000){
    var key=dk(d);
    if(key<first) break;
    var st=dayStat(key);
    if(st.total>0){
      if(st.done===st.total) s++;
      else if(key!==t) break;
    }
    d=addDays(d,-1);
  }
  return s;
}
function globalBestStreak(){
  var best=0,cur=0,d=fromKey(firstDay()),end=nowD();
  while(d<=end){
    var key=dk(d), st=dayStat(key);
    if(st.total>0){
      if(st.done===st.total){ cur++; if(cur>best) best=cur; }
      else if(key!==today()) cur=0;
    }
    d=addDays(d,1);
  }
  return best;
}
function perfectDays(){
  var n=0,d=fromKey(firstDay()),end=nowD();
  while(d<=end){ var st=dayStat(dk(d)); if(st.total>0 && st.done===st.total) n++; d=addDays(d,1); }
  return n;
}
function weekStat(monday){ return rangeStat(monday, addDays(monday,6)); }
function bestWeek(){
  var best=0,d=mondayOf(fromKey(firstDay())),end=mondayOf(nowD());
  while(d<=end){ var w=weekStat(d); if(w.total>0 && w.pct>best) best=w.pct; d=addDays(d,7); }
  return best;
}
function bestDayOfWeek(monday){
  var bp=-1,bd=null;
  for(var i=0;i<7;i++){
    var day=addDays(monday,i), st=dayStat(dk(day));
    if(st.total>0 && st.pct>bp){ bp=st.pct; bd=day; }
  }
  return bd ? {day:bd,pct:bp} : null;
}
function isLate(h,key){
  return key===today() && h.time && toMin(nowHM())>toMin(h.time) && !isDone(key,h.id);
}
function badgeState(){
  var xp=totalXP(), tot=totalDone(), gb=globalBestStreak();
  /* plus longue suite de jours consécutifs avec une note */
  var nk=Object.keys(state.notes).filter(function(k){ return String(state.notes[k]||'').trim(); }).sort();
  var notesRun=0, run=0, prev=null;
  nk.forEach(function(k){
    run = (prev && dk(addDays(fromKey(prev),1))===k) ? run+1 : 1;
    if(run>notesRun) notesRun=run;
    prev=k;
  });
  var got={
    b1: tot>=1, b2: perfectDays()>=1, b3: gb>=7, b4: gb>=30,
    b5: bestWeek()>=100, b6: tot>=100, b7: tot>=500,
    b8: doneBefore9()>=10, b9: (state.focus||0)>=10,
    b10:notesRun>=7, b11:Object.keys(state.weight).length>=4, b12:state.friends.length>=1
  };
  return {got:got, xp:xp};
}

function ring(pct,size){
  var r=52, c=2*Math.PI*r, off=c*(1-clamp(pct,0,100)/100);
  return '<div class="ringwrap"'+(size?' style="width:'+size+'px;height:'+size+'px;flex-basis:'+size+'px"':'')+'>'+
    '<svg class="ring'+(pct>=100?' full':'')+'" viewBox="0 0 120 120"'+(size?' style="width:'+size+'px;height:'+size+'px"':'')+'>'+
      '<circle class="bgc" cx="60" cy="60" r="'+r+'"></circle>'+
      '<circle class="fgc" cx="60" cy="60" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"></circle>'+
    '</svg>'+
    '<div class="ringtxt"><b>'+pct+'<span style="font-size:14px">%</span></b><small>DU JOUR</small></div></div>';
}
function quoteOfDay(){
  var d=nowD(), start=new Date(d.getFullYear(),0,0);
  var doy=Math.floor((d-start)/86400000);
  return QUOTES[doy % QUOTES.length];
}
function schedLabel(h){
  if(h.type==='once') return h.date===today() ? "Juste aujourd'hui" : 'Le '+frShort(fromKey(h.date));
  var ds=h.days||[];
  if(ds.length===7) return 'Tous les jours';
  if(ds.length===5 && [1,2,3,4,5].every(function(x){return ds.indexOf(x)>-1;})) return 'En semaine';
  if(ds.length===2 && ds.indexOf(0)>-1 && ds.indexOf(6)>-1) return 'Week-end';
  return DIDX.filter(function(x){ return ds.indexOf(x)>-1; })
             .map(function(x){ return DSHORT[x]; }).join(' · ');
}

function taskCard(h,key,done){
  var e=entry(key,h.id)||{};
  var ns=(h.steps||[]).length, ds=stepsDone(key,h), st=streakOf(h);
  var late=isLate(h,key);
  var meta=[];
  if(h.time) meta.push('<span class="'+(late?'late':'')+'">'+(late?'⚠ ':'')+esc(h.time)+'</span>');
  if(ns)     meta.push('<span>'+ds+'/'+ns+' étapes</span>');
  if(st>1)   meta.push('<span>🔥 '+st+' j</span>');
  if(done && e.doneAt) meta.push('<span class="grn">✓ '+esc(e.doneAt)+' · +'+(e.pts||10)+' pts</span>');
  if(h.type==='once' && !done) meta.push('<span>⚡ aujourd\'hui</span>');
  var sure = pendingDel===h.id;
  return '<article class="card lift task'+(done?' done':'')+'" data-act="open" data-id="'+h.id+'"'+
    (h.color?' style="--acc:'+esc(h.color)+'"':'')+'>'+
    '<span class="emo">'+esc(h.emoji||'⭐')+'</span>'+
    '<div class="tmain"><div class="tname">'+esc(h.name)+'</div>'+
      (meta.length?'<div class="tmeta">'+meta.join('')+'</div>':'')+'</div>'+
    '<div class="tright">'+
      '<button class="chk'+(done?' on':'')+'" data-act="toggle" data-id="'+h.id+'" aria-label="Valider">✓</button>'+
      '<button class="del'+(sure?' sure':'')+'" data-act="del" data-id="'+h.id+'" aria-label="Supprimer">'+(sure?'Sûr ?':'🗑️')+'</button>'+
    '</div></article>';
}

function viewJour(){
  var key=today(), hs=habitsFor(key), st=dayStat(key);
  var todo=hs.filter(function(h){ return !isDone(key,h.id); });
  var done=hs.filter(function(h){ return  isDone(key,h.id); });
  var h='';

  h+='<section class="card dayhead pop">'+ring(st.pct)+
     '<div class="dh"><div class="date">'+esc(frDate(nowD()))+'</div>'+
     '<h1>'+st.done+'/'+st.total+' tâche'+(st.total>1?'s':'')+'</h1>'+
     '<div class="chips">'+
       '<span class="chip"><b>+'+dayPoints(key)+'</b> pts du jour</span>'+
       '<span class="chip">🔥 <b>'+globalBestStreak()+' j</b> meilleure série</span>'+
     '</div>'+
     '<button class="btn pri sm" data-act="gofocus">⚡ Mode focus</button>'+
     '</div></section>';

  h+='<div class="sec"><h2>À faire</h2><span>'+todo.length+' restante'+(todo.length>1?'s':'')+'</span></div>';
  if(!todo.length){
    h+= hs.length
      ? '<div class="card empty"><span class="e">🏆</span><b>Journée bouclée.</b><br>Tout est validé, respect.</div>'
      : '<div class="card empty"><span class="e">🌱</span>Rien de prévu aujourd\'hui.<br>Appuie sur <b>+</b> pour créer une tâche.</div>';
  } else h+=todo.map(function(x){ return taskCard(x,key,false); }).join('');

  if(done.length){
    h+='<div class="sec"><h2>Fait</h2><span>'+done.length+' ✓</span></div>';
    h+=done.map(function(x){ return taskCard(x,key,true); }).join('');
  }

  h+='<button class="btn ghost wide sm" data-act="replan" style="margin-top:14px">✏️ Modifier ma journée</button>';
  h+='<div class="quote"><p>« '+esc(quoteOfDay())+' »</p><small>CADENCE · '+esc(frShort(nowD()))+'</small></div>';
  return h;
}

var openHabit=null, timers={};

function stepSecs(txt){
  var m=String(txt).match(/(\d+)\s*(?:[-–à]\s*\d+\s*)?min/i);
  return m ? (+m[1])*60 : 0;
}
function openSheet(html){ $('#sheet').innerHTML='<div class="grab"></div>'+html; $('#modal').classList.add('open'); }
function closeSheet(){ $('#modal').classList.remove('open'); openHabit=null; formData=null; }

  var h=openHabit; if(!h) return;

      (h.time?esc(h.time)+' · ':'')+esc(schedLabel(h))+' · 🔥 '+streakOf(h)+' j'+

      var tb='';

        tb='<button class="tmr'+(t&&t.run?' run':'')+'" data-act="timer" data-i="'+i+'" data-key="'+tk+'">'+
           (t&&t.run?'⏸ ':'⏱ ')+mmss(left)+'</button>';

             '<span class="box">✓</span><span class="lbl">'+esc(s)+'</span>'+tb+'</button>';
    }).join('')+'</div>';
    var n=stepsDone(key,h);
    out+='<div class="muted small center" style="margin-bottom:4px">'+n+' / '+steps.length+' étapes'+
         (e.done?' · <span class="grn">validée à '+esc(e.doneAt||'')+' (+'+(e.pts||10)+' pts)</span>':'')+'</div>';
  }else{
    out+='<div class="empty" style="padding:16px 0">Pas d\'étapes sur cette tâche.<br>Valide-la d\'un coup 👇</div>';

  out+='<div class="sactions">'+
    '<button class="btn ghost" data-act="editHabit">✏️ Modifier</button>'+

            : '<button class="btn ok" data-act="validate">Valider ✅</button>')+

  openSheet(out);

/* -------------------------------------------------------------- ONGLET STATS */
function lvl(pct,total){
  if(!total)  return '';
  if(pct<=0)  return 'miss';
  if(pct<34)  return 'l1';
  if(pct<67)  return 'l2';
  if(pct<100) return 'l3';
  return 'l4';
}
function monthGrid(){
  var m = statsMonth || new Date(nowD().getFullYear(), nowD().getMonth(), 1);
  var y=m.getFullYear(), mo=m.getMonth();
  var first=new Date(y,mo,1), ndays=new Date(y,mo+1,0).getDate();
  var lead=(first.getDay()+6)%7, t=today();
  var cells='';
  for(var i=0;i<lead;i++) cells+='<div class="mcell pad"></div>';
  var mdone=0,mtotal=0;
  for(var d=1;d<=ndays;d++){
    var key=y+'-'+pad(mo+1)+'-'+pad(d), st=dayStat(key), fut=key>t;
    if(!fut){ mdone+=st.done; mtotal+=st.total; }   /* le futur ne compte pas comme raté */
    var cls=fut?'fut':lvl(st.pct,st.total);
    cells+='<div class="mcell '+cls+(key===t?' today':'')+'" data-act="dayinfo" data-day="'+key+'" title="'+key+'">'+d+'</div>';
  }
  var label=MONTHS[mo].charAt(0).toUpperCase()+MONTHS[mo].slice(1)+' '+y;
  var pct=mtotal?Math.round(mdone*100/mtotal):0;
  return {html:
    '<section class="card pop">'+
      '<div class="mnav"><button data-act="mprev">◀</button><b>'+esc(label)+' · '+pct+'%</b><button data-act="mnext">▶</button></div>'+
      '<div class="mhead">'+DL.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>'+
      '<div class="mgrid">'+cells+'</div>'+
      '<div class="legend">moins <i style="background:var(--card2)"></i>'+
        '<i style="background:rgba(62,207,142,.22)"></i><i style="background:rgba(62,207,142,.42)"></i>'+
        '<i style="background:rgba(62,207,142,.68)"></i><i style="background:var(--grn)"></i> plus</div>'+
    '</section>', done:mdone, total:mtotal, pct:pct, y:y, mo:mo};
}
function weeksChart(){
  var mon=mondayOf(nowD()), arr=[];
  for(var i=7;i>=0;i--){ var m=addDays(mon,-7*i); var w=weekStat(m); arr.push({m:m,pct:w.pct,total:w.total}); }
  var best=0; arr.forEach(function(a){ if(a.total&&a.pct>best) best=a.pct; });
  return '<section class="card pop"><div class="bars">'+arr.map(function(a){
    var hgt=a.total?Math.max(4,Math.round(a.pct*0.9)):3;   /* px : 100% -> 90px */
    var cls=a.total?(a.pct===best&&best>0?'best':'has'):'';
    return '<div class="barw"><span class="barv">'+(a.total?a.pct+'%':'–')+'</span>'+
      '<div class="bar '+cls+'" style="height:'+hgt+'px"></div>'+
      '<small>'+a.m.getDate()+'/'+(a.m.getMonth()+1)+'</small></div>';
  }).join('')+'</div></section>';
}
function weekTable(){
  var mon=mondayOf(nowD()), t=today();
  var ids={}, rows=[];
  for(var i=0;i<7;i++){
    habitsFor(dk(addDays(mon,i))).forEach(function(h){ if(!ids[h.id]){ ids[h.id]=1; rows.push(h); } });
  }
  if(!rows.length) return '<div class="card empty">Rien de planifié cette semaine.</div>';
  var head='<tr><th class="n" style="text-align:left">Habitude</th>'+DL.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
  var body=rows.map(function(h){
    var tds='';
    for(var i=0;i<7;i++){
      var key=dk(addDays(mon,i));
      if(!planned(h,key))          tds+='<td class="na">·</td>';
      else if(isDone(key,h.id))    tds+='<td class="yes">✓</td>';
      else if(key>=t)              tds+='<td class="na">◦</td>';
      else                         tds+='<td class="no">✕</td>';
    }
    return '<tr><td class="n">'+esc(h.emoji||'')+' '+esc(h.name)+'</td>'+tds+'</tr>';
  }).join('');
  return '<section class="card pop"><table class="wtable">'+head+body+'</table></section>';
}
function viewStats(){
  var t=today(), mon=mondayOf(nowD()), prevMon=addDays(mon,-7);
  var mg=monthGrid();
  var wk=weekStat(mon), pw=weekStat(prevMon);

  h+='<section class="card bilan pop"><h3>Cette semaine</h3><p>'+
      '<b>'+wk.pct+'%</b> de régularité ('+wk.done+'/'+wk.total+') '+arrow(dPct,' % vs S-1')+'.<br>'+
      (bd ? 'Meilleur jour : <b>'+DAYS[bd.day.getDay()]+'</b> ('+bd.pct+'%). ' : '')+
      '<b>'+wkPts+' pts</b> '+arrow(dPts,' pts')+'.'+
    '</p></section>';

  var wKeys=Object.keys(state.weight).sort();

    '</p></section>';

function weightSpark(){
  var keys=Object.keys(state.weight).sort().slice(-30);
  if(keys.length<2){
    return '<div class="empty" style="padding:18px 0">'+
      (keys.length? 'Une seule pesée ('+state.weight[keys[0]]+' kg). Note-en une autre pour voir la courbe.'
                  : 'Aucune pesée. Note ton poids pour lancer la courbe.')+'</div>';
  }
  var vals=keys.map(function(k){ return state.weight[k]; });
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx-mn<1){ mn-=0.5; mx+=0.5; }
  var W=320,H=110,P=8,PT=14,PB=18;
  var x=function(i){ return P + i*(W-2*P)/(keys.length-1); };
  var y=function(v){ return PT + (mx-v)*(H-PT-PB)/(mx-mn); };
  var pts=vals.map(function(v,i){ return x(i).toFixed(1)+','+y(v).toFixed(1); }).join(' ');
  var area='M'+x(0).toFixed(1)+','+(H-PB)+' L'+pts.split(' ').join(' L')+' L'+x(keys.length-1).toFixed(1)+','+(H-PB)+' Z';
  var last=vals[vals.length-1], first=vals[0], diff=+(last-first).toFixed(1);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#FF4D36" stop-opacity=".45"/>'+
      '<stop offset="100%" stop-color="#FF4D36" stop-opacity="0"/></linearGradient></defs>'+
    '<line class="gl" x1="'+P+'" y1="'+PT+'" x2="'+(W-P)+'" y2="'+PT+'"/>'+
    '<line class="gl" x1="'+P+'" y1="'+(H-PB)+'" x2="'+(W-P)+'" y2="'+(H-PB)+'"/>'+
    '<path class="ar" d="'+area+'"/>'+
    '<polyline class="ln" points="'+pts+'"/>'+
    '<circle class="dt" cx="'+x(keys.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="3.5"/>'+
    '<text x="'+P+'" y="'+(PT-4)+'">'+mx.toFixed(1)+' kg</text>'+
    '<text x="'+P+'" y="'+(H-5)+'">'+mn.toFixed(1)+' kg</text>'+
    '<text x="'+(W-P)+'" y="'+(H-5)+'" text-anchor="end">'+keys.length+' pesées · '+(diff>0?'+':'')+diff+' kg</text>'+
  '</svg>';
}

function periodScores(){
  var t=today(), mon=mondayOf(nowD()), d=nowD();
  return {
    day:   dayPoints(t),
    dayK:  t,
    week:  rangePoints(mon, addDays(mon,6)),
    weekK: dk(mon),
    month: rangePoints(new Date(d.getFullYear(),d.getMonth(),1), new Date(d.getFullYear(),d.getMonth()+1,0)),
    monthK:d.getFullYear()+'-'+pad(d.getMonth()+1),
    xp:    totalXP()
  };
}
function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s))); }
function myCode(){
  var s=periodScores(), p=state.profile;
  return b64e(JSON.stringify({
    i:p.id, n:p.name, a:p.avatar,
    d:[s.day,s.dayK], w:[s.week,s.weekK], m:[s.month,s.monthK],
    x:s.xp, t:today()
  }));
}
function addFriend(code){
  var raw=String(code||'').replace(/\s+/g,'');
  if(!raw){ toast('Colle d\'abord un code ami','📋'); return; }
  var o;
  try{ o=JSON.parse(b64d(raw)); }catch(e){ toast('Code invalide','❌'); return; }
  if(!o || !o.i || !o.n){ toast('Code invalide','❌'); return; }
  if(o.i===state.profile.id){ toast('C\'est ton propre code 😄','🙃'); return; }
  var f={ id:o.i, name:String(o.n).slice(0,20), avatar:o.a||'💪',
          day:+(o.d&&o.d[0])||0,  dayK:(o.d&&o.d[1])||'',
          week:+(o.w&&o.w[0])||0, weekK:(o.w&&o.w[1])||'',
          month:+(o.m&&o.m[0])||0,monthK:(o.m&&o.m[1])||'',
          xp:+o.x||0, at:o.t||today() };
  var idx=-1;
  for(var i=0;i<state.friends.length;i++) if(state.friends[i].id===f.id) idx=i;
  if(idx>-1){ state.friends[idx]=f; toast(f.name+' mis à jour','🔄'); }
  else { state.friends.push(f); toast(f.name+' ajouté au classement','🤝'); }
  save(); buzz(30); render();
}
function ageTxt(k){
  if(!k) return '';

}

  var rows=[{id:p.id,name:p.name,avatar:p.avatar,pts:s[field],xp:s.xp,me:true,age:''}];
  state.friends.forEach(function(f){
    rows.push({ id:f.id, name:f.name, avatar:f.avatar,
      pts: (f[keyf]===mine ? (f[field]||0) : 0), xp:f.xp||0, me:false, age:ageTxt(f.at) });

  rows.sort(function(a,b){ return b.pts-a.pts || b.xp-a.xp || a.name.localeCompare(b.name); });

function saveForm(){
  readForm();
  var f=formData;
  var name=String(f.name||'').trim();
  if(!name){ toast('Il faut un nom','✏️'); return; }
  if(f.type==='rec' && !f.days.length){ toast('Choisis au moins un jour','📅'); return; }
  var steps=String(f.steps||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean).slice(0,20);
  var t=today();

  if(f.id){
    var h=habitById(f.id); if(!h){ closeSheet(); return; }
    var oldSteps=(h.steps||[]).slice();
    h.name=name; h.emoji=f.emoji; h.time=f.time; h.type=f.type;
    h.days=f.type==='rec'?f.days.slice():[]; h.date=f.type==='once'?(h.date||t):null;
    h.steps=steps; h.color=f.color;
    /* on garde les cases cochées dont le texte n'a pas bougé */
    var e=entry(t,h.id);
    if(e){
      var mapped=steps.map(function(s){ var i=oldSteps.indexOf(s); return i>-1 ? !!e.steps[i] : false; });
      e.steps=mapped;
      if(steps.length && !mapped.every(Boolean) && e.done){ e.done=false; e.doneAt=null; e.pts=0; }
    }
    toast('Modifié','✅');
  }else{
    state.habits.push({
      id:uid(), name:name, emoji:f.emoji, time:f.time,
      type:f.type, days:f.type==='rec'?f.days.slice():[], date:f.type==='once'?t:null,
      color:f.color, steps:steps, createdAt:t
    });
    toast('Tâche créée','🔥');
  }
  save(); buzz(30); closeSheet(); render();
}
function delHabit(id){
  var i=-1;
  for(var k=0;k<state.habits.length;k++) if(state.habits[k].id===id) i=k;
  if(i<0) return;
  var n=state.habits[i].name;
  state.habits.splice(i,1);
  save(); buzz([20,40,20]); toast(n+' supprimée','🗑️'); render();
}
function visibleHabits(){
  var t=today();
  return state.habits.filter(function(h){ return !(h.type==='once' && h.date && h.date<t); });
}
/* on échange avec le voisin *visible* : les tâches passées cachées ne bloquent pas */
function moveHabit(id,dir){
  var vis=visibleHabits(), vi=-1;
  for(var k=0;k<vis.length;k++) if(vis[k].id===id) vi=k;
  var vj=vi+dir;
  if(vi<0 || vj<0 || vj>=vis.length) return;
  var idx=function(hid){ for(var n=0;n<state.habits.length;n++) if(state.habits[n].id===hid) return n; return -1; };
  var a=idx(vis[vi].id), b=idx(vis[vj].id);
  if(a<0||b<0) return;
  var tmp=state.habits[a]; state.habits[a]=state.habits[b]; state.habits[b]=tmp;
  save(); buzz(15); render();
}

function toggleTimer(tk,i){
  var h=openHabit; if(!h) return;
  var secs=stepSecs((h.steps||[])[i]||''); if(!secs) return;
  var t=timers[tk];
  if(!t){ timers[tk]={left:secs,run:true,total:secs,hid:h.id,i:i}; buzz(20); }
  else   { t.run=!t.run; if(t.left<=0){ t.left=t.total; t.run=true; } }
  renderSheet();
}
setInterval(function(){
  var changed=false;
  for(var k in timers){
    var t=timers[k];
    if(!t.run) continue;
    t.left--;
    if(t.left<=0){
      t.left=0; t.run=false; changed=true;
      buzz([160,80,160,80,260]);
      var h=habitById(t.hid);
      if(h){
        var e=ensure(today(),h.id);
        if(!e.steps[t.i]){ toggleStep(today(),h,t.i); }
        toast('Chrono terminé — '+((h.steps||[])[t.i]||''),'⏱');
      }
    }
    /* mise à jour légère du bouton sans re-render complet */
    var btn=document.querySelector('.tmr[data-key="'+k+'"]');
    if(btn) btn.textContent=(t.run?'⏸ ':'⏱ ')+mmss(t.left);
  }
  if(changed && openHabit) renderSheet();
  if(changed) render();
},1000);

function checkReminders(){
  if(!dayReady() || coachOn) return;   /* rien à rappeler tant que la journée n'est pas posée */
  var key=today(), now=toMin(nowHM());
  if(!state.notified[key]) state.notified[key]={};
  var hs=habitsFor(key);
  for(var i=0;i<hs.length;i++){
    var h=hs[i];
    if(!h.time || isDone(key,h.id)) continue;
    if(now < toMin(h.time) || now > toMin(h.time)+180) continue;   /* fenêtre de 3 h */
    if(state.notified[key][h.id]) continue;
    state.notified[key][h.id]=true;
    /* purge des vieux jours */
    for(var k in state.notified){ if(k<dk(addDays(nowD(),-7))) delete state.notified[k]; }
    save();
    showBanner(h);
    buzz([120,60,120]);
    try{
      if(window.Notification && Notification.permission==='granted'){
        new Notification('Cadence — '+h.name, {body:"C'est l'heure ("+h.time+") 💪", tag:'cadence_'+h.id+'_'+key});
      }
    }catch(e){}
    break;
  }
}
function askNotif(){
  if(!window.Notification){ toast('Notifications non supportées ici','ℹ️'); return; }
  if(Notification.permission==='granted'){ toast('Déjà autorisées','✅'); return; }
  var done=false;
  var after=function(p){
    if(done) return; done=true;
    toast(p==='granted'?'Notifications autorisées':'Refusé — la bannière suffira', p==='granted'?'🔔':'🙃');
  };
  try{
    var r=Notification.requestPermission(after);      /* vieux Safari : callback */
    if(r && r.then) r.then(after).catch(function(){}); /* moderne : promesse   */
  }catch(e){ toast('Notifications indisponibles','ℹ️'); }
}

function icsEsc(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function makeICS(){
  var BY=['SU','MO','TU','WE','TH','FR','SA'];
  var stamp=function(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
    pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'; };
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cadence//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Cadence'];
  var n=0, t=today();
  state.habits.forEach(function(h){
    if(!h.time) return;
    var d0;
    if(h.type==='once'){ if(!h.date || h.date<t) return; d0=fromKey(h.date); }
    else{
      if(!(h.days||[]).length) return;
      d0=nowD();
      for(var i=0;i<7;i++){ var c=addDays(nowD(),i); if(h.days.indexOf(c.getDay())>-1){ d0=c; break; } }
    }
    var hm=h.time.split(':');
    var start=d0.getFullYear()+pad(d0.getMonth()+1)+pad(d0.getDate())+'T'+pad(+hm[0])+pad(+hm[1]||0)+'00';
    n++;
    L.push('BEGIN:VEVENT');
    L.push('UID:'+h.id+'@cadence');
    L.push('DTSTAMP:'+stamp(new Date()));
    L.push('DTSTART:'+start);
    L.push('DURATION:PT30M');
    if(h.type!=='once') L.push('RRULE:FREQ=WEEKLY;BYDAY='+h.days.slice().sort().map(function(x){return BY[x];}).join(','));
    L.push('SUMMARY:'+icsEsc((h.emoji||'')+' '+h.name));
    L.push('DESCRIPTION:'+icsEsc('Cadence — '+((h.steps||[]).join(' · ')||'À faire')));
    L.push('BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(h.name),'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  if(!n){ toast('Aucune habitude avec une heure','📅'); return; }
  var txt=L.join('\r\n');
  try{
    var blob=new Blob([txt],{type:'text/calendar;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='cadence.ics'; a.rel='noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
    toast('Ouvre le fichier pour l\'ajouter à ton agenda','📅');
  }catch(e){
    window.open('data:text/calendar;charset=utf-8,'+encodeURIComponent(txt),'_blank');
  }
}
function copyText(txt,msg){
  var ok=function(){ toast(msg||'Copié','📋'); buzz(25); };
  var fallback=function(){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt; ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,999999);
      var done=document.execCommand('copy');
      document.body.removeChild(ta);
      done ? ok() : toast('Copie impossible — sélectionne le texte à la main','⚠️');
    }catch(e){ toast('Copie impossible','⚠️'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(fallback);
  } else fallback();
}
function exportData(){
  var txt=JSON.stringify(state);
  var ta=$('#backup'); if(ta) ta.value=txt;
  copyText(txt,'Sauvegarde copiée');
}
function importData(){
  var ta=$('#backup');
  var raw=ta?String(ta.value||'').trim():'';
  if(!raw){ toast('Colle d\'abord ta sauvegarde','📥'); return; }
  var o;
  try{ o=JSON.parse(raw); }catch(e){ toast('Sauvegarde illisible','❌'); return; }
  if(!o || typeof o!=='object' || !Array.isArray(o.habits)){ toast('Sauvegarde invalide','❌'); return; }
  if(!window.confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
  var d=defaults();
  for(var k in d){ if(!(k in o)) o[k]=d[k]; }
  state=o; save(); toast('Données restaurées','✅'); render();
}

/* la note du journal est en saisie libre : on la range avant tout re-render */
function flushNote(){

  if((state.notes[k]||'')===ta.value) return;

document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  flushNote();
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id'), key=today();

  /* --- navigation --- */
  if(a==='tab'){
    var nt=el.getAttribute('data-tab');
    if(locked(nt)){ buzz([15,40,15]); toast('Valide d\'abord tes tâches du jour','🔒'); return; }
    state.tab=nt; pendingDel=null; save(); render(); toTop(); return;
  }
  if(a==='ptoggle'){
    var pk=today();
    if(!state.off[pk]) state.off[pk]=[];
    var pi=state.off[pk].indexOf(id);
    if(pi>-1){
      state.off[pk].splice(pi,1);
    }else{
      state.off[pk].push(id);
      /* retirée de la journée = pas faite aujourd'hui : on efface son résultat du jour,
         sinon ses points resteraient comptés alors que la tâche n'apparaît plus. */
      if(state.log[pk] && state.log[pk][id]){
        var was=state.log[pk][id].done;
        delete state.log[pk][id];
        if(was) toast('Retirée de la journée — ses points sont annulés','↩︎');
      }
    }
    save(); buzz(18); render(); return;
  }
  if(a==='planok'){
    state.planned=today(); save(); buzz([30,50,30]);
    var kept=habitsFor(today()).length;
    toast(kept? 'Journée validée · '+kept+' tâche'+(kept>1?'s':'') : 'Journée de repos validée','🔓');
    render(); toTop();
    if(!state.tutoSeen) setTimeout(function(){ startTour(Math.max(state.tutoStep,PART1), TOUR.length); }, 480);
    return;
  }
  if(a==='replan'){ state.planned=''; save(); render(); toTop(); return; }
  if(a==='theme'){ state.theme = state.theme==='dark'?'light':'dark'; save(); render(); return; }
  if(a==='gofocus'){ focusOpen(); return; }
  if(a==='bclose'){ $('#banner').classList.add('hide'); return; }

  /* --- tâches --- */
  if(a==='new'){ openForm(null); return; }
  if(a==='open'){ openTask(id); return; }
  if(a==='toggle'){
    var h=habitById(id); if(!h) return;
    var was=isDone(key,h.id);
    setDone(key,h,!was);
    if(!was){ buzz([25,40,25]); toast('+'+(entry(key,h.id).pts)+' pts — '+h.name,'✅'); }
    render(); return;
  }
  if(a==='del'){
    if(pendingDel===id){ clearTimeout(delT); pendingDel=null; delHabit(id); }
    else{
      pendingDel=id; render(); buzz(15);
      clearTimeout(delT);
      delT=setTimeout(function(){ pendingDel=null; render(); },3000);
    }
    return;
  }
  if(a==='edit'){ var he=habitById(id); if(he) openForm(he); return; }
  if(a==='up'){   moveHabit(id,-1); return; }
  if(a==='down'){ moveHabit(id, 1); return; }

  /* --- fiche routine --- */
  if(a==='closesheet'){ closeSheet(); render(); return; }
  if(a==='step'){
    if(!openHabit) return;
    var r=toggleStep(key,openHabit,+el.getAttribute('data-i'));
    buzz(r==='done'?[30,50,30]:15);
    if(r==='done') toast('Tâche validée — +'+(entry(key,openHabit.id).pts)+' pts','🔥');
    renderSheet(); render(); return;
  }
  if(a==='timer'){ toggleTimer(el.getAttribute('data-key'), +el.getAttribute('data-i')); return; }
  if(a==='editHabit'){ if(openHabit) openForm(openHabit); return; }
  if(a==='validate'){
    if(!openHabit) return;
    setDone(key,openHabit,true); buzz([30,50,30]);
    toast('+'+(entry(key,openHabit.id).pts)+' pts','✅');
    closeSheet(); render(); return;
  }
  if(a==='undo'){ if(!openHabit) return; setDone(key,openHabit,false); renderSheet(); render(); return; }

  /* --- formulaire --- */
  if(a==='femoji'){ readForm(); formData.emoji=el.getAttribute('data-e'); renderForm(); return; }
  if(a==='ftype'){  readForm(); formData.type =el.getAttribute('data-t');  renderForm(); return; }
  if(a==='fday'){
    readForm();
    var d=+el.getAttribute('data-d'), i=formData.days.indexOf(d);
    if(i>-1) formData.days.splice(i,1); else formData.days.push(d);
    renderForm(); return;
  }
  if(a==='fcolor'){ readForm(); formData.color=el.getAttribute('data-c'); renderForm(); return; }
  if(a==='fsave'){  saveForm(); return; }

  /* --- stats --- */
  if(a==='mprev'||a==='mnext'){
    var m=statsMonth||new Date(nowD().getFullYear(),nowD().getMonth(),1);
    statsMonth=new Date(m.getFullYear(), m.getMonth()+(a==='mnext'?1:-1), 1);
    render(); return;
  }
  if(a==='dayinfo'){
    var dkey=el.getAttribute('data-day'), s=dayStat(dkey);
    toast(frShort(fromKey(dkey))+' — '+(dkey>today() ? s.total+' tâche'+(s.total>1?'s':'')+' à venir'
      : s.total ? s.done+'/'+s.total+' ('+s.pct+'%) · '+dayPoints(dkey)+' pts' : 'rien de prévu'),'📅');
    return;
  }

  /* --- journal --- */
  if(a==='mood'){
    var mi=+el.getAttribute('data-i');
    if(state.mood[key]===mi) delete state.mood[key]; else state.mood[key]=mi;
    save(); buzz(20); render(); return;
  }
  if(a==='wsave'){
    var w=$('#wval'), v=w?String(w.value).trim():'';
    if(!v){ delete state.weight[key]; save(); toast('Pesée effacée','🗑️'); render(); return; }
    var n=num(v,null);
    if(n===null || n<=0 || n>400){ toast('Poids invalide','⚠️'); return; }
    state.weight[key]=Math.round(n*10)/10; save(); buzz(25); toast('Poids noté : '+state.weight[key]+' kg','⚖️'); render(); return;
  }

  /* --- profil --- */
  if(a==='lb'){ lbTab=el.getAttribute('data-p'); render(); return; }
  if(a==='avatar'){
    var pn=$('#pname'); if(pn) state.profile.name=pn.value.trim()||'Moi';
    state.profile.avatar=el.getAttribute('data-a'); save(); buzz(20); render(); return;
  }
  if(a==='psave'){
    var p2=$('#pname');
    state.profile.name=(p2?p2.value.trim():'')||'Moi';
    save(); toast('Profil enregistré','👤'); render(); return;
  }
  if(a==='badge'){
    var bid=el.getAttribute('data-b'), st2=badgeState();
    for(var bi=0;bi<BADGES.length;bi++){
      if(BADGES[bi].id===bid) toast(BADGES[bi].n+' — '+BADGES[bi].d, st2.got[bid]?'✅':'🔒');
    }
    return;
  }
  if(a==='mycode'){ copyText(myCode(),'Ton code ami est copié'); return; }
  if(a==='addfriend'){ var fc=$('#fcode'); addFriend(fc?fc.value:''); return; }
  if(a==='unfriend'){
    if(!window.confirm('Retirer cet ami du classement ?')) return;
    state.friends=state.friends.filter(function(f){ return f.id!==id; });
    save(); toast('Ami retiré','🗑️'); render(); return;
  }
  if(a==='ics'){ makeICS(); return; }
  if(a==='notifperm'){ askNotif(); return; }
  if(a==='export'){ exportData(); return; }
  if(a==='import'){ importData(); return; }

  /* --- tutoriel --- */
  if(a==='cnop')  return;
  if(a==='cnext'){ if(coachOn) coachNext(); return; }
  if(a==='cprev'){ coachPrev(); return; }
  if(a==='cskip'){ closeTour(true); toast('Tuto passé — tu peux le revoir dans Profil › Aide','👍'); return; }
  if(a==='retuto'){
    state.tutoSeen=false; state.tutoStep=dayReady()?PART1:0; save();
    maybeTour(); return;
  }

  /* --- focus --- */
  if(a==='fxclose'){ focusClose(); return; }
  if(a==='fxstep'){
    var l=focusList(); if(!l.length) return;
    var r2=toggleStep(key,l[0],+el.getAttribute('data-i'));
    buzz(r2==='done'?[30,50,30]:15);
    if(r2==='done'){ fxStart=Date.now(); toast('Validée 🔥','✅'); }
    focusRender(); return;
  }
  if(a==='fxdone'){
    var l2=focusList(); if(!l2.length) return;
    setDone(key,l2[0],true); buzz([30,50,30]);
    toast('+'+(entry(key,l2[0].id).pts)+' pts','✅');
    fxStart=Date.now(); focusRender(); return;
  }
  if(a==='fxskip'){
    var l3=focusList(); if(!l3.length) return;
    fxSkipped.push(l3[0].id); fxStart=Date.now(); buzz(15); focusRender(); return;
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.key!=='Escape') return;
  if($('#focus').classList.contains('open')) focusClose();
  else if($('#modal').classList.contains('open')){ closeSheet(); render(); }
});

function toTop(){ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

/* ======================================================================= */
/*                        TUTORIEL (projecteur)                            */
/* ======================================================================= */
/* Un seul parcours, coupé en deux : les 5 premières étapes expliquent l'écran
   de choix de la journée, les suivantes visitent l'app une fois débloquée.  */
var TOUR=[
 /* ---------- partie 1 : poser sa journée ---------- */
 {tab:'jour', sel:null, t:'Bienvenue dans Cadence',
  x:"Ton carnet de discipline. Tout reste sur ton téléphone, rien ne part sur internet. Trente secondes de visite et tu sais tout faire."},
 {tab:'jour', sel:'#planhead', t:'Chaque jour commence ici',
  x:"Avant d'attaquer, tu poses ta journée. Tant qu'elle n'est pas validée, seuls cet écran et ton profil sont ouverts — le reste attend."},
 {tab:'jour', sel:'.pcard', t:'Garde-la ou retire-la',
  x:"Touche une tâche pour la sortir de la journée : imprévu, blessure, repos. Une tâche retirée ne compte pas contre toi dans les stats."},
 {tab:'jour', sel:'#fab', t:'Ajoute ce que tu veux',
  x:"Le + crée une tâche : nom, emoji, heure de rappel, répétition (⚡ juste aujourd'hui ou 🔁 récurrente avec les jours), étapes et couleur."},
 {tab:'jour', sel:'[data-act="planok"]', t:'Valide ta journée',
  x:"Ce bouton ouvre Stats, Habitudes et Journal. Appuie dessus quand ta liste te va — la visite reprend juste après."},
 /* ---------- partie 2 : l'app débloquée ---------- */
 {tab:'jour', sel:'.dayhead', t:'Ton tableau de bord',
  x:"L'anneau, c'est le pourcentage de ta journée. À côté : les points gagnés et ta meilleure série. Le bouton ⚡ lance le mode focus, une tâche à la fois avec le chrono qui tourne."},
 {tab:'jour', sel:'.task', t:'Une tâche, une routine',
  x:"Emoji, heure (rouge si elle est passée), avancement des étapes et série 🔥. Touche la carte : ses étapes se cochent une par une, et un chrono ⏱ apparaît sur celles écrites en « 5 min » ou « 20 min »."},
 {tab:'jour', sel:'.tright', t:'Valider, ou supprimer',
  x:"La coche valide d'un coup : 10 points, et 5 de plus si tu la fais dans l'heure qui suit son horaire. La poubelle, elle, demande confirmation en deux taps."},
 {tab:'stats', sel:'.mgrid', t:'Ton mois en un coup d\'œil',
  x:"Une case par jour : plus c'est vert, plus tu as tenu. Rouge pâle quand la journée a été ratée, éteint pour ce qui n'est pas encore arrivé. Les flèches ◀ ▶ changent de mois."},
 {tab:'stats', sel:'.bars', t:'Ta régularité',
  x:"Les huit dernières semaines, la meilleure en vert. En dessous : le tableau de la semaine, tes records, et trois bilans écrits tout seuls (aujourd'hui, la semaine, le mois)."},
 {tab:'journal', sel:'.moods', t:'Le journal',
  x:"Ton humeur en un tap, une note qui s'enregistre au fil de la frappe, ton poids avec la courbe des trente dernières pesées."},
 {tab:'profil', sel:'.rankcard', t:'Ton rang',
  x:"Tous tes points s'additionnent en XP, et l'XP donne ton rang : Recrue, Soldat, Guerrier, Machine, Inarrêtable, Légende."},
 {tab:'profil', sel:'.badges', t:'Douze badges',
  x:"Ils tombent tout seuls : première tâche, journée parfaite, série de trente, cinq cents tâches… Ils restent gris tant qu'ils ne sont pas gagnés."},
 {tab:'profil', sel:'.lbtabs', t:'Le classement entre potes',
  x:"Copie ton code ami, envoie-le par SMS, colle le sien : vous vous comparez sur le jour, la semaine et le mois. Aucun compte à créer, aucun serveur."},
 {tab:'profil', sel:'#helpbox', t:'L\'aide, et les rappels',
  x:"Installation sur l'écran d'accueil, explication franche des notifications (avec le fichier .ics pour être prévenu même app fermée), et la sauvegarde de tes données."},
 {sel:null, t:'À toi de jouer',
  x:"Une tâche cochée, c'est un vote pour la personne que tu veux devenir. Reviens demain. Et le jour d'après."}
];
var PART1=5;                      /* étapes 0..4 : avant la validation du jour */
var coachOn=false, coachI=0, coachTo=0;

function startTour(from,to){
  coachOn=true; coachI=from; coachTo=to;
  $('#coach').classList.add('on');
  coachShow();
}
function closeTour(done){
  coachOn=false;
  $('#coach').classList.remove('on');
  state.tutoStep=coachI;
  if(done){ state.tutoSeen=true; state.tutoStep=TOUR.length; state.tab='jour'; }
  save(); render();
}
function coachShow(){
  var st=TOUR[coachI];
  if(!coachOn || !st){ closeTour(true); return; }
  if(st.tab && state.tab!==st.tab){ state.tab=st.tab; render(); }
  var el = st.sel ? $(st.sel) : null;
  if(el){
    try{
      /* un élément fixe (le +, la barre d'onglets) ne bouge pas ; les autres,
         on les remonte juste sous l'en-tête pour dégager la place en dessous. */
      if(getComputedStyle(el).position!=='fixed'){
        window.scrollBy(0, el.getBoundingClientRect().top - ($('#topbar').offsetHeight+12));
      }
    }catch(e){}
  }
  setTimeout(function(){ coachPlace(st); },80);
}
function coachPlace(st){
  if(!coachOn) return;
  var hole=$('#chole'), box=$('#cbox');
  var el = st.sel ? $(st.sel) : null, r=null;
  if(el){
    r=el.getBoundingClientRect();
    if(r.width<2 || r.height<2 || r.bottom<0 || r.top>window.innerHeight) { el=null; r=null; }
  }
  if(r){
    var pad = st.pad==null ? 8 : st.pad;
    hole.className='';
    hole.style.left  =(r.left-pad)+'px';
    hole.style.top   =(r.top-pad)+'px';
    hole.style.width =(r.width+pad*2)+'px';
    hole.style.height=(r.height+pad*2)+'px';
  }else{
    hole.className='none';
    hole.style.left='50%'; hole.style.top='50%'; hole.style.width='0px'; hole.style.height='0px';
  }
  var last = coachI===coachTo-1;
  var partEnd = last && coachTo===PART1;      /* fin de la partie 1 : on rend la main */
  box.innerHTML=
    '<div class="cstep">Étape '+(coachI+1)+' sur '+TOUR.length+'</div>'+
    '<h3>'+esc(TOUR[coachI].t)+'</h3><p>'+esc(TOUR[coachI].x)+'</p>'+
    '<div class="cnav">'+
      '<button class="skip" data-act="cskip">Passer le tuto</button>'+
      (coachI>0 ? '<button class="btn sm" data-act="cprev">◀</button>' : '')+
      '<button class="btn pri sm" data-act="cnext">'+
        (partEnd ? "J'ai compris" : last ? "C'est parti 🔥" : 'Suivant ▶')+'</button>'+
    '</div>'+
    '<div class="cdots">'+TOUR.map(function(_,i){ return '<i class="'+(i===coachI?'on':'')+'"></i>'; }).join('')+'</div>';

  /* la bulle prend le plus grand espace libre, et sa hauteur y est bornée :
     elle ne recouvre jamais la zone éclairée, même sur un petit écran. */
  var H=window.innerHeight, top;
  if(!r){
    box.style.maxHeight=(H-36)+'px';
    top=Math.max(18,(H-box.offsetHeight)/2);
  }else{
    var below=H-r.bottom-14, above=r.top-14;
    var under=below>=above;
    box.style.maxHeight=Math.max(130,(under?below:above)-10)+'px';
    var bh=box.offsetHeight;
    top = under ? r.bottom+14 : Math.max(8, r.top-14-bh);
  }
  box.style.top=Math.max(8,Math.min(top,H-box.offsetHeight-8))+'px';
}
function coachNext(){
  coachI++;
  state.tutoStep=coachI; save();          /* on reprendra ici si l'app est fermée en route */
  if(coachI>=coachTo) closeTour(coachTo>=TOUR.length);
  else coachShow();
}
function coachPrev(){ if(coachI>0){ coachI--; coachShow(); } }
function maybeTour(){
  if(state.tutoSeen) return;
  if(!dayReady()){
    if(state.tutoStep>=PART1) return;     /* partie 1 déjà vue : on attend la validation du jour */
    startTour(state.tutoStep, PART1);
  }else{
    startTour(Math.max(state.tutoStep,PART1), TOUR.length);
  }
}
window.addEventListener('resize', function(){ if(coachOn) coachPlace(TOUR[coachI]); });

/* ======================================================================= */
/*                              DÉMARRAGE                                  */
/* ======================================================================= */
var lastDay=today();

function boot(){
  load();
  seed();
  if(TABS.map(function(t){return t[0];}).indexOf(state.tab)<0) state.tab='jour';
  $('#banner').classList.add('hide');
  render();
  maybeTour();

  /* rappels : toutes les 20 s tant que l'app est ouverte */
  setTimeout(checkReminders, 1500);
  setInterval(checkReminders, 20000);

  /* changement de jour (les tâches « juste aujourd'hui » disparaissent) */
  setInterval(function(){
    var t=today();
    if(t!==lastDay){ lastDay=t; statsMonth=null; render(); }   /* planned devient caduc : retour au choix du jour */
  }, 30000);

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible'){
      var t=today();
      if(t!==lastDay){ lastDay=t; statsMonth=null; }
      render(); checkReminders();
    }
  });
}
boot();
