var ACCT='/api/account';
var acctCfg=null, gsiReady=false, gsiDrawn=false;

function acctConfig(){
  if(acctCfg) return Promise.resolve(acctCfg);
  if(location.protocol==='file:') return Promise.reject(new Error('local'));
  return fetch(ACCT,{cache:'no-store'}).then(function(r){ return r.json(); })
    .then(function(o){ acctCfg=o; return o; });
}
function logged(){ return !!(state.account && state.account.token); }

/* Ce qui part en sauvegarde : tout sauf le compte lui-même, qui contient le
   jeton de session et n'a rien à faire dans une copie restaurable ailleurs. */
function syncableState(){
  var out={};
  for(var k in state){
    if(k==='account' || k==='syncAt' || k==='cloudAt') continue;
    out[k]=state[k];
  }
  return out;
}
function acctCall(payload){
  return fetch(ACCT,{method:'POST',headers:{'Content-Type':'application/json'},
                     body:JSON.stringify(payload)})
    .then(function(r){ return r.json().then(function(o){ o._status=r.status; return o; }); });
}

/* --------- sauvegarde, différée pour ne pas écrire à chaque geste --------- */
var cloudT=null, cloudBusy=false;
function cloudSave(now){
  if(!logged()) return Promise.resolve(false);
  clearTimeout(cloudT);
  if(!now) return new Promise(function(r){ cloudT=setTimeout(function(){ cloudSave(true).then(r); },6000); });
  if(cloudBusy) return Promise.resolve(false);
  cloudBusy=true;
  return acctCall({action:'push', token:state.account.token, state:syncableState()})
    .then(function(o){
      cloudBusy=false;
      if(o._status===401){ acctDropSession(); return false; }
      if(o.ok){ state.cloudAt=o.updatedAt||Date.now(); save(); return true; }
      if(o.error==='etat_trop_gros') toast('Sauvegarde trop volumineuse','⚠️');
      return false;
    })
    .catch(function(){ cloudBusy=false; return false; });
}
function acctDropSession(){
  state.account=null; save(); render();
  toast('Session expirée — reconnecte-toi','🔑');
}

/* --------- restauration --------- */
function cloudRestore(){
  if(!logged()) return Promise.resolve(false);
  return acctCall({action:'pull', token:state.account.token}).then(function(o){
    if(o._status===401){ acctDropSession(); return false; }
    if(!o.ok || !o.state) return false;
    var compte=state.account;                    /* on ne se déconnecte pas en restaurant */
    var d=defaults();
    for(var k in d){ if(!(k in o.state)) o.state[k]=d[k]; }
    state=o.state; state.account=compte; state.cloudAt=o.updatedAt||0;
    save(); render();
    return true;
  }).catch(function(){ return false; });
}

/* --------- connexion --------- */
function localHasData(){ return Object.keys(state.log||{}).length>0; }

function onGoogleCredential(resp){
  if(!resp || !resp.credential) return;
  toast('Connexion…','🔑');
  acctCall({action:'login', idToken:resp.credential}).then(function(o){
    if(!o.ok){
      toast(o.cause==='non_configure' ? 'Connexion Google non configurée' : 'Connexion refusée','⚠️');
      return;
    }
    state.account={uid:o.uid, name:o.name, picture:o.picture, token:o.token};
    save();
    if(o.remote && localHasData()){ render(); openMerge(o.remote.updatedAt); return; }
    if(o.remote){ cloudRestore().then(function(){ toast('Données restaurées','☁️'); }); return; }
    cloudSave(true).then(function(){ toast('Compte lié — tes données sont sauvegardées','✅'); render(); });
  }).catch(function(){ toast('Connexion impossible','⚠️'); });
}

/* Les deux côtés ont des données : c'est à l'utilisateur de trancher, pas à
   moi de fusionner au jugé deux historiques qui ne se recoupent pas. */

  var quand = remoteAt ? frShort(new Date(remoteAt))+' à '+pad(new Date(remoteAt).getHours())+'h'+pad(new Date(remoteAt).getMinutes()) : 'date inconnue';

    '<p class="muted small" style="margin:14px 0 0">Sur ton compte : sauvegarde du <b>'+esc(quand)+'</b>.<br>'+
    'Sur ce téléphone : '+Object.keys(state.log||{}).length+' journée(s) enregistrée(s).</p>'+
    '<p class="muted small">Choisis laquelle garder. L\'autre sera remplacée.</p>'+
    '<div class="sactions" style="flex-direction:column">'+
      '<button class="btn pri wide" data-act="mergeRemote">Garder celles du compte</button>'+
      '<button class="btn wide" data-act="mergeLocal">Garder celles de ce téléphone</button>'+
    '</div>');
}

  var box=$('#gbtn');

  acctConfig().then(function(cfg){

function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s))); }
/* ========================================================================= */
/*                                  LE CREW                                  */
/* ========================================================================= */
/* Le classement entre amis reste : chacun colle le code de l'autre. Un groupe
   est autre chose — un endroit où tout le monde se voit d'un coup et où l'on
   se lance un défi commun. D'où un code par groupe, et pas un code par
   personne. La liste locale ne retient que les codes ; l'appartenance vit sur
   le serveur, sinon quitter un groupe depuis un téléphone ne quitterait rien. */
var CREW='/api/crew';
var crewData=[], crewI=0, crewBusy=false, crewMsg='';

function crewCall(payload){
  return fetch(CREW,{method:'POST',headers:{'Content-Type':'application/json'},
                     body:JSON.stringify(payload)})
    .then(function(r){ return r.json().then(function(o){ o._status=r.status; return o; }); });
}
function crewRefresh(){
  if(!netReady() || !state.crews.length){ crewData=[]; return Promise.resolve(); }
  return crewCall({action:'read', me:state.profile.id,
                   codes:state.crews.map(function(c){ return c.code; })})
    .then(function(o){
      if(o && o.ok){
        crewData=o.crews||[];
        /* un groupe effacé côté serveur ne doit pas rester dans la liste */
        var vus={}; crewData.forEach(function(g){ vus[g.code]=g.nom; });
        var avant=state.crews.length;
        state.crews=state.crews.filter(function(c){ return vus[c.code]; })
                               .map(function(c){ return {code:c.code, name:vus[c.code]}; });
        if(state.crews.length!==avant) save();
        if(crewI>=crewData.length) crewI=0;
      }
    })
    .catch(function(){ /* hors ligne : on garde le dernier état connu */ });
}
function crewCree(nom){
  crewBusy=true; crewMsg='Création…'; render();
  crewCall({action:'create', me:state.profile.id, nom:nom}).then(function(o){
    crewBusy=false; crewMsg='';
    if(o && o.ok && o.crew){
      state.crews.push({code:o.crew.code, name:o.crew.nom}); save();
      crewData.push(o.crew); crewI=crewData.length-1;
      toast('Groupe créé — partage le code','👥'); buzz(30);
    }else toast(msgCrew(o),'⚠️');
    closeSheet(); render();
  }).catch(function(){ crewBusy=false; crewMsg=''; toast('Création impossible','⚠️'); render(); });
}
function crewRejoint(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(code.length!==6){ toast('Un code fait six caractères','🔢'); return; }
  if(state.crews.some(function(c){ return c.code===code; })){ toast('Tu es déjà dedans','👌'); closeSheet(); return; }
  if(state.crews.length>=8){ toast('Huit groupes, c\'est déjà beaucoup','🙂'); return; }
  crewBusy=true; crewMsg='Connexion…'; render();
  crewCall({action:'join', me:state.profile.id, code:code}).then(function(o){

function msgCrew(o){

var METRIQUES=[
  {id:'rep', n:'Répétitions d\'un exercice', u:'rép.'},
  {id:'sea', n:'Séances',                    u:'séances'},
  {id:'ser', n:'Séries',                     u:'séries'},
  {id:'pts', n:'Points Cadence',             u:'pts'}
];
function metrique(id){
  for(var i=0;i<METRIQUES.length;i++) if(METRIQUES[i].id===id) return METRIQUES[i];
  return METRIQUES[0];
}
/* Ce qu'un membre a fait cette semaine, selon la métrique du défi. Les
   compteurs voyagent déjà dans sa fiche : rien à recalculer ici. */
function defiValeur(d,m){
  if(!m) return 0;
  var semaine=dk(mondayOf(nowD()));
  if(d.s && d.s!==semaine) return 0;            /* défi d'une autre semaine */
  if(m.weekK && m.weekK!==semaine) return 0;    /* fiche pas encore à jour */
  if(d.m==='pts') return +m.week||0;
  if(d.m==='sea') return +m.sea ||0;
  if(d.m==='ser') return +m.ser ||0;
  return (m.exo && +m.exo[d.x]) || 0;
}
function defiHTML(d,g){
  var l=g.membres.slice().map(function(m){
    return {m:m, v:defiValeur(d,m)};
  }).sort(function(a,b){ return b.v-a.v; });
  var cumul=l.reduce(function(a,b){ return a+b.v; },0);
  var quoi = d.m==='rep' ? exoOr(d.x).n : metrique(d.m).n;
  return '<div class="defi">'+
    '<div class="defihead"><span class="dn">'+esc(d.n)+'</span>'+
      '<span class="dc">'+d.c+' '+esc(metrique(d.m).u)+'</span>'+
      '<button class="del" data-act="defidel" data-i="'+esc(d.i)+'" aria-label="Retirer">'+ic('trash')+'</button>'+
    '</div>'+
    l.map(function(x){
      var pct=clamp(Math.round(x.v*100/Math.max(1,d.c)),0,100);
      return '<div class="defiline"><span class="av">'+ico(x.m.avatar,'dumbbell')+'</span>'+
        '<span class="nm">'+esc(x.m.name||'—')+'</span>'+
        '<span class="bar"><i class="'+(pct>=100?'full':'')+'" style="width:'+pct+'%"></i></span>'+
        '<span class="pc">'+pct+'%</span></div>';
    }).join('')+
    '<div class="small muted" style="margin-top:7px">'+esc(quoi)+' · '+cumul+' au total cette semaine'+
    (cumul>=d.c?' · <span class="grn">objectif atteint</span>':'')+'</div></div>';
}

var profVue='profil', loadExo=null;

/* --------------------------------------------------------------- saison */
/* Une montagne : le chemin en pointillés, la part parcourue en plein, et un
   point où tu en es. Le dessin n'apporte rien d'autre qu'un repère, mais un
   repère qu'on lit sans réfléchir. */
function dessinSaison(pct){
  var W=320, H=120, sol=H-14;
  var pts=[[10,sol],[60,sol-26],[100,sol-20],[150,sol-52],[195,sol-44],[240,sol-78],[275,sol-96],[310,sol-96]];
  var d='M'+pts.map(function(p){ return p[0]+' '+p[1]; }).join('L');
  /* longueur parcourue : on avance le long de la polyligne */
  var total=0, segs=[];
  for(var i=1;i<pts.length;i++){
    var dx=pts[i][0]-pts[i-1][0], dy=pts[i][1]-pts[i-1][1], l=Math.sqrt(dx*dx+dy*dy);
    segs.push(l); total+=l;
  }
  var cible=total*clamp(pct,0,100)/100, cum=0, fait='M'+pts[0][0]+' '+pts[0][1], moi=pts[0];
  for(var j=1;j<pts.length;j++){
    var l2=segs[j-1];
    if(cum+l2<=cible){ fait+='L'+pts[j][0]+' '+pts[j][1]; cum+=l2; moi=pts[j]; }
    else{
      var t=(cible-cum)/l2;

/* La charge sur l'année, mois par mois, pour l'exercice choisi. */
function exosSuivis(){
  var vus={};
  carnet().forEach(function(sn){ (sn.sea.x||[]).forEach(function(ex){ vus[ex.i]=(vus[ex.i]||0)+1; }); });
  return Object.keys(vus).sort(function(a,b){ return vus[b]-vus[a]; }).slice(0,12);
}
function carteCharge(){
  var dispo=exosSuivis();
  var h='<div class="sec"><h2>Ta charge sur l\'année</h2><span class="small">'+
        (dispo.length?'par mois':'rien encore')+'</span></div>';
  if(!dispo.length){
    return h+'<div class="card empty"><span class="e">'+ic('stats')+'</span>Déroule quelques séances et la courbe '+
      'se remplit toute seule.</div>';
  }
  var id=loadExo && dispo.indexOf(loadExo)>-1 ? loadExo : dispo[0];
  var x=exoOr(id), an=+today().slice(0,4), mois=[];
  for(var m=0;m<12;m++) mois.push(0);
  carnet().forEach(function(sn){
    if(sn.key.slice(0,4)!==String(an)) return;
    var mo=+sn.key.slice(5,7)-1;
    (sn.sea.x||[]).forEach(function(ex){
      if(ex.i!==id) return;
      (ex.s||[]).forEach(function(t){
        var v=(+t.w) ? unRM(+t.w,+t.r||1) : (+t.r||0);
        if(v>mois[mo]) mois[mo]=v;
      });
    });
  });
  var mx=Math.max.apply(null,mois)||1, W=320, H=110, P=6, BW=(W-2*P)/12;
  h+='<section class="card pop">'+
    '<div class="pickbar">'+dispo.map(function(k){
      return '<button class="'+(k===id?'on':'')+'" data-act="loadexo" data-x="'+esc(k)+'">'+esc(exoOr(k).n)+'</button>';
    }).join('')+'</div>'+
    '<svg class="load" viewBox="0 0 '+W+' '+H+'">'+
      mois.map(function(v,i){
        var bh=v?Math.max(3,(v/mx)*(H-28)):2;
        return '<rect class="bar'+(v?'':' pale')+'" x="'+(P+i*BW+2).toFixed(1)+'" y="'+(H-18-bh).toFixed(1)+
               '" width="'+(BW-4).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2.5"/>';
      }).join('')+
      mois.map(function(_,i){
        return '<text x="'+(P+i*BW+BW/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+MSHORT[i][0].toUpperCase()+'</text>';
      }).join('')+
      '<text x="'+P+'" y="10">'+Math.round(mx)+(x.u==='rep'&&mx>0?'':'')+'</text>'+
    '</svg>'+
    '<div class="small muted">'+esc(x.n)+' · meilleur effort du mois'+
      (x.u==='rep'?' (charge estimée, ou répétitions au poids du corps)':'')+'</div>'+
    '</section>';
  return h;
}

    '<div class="pickbar">'+

function ficheSeance(h){

  var out='<div class="shead"><span class="etile"'+tileStyle(h.color)+
    '><span class="emo">'+ico(h.emoji,'dumbbell')+'</span></span>'+
    '<div style="flex:1;min-width:0"><h2>'+esc(h.name)+'</h2><div class="muted small">'+
      (h.time?esc(h.time)+' · ':'')+exosOf(h).length+' exercices · '+setsPrevus(h)+' séries'+
      '</div></div>'+
    '<button class="iconbtn" data-act="closesheet" aria-label="Fermer">'+ic('close')+'</button></div>';

  var liste = (fait && sea) ? sea.x.map(function(ex){
      var x=exoOr(ex.i), n=(ex.s||[]).length;
      var det=(ex.s||[]).map(function(st){ return st.r+(st.w?'×'+st.w+'kg':''); }).join(' · ');
      return '<div class="exorow done">'+vignetteExo(x,VIGN)+
        '<div class="ei"><div class="en">'+esc(x.n)+'</div>'+
        '<div class="em">'+n+' série'+(n>1?'s':'')+' · '+esc(det)+'</div></div>'+
        '<span class="grn">'+ic('check')+'</span></div>';
    }).join('')
    : exosOf(h).map(function(e){
      var x=exoOr(e.x);
      return '<div class="exorow">'+vignetteExo(x,VIGN)+
        '<div class="ei"><div class="en">'+esc(x.n)+marqueSensible(x)+'</div>'+
        '<div class="em">'+esc(ligneExo(e))+'</div></div></div>';
    }).join('');
  /* Le geste d'abord, la liste ensuite : sur une séance de six exercices, un
     bouton placé après la liste tombe sous le pli et ne se voit plus. */
  if(fait){
    out+='<div class="muted small center" style="margin:10px 0 10px">Validée à '+esc(e.doneAt||'')+
         ' · +'+(e.pts||10)+' pts'+(sea&&sea.d?' · '+hhmmss(sea.d):'')+'</div>';
    out+='<div class="sactions" style="margin-bottom:16px">'+
      '<button class="btn ghost" data-act="editHabit">'+ic('edit')+' Modifier</button>'+
      '<button class="btn" data-act="undo">'+ic('undo')+' Dévalider</button></div>';

      '<button class="btn wide sm ok" data-act="validate" style="margin-bottom:16px">'+ic('check')+
      ' Déjà faite, valider sans dérouler</button>';
  }
  out+= liste || '<div class="empty" style="padding:16px 0">Aucun exercice dans cette séance.</div>';

/* ------------------------------------------------------------ dérouler --- */
/* L'état du mode séance ne vit que le temps de la séance : s'il disparaît
   (fermeture de l'app), rien n'est perdu — le journal n'est écrit qu'à la fin
   ou à chaque série terminée. */
var run=null, runT=null;
function runOpen(id){
  var h=habitById(id); if(!h || !exosOf(h).length) return;
  var e=ensure(today(),h.id);
  run={ id:h.id, i:0, serie:0, repos:0, debut:Date.now(),
        x: exosOf(h).map(function(a){
             var x=exoOr(a.x);
             return { i:a.x, u:x.u, n:x.n, cible:+a.r||0, poids:+a.w||0, nb:+a.s||0, rest:+a.rest||90, s:[] };
           }) };
  if(e.sea) delete e.sea;
  closeSheet();
  $('#run').classList.add('open');
  document.body.style.overflow='hidden';
  runRender();
}
function runClose(garder){
  clearInterval(runT); runT=null;
  $('#run').classList.remove('open'); $('#run').innerHTML='';
  document.body.style.overflow='';
  if(!garder) run=null;
  render();
}
function runCur(){ return run && run.x[run.i]; }
function runFini(){
  var h=habitById(run.id);
  var faites=run.x.filter(function(x){ return x.s.length; });
  if(!faites.length){ toast('Aucune série faite','🤷'); runClose(false); return; }
  var e=ensure(today(),run.id);
  e.sea={ d: Math.round((Date.now()-run.debut)/1000), plein:true,
          x: faites.map(function(x){ return {i:x.i, s:x.s.slice()}; }) };
  save();
  if(h && !e.done) setDone(today(),h,true);
  var st=statSeance(e.sea);
  toast('Séance bouclée · '+st.series+' séries','🔥'); buzz([20,50,20]);
  justDone=run.id; setTimeout(function(){ justDone=null; render(); },900);
  runClose(false);
}
function runSerieOK(){
  var x=runCur(); if(!x) return;
  x.s.push({ r:x.cible, w:x.poids });
  buzz(25);
  if(x.s.length>=x.nb){ runSuivant(); return; }
  if(x.rest>0){ run.repos=x.rest; runTick(); }
  runRender();
}
function runSuivant(){
  run.repos=0; clearInterval(runT); runT=null;
  if(run.i>=run.x.length-1){ runFini(); return; }
  run.i++; runRender();
}
function runTick(){
  clearInterval(runT);
  runT=setInterval(function(){
    if(!run){ clearInterval(runT); return; }
    run.repos--;
    if(run.repos<=0){ run.repos=0; clearInterval(runT); runT=null; buzz([30,60,30]); }
    runRender();
  },1000);
}
function runRender(){
  if(!run) return;
  var x=runCur(), h=habitById(run.id);
  var total=run.x.reduce(function(a,b){ return a+b.nb; },0);
  var faits =run.x.reduce(function(a,b){ return a+b.s.length; },0);

    '<span class="cnt">'+esc((h&&h.name)||'Séance')+' · '+faits+'/'+total+' séries</span>'+

  out+='<div class="rnprog">'+run.x.map(function(y,i){
      var cl = y.s.length>=y.nb ? 'dn' : (i===run.i ? 'on' : '');
      return '<i class="'+cl+'"></i>';
    }).join('')+'</div>';

  var gene=exoSensible(exoOr(x.i));
  out+='<div class="rnbody">'+vignetteExo(exoOr(x.i),150)+
    '<div class="rnname">'+esc(x.n)+'</div>'+
    '<div class="rnserie">Série '+(x.s.length+1)+' sur '+x.nb+'</div>'+
    (gene ? '<div class="small" style="color:var(--gold);margin-top:7px">'+ic('alert')+' '+
            esc(gene.muscles.join(', '))+' — zone que tu as déclarée sensible</div>' : '');

  if(run.repos>0){
    out+='<div class="rnrepos">'+mmss(run.repos)+'</div>'+
      '<div class="muted small">Repos — souffle, puis reprends</div>'+
      '<div class="rnact"><button class="btn ghost" data-act="runplus">+30 s</button>'+
      '<button class="btn pri" data-act="runskiprest">'+ic('play')+' Reprendre</button></div>';
  }else{
    out+='<div class="rnbig">'+x.cible+'<small>'+unite+'</small></div>'+
      (x.poids?'<div class="muted">'+x.poids+' kg</div>':'')+
      '<div class="setgrid" style="width:100%;max-width:330px">'+
        nombre(x.u==='rep'?'Répétitions':(x.u==='sec'?'Secondes':'Minutes'), x.cible, '', 'runr', 0)+
        nombre('Charge', x.poids, 'kg', 'runw', 0)+
      '</div>'+
      '<div class="rnact"><button class="btn pri" data-act="runok">'+ic('check')+' Série faite</button></div>'+
      '<div class="rnact" style="margin-top:9px">'+
        '<button class="btn ghost sm" data-act="runskip">'+ic('skip')+' Passer l\'exercice</button>'+
        '<button class="btn sm" data-act="runend">'+ic('flag')+' Terminer</button></div>';
  }
  var suiv=run.x[run.i+1];
  out+= suiv ? '<div class="rnnext">Ensuite : '+esc(suiv.n)+'</div>'
             : '<div class="rnnext">Dernier exercice</div>';
  out+='</div></div>';
  $('#run').innerHTML=out;
}

function saveForm(){
  readForm();
  var f=formData;
  var name=String(f.name||'').trim();
  if(!name){ toast('Il faut un nom','✏️'); return; }
  /* Une habitude récurrente sans jour ne reviendrait jamais : c'est une
     erreur. Une séance sans jour, en revanche, se tient très bien — elle reste
     dans la bibliothèque et on la lance quand on veut. */
  if(f.type==='rec' && !f.days.length && f.kind!=='seance'){
    toast('Choisis au moins un jour','📅'); return;
  }
  var steps=String(f.steps||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean).slice(0,20);
  var t=today();
  if(f.kind==='seance'){
    if(!f.exos.length){ toast('Ajoute au moins un exercice','🏋️'); return; }
    steps=[];
  }

  if(f.id){
    var h=habitById(f.id); if(!h){ closeSheet(); return; }
    var oldSteps=(h.steps||[]).slice();
    h.name=name; h.emoji=f.emoji; h.time=f.time; h.type=f.type;
    h.days=f.type==='rec'?f.days.slice():[]; h.date=f.type==='once'?(h.date||t):null;
    h.steps=steps; h.color=f.color;
    if(f.kind==='seance'){ h.kind='seance'; h.exos=f.exos.slice(); }
    /* on garde les cases cochées dont le texte n'a pas bougé */
    var e=entry(t,h.id);
    if(e){
      var mapped=steps.map(function(s){ var i=oldSteps.indexOf(s); return i>-1 ? !!e.steps[i] : false; });
      e.steps=mapped;
      if(steps.length && !mapped.every(Boolean) && e.done){ e.done=false; e.doneAt=null; e.pts=0; }
    }
    toast('Modifié','✅');
  }else{
    var neuf={
      id:uid(), name:name, emoji:f.emoji, time:f.time,
      type:f.type, days:f.type==='rec'?f.days.slice():[], date:f.type==='once'?(f.forDate||t):null,
      color:f.color, steps:steps, createdAt:t
    };
    if(f.kind==='seance'){ neuf.kind='seance'; neuf.exos=f.exos.slice(); }
    state.habits.push(neuf);
    toast(f.kind==='seance'?'Séance créée':'Tâche créée','🔥');
  }
  save(); buzz(30); closeSheet(); render();
}
function delHabit(id){
  var i=-1;
  for(var k=0;k<state.habits.length;k++) if(state.habits[k].id===id) i=k;
  if(i<0) return;
  var n=state.habits[i].name;
  state.habits.splice(i,1);
  save(); buzz([20,40,20]); toast(n+' supprimée','🗑️'); render();
}
/* L'onglet Habitudes ne gère plus que les habitudes : les séances se gèrent
   dans Sport, avec leurs exercices sous la main. */
function visibleHabits(){
  var t=today();
  return state.habits.filter(function(h){
    return !isSeance(h) && !(h.type==='once' && h.date && h.date<t);
  });
}
/* Les séances visibles : les mêmes règles, mais côté entraînement. */
function seancesVisibles(){
  var t=today();
  return state.habits.filter(function(h){
    return isSeance(h) && !(h.type==='once' && h.date && h.date<t);
  }).sort(byTime);
}
/* on échange avec le voisin *visible* : les tâches passées cachées ne bloquent pas */
function moveHabit(id,dir){
  var vis=visibleHabits(), vi=-1;
  for(var k=0;k<vis.length;k++) if(vis[k].id===id) vi=k;
  var vj=vi+dir;
  if(vi<0 || vj<0 || vj>=vis.length) return;
  var idx=function(hid){ for(var n=0;n<state.habits.length;n++) if(state.habits[n].id===hid) return n; return -1; };
  var a=idx(vis[vi].id), b=idx(vis[vj].id);
  if(a<0||b<0) return;
  var tmp=state.habits[a]; state.habits[a]=state.habits[b]; state.habits[b]=tmp;
  save(); buzz(15); render();
}

function toggleTimer(tk,i){
  var h=openHabit; if(!h) return;
  var secs=stepSecs((h.steps||[])[i]||''); if(!secs) return;
  var t=timers[tk];
  if(!t){ timers[tk]={left:secs,run:true,total:secs,hid:h.id,i:i}; buzz(20); }
  else   { t.run=!t.run; if(t.left<=0){ t.left=t.total; t.run=true; } }
  renderSheet();
}
setInterval(function(){
  var changed=false;
  for(var k in timers){
    var t=timers[k];
    if(!t.run) continue;
    t.left--;
    if(t.left<=0){
      t.left=0; t.run=false; changed=true;
      buzz([160,80,160,80,260]);
      var h=habitById(t.hid);
      if(h){
        var e=ensure(today(),h.id);
        if(!e.steps[t.i]){ toggleStep(today(),h,t.i); }
        toast('Chrono terminé — '+((h.steps||[])[t.i]||''),'⏱');
      }
    }
    /* mise à jour légère du bouton sans re-render complet */
    var btn=document.querySelector('.tmr[data-key="'+k+'"] .tv');
    if(btn) btn.textContent=mmss(t.left);
  }
  if(changed && openHabit) renderSheet();
  if(changed) render();
},1000);

function checkReminders(){
  if(!dayReady() || coachOn) return;   /* rien à rappeler tant que la journée n'est pas posée */
  var key=today(), now=toMin(nowHM());
  if(!state.notified[key]) state.notified[key]={};
  var hs=habitsFor(key);
  for(var i=0;i<hs.length;i++){
    var h=hs[i];
    if(!h.time || isDone(key,h.id)) continue;
    if(now < toMin(h.time) || now > toMin(h.time)+180) continue;   /* fenêtre de 3 h */
    if(state.notified[key][h.id]) continue;
    state.notified[key][h.id]=true;
    /* purge des vieux jours */
    for(var k in state.notified){ if(k<dk(addDays(nowD(),-7))) delete state.notified[k]; }
    save();
    showBanner(h);
    buzz([120,60,120]);
    try{
      if(window.Notification && Notification.permission==='granted'){
        new Notification('Cadence — '+h.name, {body:"C'est l'heure ("+h.time+")", tag:'cadence_'+h.id+'_'+key});
      }
    }catch(e){}
    break;
  }

function askNotif(){
  if(!window.Notification){ toast('Notifications non supportées ici','ℹ️'); return; }
  if(Notification.permission==='granted'){ toast('Déjà autorisées','✅'); return; }
  var done=false;
  var after=function(p){
    if(done) return; done=true;
    toast(p==='granted'?'Notifications autorisées':'Refusé — la bannière suffira', p==='granted'?'🔔':'🙃');
  };
  try{
    var r=Notification.requestPermission(after);      /* vieux Safari : callback */
    if(r && r.then) r.then(after).catch(function(){}); /* moderne : promesse   */
  }catch(e){ toast('Notifications indisponibles','ℹ️'); }
}

/* ======================================================================= */
function icsEsc(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function makeICS(){
  var BY=['SU','MO','TU','WE','TH','FR','SA'];
  var stamp=function(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
    pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'; };
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cadence//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Cadence'];
  var n=0, t=today();
  state.habits.forEach(function(h){
    if(!h.time) return;
    var d0;
    if(h.type==='once'){ if(!h.date || h.date<t) return; d0=fromKey(h.date); }
    else{
      if(!(h.days||[]).length) return;
      d0=nowD();
      for(var i=0;i<7;i++){ var c=addDays(nowD(),i); if(h.days.indexOf(c.getDay())>-1){ d0=c; break; } }
    }
    var hm=h.time.split(':');
    var start=d0.getFullYear()+pad(d0.getMonth()+1)+pad(d0.getDate())+'T'+pad(+hm[0])+pad(+hm[1]||0)+'00';
    n++;
    L.push('BEGIN:VEVENT');
    L.push('UID:'+h.id+'@cadence');
    L.push('DTSTAMP:'+stamp(new Date()));
    L.push('DTSTART:'+start);
    L.push('DURATION:PT30M');
    if(h.type!=='once') L.push('RRULE:FREQ=WEEKLY;BYDAY='+h.days.slice().sort().map(function(x){return BY[x];}).join(','));
    L.push('SUMMARY:'+icsEsc(h.name));
    L.push('DESCRIPTION:'+icsEsc('Cadence — '+((h.steps||[]).join(' · ')||'À faire')));
    L.push('BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(h.name),'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  if(!n){ toast('Aucune habitude avec une heure','📅'); return; }
  var txt=L.join('\r\n');
  try{
    var blob=new Blob([txt],{type:'text/calendar;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='cadence.ics'; a.rel='noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
    toast('Ouvre le fichier pour l\'ajouter à ton agenda','📅');
  }catch(e){
    window.open('data:text/calendar;charset=utf-8,'+encodeURIComponent(txt),'_blank');
  }
}
function copyText(txt,msg){
  var ok=function(){ toast(msg||'Copié','📋'); buzz(25); };
  var fallback=function(){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt; ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,999999);
      var done=document.execCommand('copy');
      document.body.removeChild(ta);
      done ? ok() : toast('Copie impossible — sélectionne le texte à la main','⚠️');
    }catch(e){ toast('Copie impossible','⚠️'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(fallback);
  } else fallback();
}
function exportData(){
  var txt=JSON.stringify(state);
  var ta=$('#backup'); if(ta) ta.value=txt;
  copyText(txt,'Sauvegarde copiée');
}
function importData(){
  var ta=$('#backup');
  var raw=ta?String(ta.value||'').trim():'';
  if(!raw){ toast('Colle d\'abord ta sauvegarde','📥'); return; }
  var o;
  try{ o=JSON.parse(raw); }catch(e){ toast('Sauvegarde illisible','❌'); return; }
  if(!o || typeof o!=='object' || !Array.isArray(o.habits)){ toast('Sauvegarde invalide','❌'); return; }
  if(!window.confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
  var d=defaults();
  for(var k in d){ if(!(k in o)) o[k]=d[k]; }
  state=o; save(); toast('Données restaurées','✅'); render();
}

/* la note du journal est en saisie libre : on la range avant tout re-render */
function flushNote(){
  var ta=$('#note'); if(!ta || state.tab!=='journal') return;
  var k=today();
  if((state.notes[k]||'')===ta.value) return;
  clearTimeout(noteT); state.notes[k]=ta.value; save();
}
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  flushNote();
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id'), key=today();

  /* --- navigation --- */
  if(a==='tab'){
    var nt=el.getAttribute('data-tab');
    if(locked(nt)){ buzz([15,40,15]); toast('Valide d\'abord tes tâches du jour','🔒'); return; }
    state.tab=nt; pendingDel=null; save(); render(); toTop();
    if(nt==='profil'){ syncNow(true); crewRefresh().then(render); pushRefresh().then(render); }
    return;
  }
  if(a==='ptoggle'){
    var pk=planKey();
    if(!state.off[pk]) state.off[pk]=[];
    var pi=state.off[pk].indexOf(id);
    if(pi>-1){
      state.off[pk].splice(pi,1);
    }else{
      state.off[pk].push(id);
      /* retirée de la journée = pas faite aujourd'hui : on efface son résultat du jour,
         sinon ses points resteraient comptés alors que la tâche n'apparaît plus. */
      if(state.log[pk] && state.log[pk][id]){
        var was=state.log[pk][id].done;
        delete state.log[pk][id];
        if(was) toast('Retirée de la journée — ses points sont annulés','↩︎');
      }
    }
    save(); buzz(18); render(); return;
  }
  if(a==='planok'){
    var pk2=planKey(), avance2=(pk2!==today());
    state.plannedDays[pk2]=true; save(); buzz([30,50,30]);
    var kept=habitsFor(pk2).length;
    toast(avance2 ? 'Demain est prêt · '+kept+' tâche'+(kept>1?'s':'')
                  : (kept? 'Journée validée · '+kept+' tâche'+(kept>1?'s':'') : 'Journée de repos validée'),
          avance2?'🌙':'🔓');
    planDate=null;                       /* on revient toujours sur aujourd'hui */
    render(); toTop();
    if(!avance2 && !state.tutoSeen) setTimeout(function(){ startTour(Math.max(state.tutoStep,PART1), TOUR.length); }, 480);
    return;
  }
  if(a==='replan'){ planDate=null; delete state.plannedDays[today()]; save(); render(); toTop(); return; }
  if(a==='plannext'){ planDate=dk(addDays(nowD(),1)); render(); toTop(); return; }
  if(a==='planback'){ planDate=null; render(); toTop(); return; }
  if(a==='theme'){ state.theme = state.theme==='dark'?'light':'dark'; save(); render(); return; }
  if(a==='gofocus'){ focusOpen(); return; }
  if(a==='bclose'){ $('#banner').classList.add('hide'); return; }

  /* --- tâches --- */
  if(a==='new'){ openForm(null); return; }
  if(a==='open'){ openTask(id); return; }
  if(a==='toggle'){
    var h=habitById(id); if(!h) return;
    var was=isDone(key,h.id);
    setDone(key,h,!was);
    if(!was){ justDone=h.id; buzz([25,40,25]); toast('+'+(entry(key,h.id).pts)+' pts — '+h.name,'✅'); }
    render(); syncLater(); return;
  }
  if(a==='del'){
    if(pendingDel===id){ clearTimeout(delT); pendingDel=null; delHabit(id); }
    else{
      pendingDel=id; render(); buzz(15);
      clearTimeout(delT);
      delT=setTimeout(function(){ pendingDel=null; render(); },3000);
    }
    return;
  }
  if(a==='edit'){ var he=habitById(id); if(he) openForm(he); return; }
  if(a==='up'){   moveHabit(id,-1); return; }
  if(a==='down'){ moveHabit(id, 1); return; }

  /* --- fiche routine --- */
  if(a==='closesheet'){ closeSheet(); render(); return; }
  if(a==='step'){
    if(!openHabit) return;
    var r=toggleStep(key,openHabit,+el.getAttribute('data-i'));
    buzz(r==='done'?[30,50,30]:15);
    if(r==='done'){ toast('Tâche validée — +'+(entry(key,openHabit.id).pts)+' pts','🔥'); syncLater(); }
    renderSheet(); render(); return;
  }
  if(a==='timer'){ toggleTimer(el.getAttribute('data-key'), +el.getAttribute('data-i')); return; }
  if(a==='editHabit'){ if(openHabit) openForm(openHabit); return; }
  if(a==='validate'){
    if(!openHabit) return;
    setDone(key,openHabit,true); buzz([30,50,30]);
    toast('+'+(entry(key,openHabit.id).pts)+' pts','✅');
    closeSheet(); render(); return;
  }
  if(a==='undo'){ if(!openHabit) return; setDone(key,openHabit,false); renderSheet(); render(); return; }

  /* --- formulaire --- */
  if(a==='femoji'){ readForm(); formData.emoji=el.getAttribute('data-e'); renderForm(); return; }
  if(a==='ftype'){  readForm(); formData.type =el.getAttribute('data-t');  renderForm(); return; }
  if(a==='fday'){
    readForm();
    var d=+el.getAttribute('data-d'), i=formData.days.indexOf(d);
    if(i>-1) formData.days.splice(i,1); else formData.days.push(d);
    renderForm(); return;
  }
  if(a==='fcolor'){ readForm(); formData.color=el.getAttribute('data-c'); renderForm(); return; }
  if(a==='fsave'){  saveForm(); return; }

  /* --- composer une séance --- */
  if(a==='exadd'){ readForm(); pickQ=''; pickEq=''; openPicker(); return; }
  if(a==='backform'){ renderForm(); return; }
  if(a==='backpick'){ openPicker(); return; }
  if(a==='pickeq'){ var q=$('#pickq'); if(q) pickQ=q.value; pickEq=el.getAttribute('data-e'); openPicker(); return; }
  if(a==='pickexo'){ ajouterExo(el.getAttribute('data-x')); return; }
  if(a==='exonew'){ openExoNeuf(); return; }
  if(a==='xmus'){
    var i2=$('#xn'); if(i2) exoNeuf.n=i2.value;
    var m=el.getAttribute('data-m'), k=exoNeuf.m.indexOf(m);
    if(k>-1) exoNeuf.m.splice(k,1); else exoNeuf.m.push(m);
    renderExoNeuf(); return;
  }
  if(a==='xunit'||a==='xeq'){
    var i3=$('#xn'); if(i3) exoNeuf.n=i3.value;
    if(a==='xunit') exoNeuf.u=el.getAttribute('data-u'); else exoNeuf.eq=el.getAttribute('data-e');
    renderExoNeuf(); return;
  }
  if(a==='xsave'){ saveExoNeuf(); return; }
  if(a==='extoggle'){ readForm(); var ei=+el.getAttribute('data-i'); formExo=(formExo===ei?-1:ei); renderForm(); return; }
  if(a==='exdel'){ readForm(); formData.exos.splice(+el.getAttribute('data-i'),1); formExo=-1; renderForm(); return; }
  if(a==='exup'||a==='exdown'){
    readForm();
    var j=+el.getAttribute('data-i'), k2=j+(a==='exup'?-1:1);
    if(k2<0||k2>=formData.exos.length) return;
    var tmp=formData.exos[j]; formData.exos[j]=formData.exos[k2]; formData.exos[k2]=tmp;
    formExo=k2; renderForm(); return;
  }
  if(a==='exs'||a==='exr'||a==='exw'||a==='exrest'){
    readForm();
    var e2=formData.exos[+el.getAttribute('data-i')], d2=+el.getAttribute('data-d');
    if(a==='exs')    e2.s   =clamp(e2.s+d2,1,20);
    if(a==='exr')    e2.r   =clamp(e2.r+d2*(e2.r>=20?5:1),1,999);
    if(a==='exw')    e2.w   =clamp(e2.w+d2*(e2.w>=20?5:(e2.w>=10?2.5:1)),0,400);
    if(a==='exrest') e2.rest=clamp(e2.rest+d2*15,0,600);
    renderForm(); return;
  }

  /* --- dérouler une séance --- */
  if(a==='runstart'){ runOpen(el.getAttribute('data-id')); return; }
  if(a==='runquit'){
    if(run && run.x.some(function(x){ return x.s.length; })){
      if(confirm('Garder ce qui est déjà fait ?')){ runFini(); return; }
    }
    runClose(false); return;
  }
  if(a==='runok'){        runSerieOK(); return; }
  if(a==='runskip'){      runSuivant(); return; }
  if(a==='runend'){       runFini();    return; }
  if(a==='runplus'){      run.repos+=30; runRender(); return; }
  if(a==='runskiprest'){  run.repos=0; clearInterval(runT); runT=null; runRender(); return; }
  if(a==='runr'||a==='runw'){
    var xc=runCur(), d3=+el.getAttribute('data-d');
    if(a==='runr') xc.cible=clamp(xc.cible+d3*(xc.cible>=20?5:1),1,999);
    else           xc.poids=clamp(xc.poids+d3*(xc.poids>=20?5:(xc.poids>=10?2.5:1)),0,400);
    runRender(); return;
  }

  /* --- créer --- */
  if(a==='newseance'){ openSeance(null); return; }
  if(a==='newpick'){
    /* Dans Sport, la question ne se pose pas : le + crée une séance. */
    if(state.tab==='sport'){ openSeance(null); return; }
    openSheet('<div class="shead"><span class="etile">'+ic('plus')+'</span>'+
      '<div style="flex:1;min-width:0"><h2>Qu\'est-ce qu\'on ajoute ?</h2>'+
      '<div class="muted small">Les deux comptent pareil dans ta journée</div></div>'+
      '<button class="iconbtn" data-act="closesheet" aria-label="Fermer">'+ic('close')+'</button></div>'+
      '<div style="height:14px"></div>'+
      '<button class="btn wide" data-act="new" style="margin-bottom:9px">'+ic('habits')+' Une tâche</button>'+
      '<button class="btn wide pri" data-act="newseance">'+ic('dumbbell')+' Une séance d\'entraînement</button>'+
      '<div class="small muted center" style="margin-top:11px">Une séance, c\'est une liste d\'exercices '+
      'avec ses séries et son minuteur de repos.</div>');
    return;
  }
  if(a==='bouge'){ bougeToday(); return; }
  /* --- nutrition --- */
  if(a==='corps'){ openCorps(); return; }
  if(a==='csexe'){ lireCorps(); corpsF.sexe=el.getAttribute('data-s'); renderCorps(); return; }
  if(a==='cact'){  lireCorps(); corpsF.act =el.getAttribute('data-a'); renderCorps(); return; }
  if(a==='cpoids'||a==='ctaille'||a==='cage'){
    lireCorps();
    var dc=+el.getAttribute('data-d');
    if(a==='cpoids')  corpsF.poids =clamp(corpsF.poids +dc,30,250);
    if(a==='ctaille') corpsF.taille=clamp(corpsF.taille+dc,120,230);
    if(a==='cage')    corpsF.age   =clamp(corpsF.age   +dc,12,100);
    renderCorps(); return;
  }
  if(a==='csave'){ lireCorps(); saveCorps(); return; }
  if(a==='caltoggle'){
    if(!state.body) state.body={};
    state.body.cal = state.body.cal===false ? true : false;
    save(); render();
    toast(state.body.cal===false?'Retour à la formule':'Mesure prise en compte','⚖️'); return;
  }
  if(a==='calclear'){
    if(state.body) state.body.kcal=0;
    save(); render(); toast('Maintien recalculé','⚖️'); return;
  }
  if(a==='nobj'){
    if(!state.body) state.body={};
    state.body.obj=el.getAttribute('data-o'); save(); render(); return;
  }
  if(a==='mealadd'){ openRepas(); return; }
  if(a==='rkcal'||a==='rprot'){
    lireRepas();
    var dr=+el.getAttribute('data-d');
    if(a==='rkcal') repasF.kcal=clamp(repasF.kcal+dr*(repasF.kcal>=200?50:10),0,5000);
    else            repasF.prot=clamp(repasF.prot+dr*5,0,400);
    repasF.p100=null;              /* corrigé à la main : la règle de trois ne s'applique plus */
    renderRepas(); return;
  }
  if(a==='rfood'){
    var f2=state.foods[+el.getAttribute('data-i')];
    if(f2) repasF={n:f2.n, kcal:f2.kcal, prot:f2.prot, p100:null, g:100};
    renderRepas(); return;
  }
  if(a==='roff'){
    var px=offRes[+el.getAttribute('data-i')];
    if(px) prendreProduit(px);
    return;
  }
  if(a==='rgram'){
    lireRepas();
    repasF.g=+el.getAttribute('data-g'); majDepuis100(); renderRepas(); return;
  }
  if(a==='rfind'){ lireRepas(); chercherAliment(repasF.n); return; }
  if(a==='rscan'){ lireRepas(); ouvrirScan(); return; }
  if(a==='scanclose'){ if(scanStop) scanStop(); closeSheet(); openRepas(); return; }
  if(a==='scanmanuel'){ if(scanStop) scanStop(); ouvrirScanManuel(); return; }
  if(a==='bcodeok'){
    var bc=$('#bcode'), code=bc?String(bc.value||'').replace(/[^0-9]/g,''):'';
    if(code.length<6){ toast('Un code-barres fait au moins six chiffres','\u26a0\ufe0f'); return; }
    closeSheet(); openRepas(); alimentParCode(code); return;
  }
  if(a==='rsave'){ saveRepas(); return; }
  /* --- athlète --- */
  if(a==='pvue'){ profVue=el.getAttribute('data-v'); render(); toTop(); return; }
  if(a==='accent'){
    state.accent=el.getAttribute('data-a'); save(); poserAccent(); render();
    toast('Couleur changée','🎨'); return;
  }
  if(a==='zone'){
    var zm=el.getAttribute('data-m'), zi=state.gene.indexOf(zm);
    if(zi>-1) state.gene.splice(zi,1); else state.gene.push(zm);
    save(); render(); return;
  }
  if(a==='anprev'||a==='annext'){
    var ans=anneesConnues(), cur=anneeVue||+ans[0], ia=ans.indexOf(String(cur));
    var ja=ia+(a==='anprev'?1:-1);
    if(ja<0||ja>=ans.length) return;
    anneeVue=+ans[ja]; render(); return;
  }
  if(a==='loadexo'){ loadExo=el.getAttribute('data-x'); render(); return; }
  if(a==='seasnew'){ openSaison(); return; }
  if(a==='sjours'){
    var sn3=$('#sn2'), sf=$('#sf');
    if(sn3) seasF.n=sn3.value;
    if(sf && /^\d{4}-\d{2}-\d{2}$/.test(sf.value)) seasF.from=sf.value;
    seasF.jours=+el.getAttribute('data-j'); renderSaison(); return;
  }
  if(a==='seasok'){ saveSaison(); return; }
  if(a==='seasend'){
    if(confirm('Clore la saison ? Tes journées restent, seule la ligne d\'arrivée disparaît.')){
      state.season=null; save(); render(); toast('Saison close','🏁');
    }
    return;
  }
  if(a==='suppl'){ toggleSuppl(today(), el.getAttribute('data-s')); buzz(15); render(); return; }
  if(a==='wtarget'){ openPoidsCible(); return; }
  if(a==='wtok'){
    var wi=$('#wt');
    state.wtarget=wi?clamp(num(wi.value,0),0,300):0;
    save(); closeSheet(); render();
    toast(state.wtarget?'Objectif posé':'Objectif retiré','⚖️');
    return;
  }

  /* --- crew --- */
  if(a==='crewnew'){  openCrewNew();  return; }
  if(a==='crewjoin'){ openCrewJoin(); return; }
  if(a==='crewnewok'){ var cn=$('#cwn'); crewCree(String(cn?cn.value:'').trim().slice(0,24) || 'Mon groupe'); return; }
  if(a==='crewjoinok'){ var cj=$('#cwj'); crewRejoint(cj?cj.value:''); return; }
  if(a==='crewtab'){ crewI=+el.getAttribute('data-i'); render(); return; }
  if(a==='crewcopy'){ copyText(el.getAttribute('data-c'),'Code copié — envoie-le à tes potes'); return; }
  if(a==='crewsync'){ crewRefresh().then(render); return; }
  if(a==='crewout'){
    var cc=el.getAttribute('data-c');
    if(confirm('Quitter ce groupe ? Tu pourras y revenir avec le code.')) crewQuitte(cc);
    return;
  }
  if(a==='definew'){ openDefi(); return; }
  if(a==='dmet'){ var dd=$('#dn'); if(dd) defiF.n=dd.value; defiF.m=el.getAttribute('data-m'); renderDefi(); return; }
  if(a==='dexo'){ var de=$('#dn'); if(de) defiF.n=de.value; defiF.x=el.getAttribute('data-x'); renderDefi(); return; }
  if(a==='dcible'){
    var dn2=$('#dn'); if(dn2) defiF.n=dn2.value;
    var dz=+el.getAttribute('data-d');
    defiF.c=clamp(defiF.c+dz*(defiF.c>=100?25:(defiF.c>=20?10:1)),1,100000);
    renderDefi(); return;
  }
  if(a==='defiok'){ saveDefi(); return; }
  if(a==='defidel'){
    var gg=crewData[crewI]; if(!gg) return;
    var di=el.getAttribute('data-i');
    crewCall({action:'undefi', me:state.profile.id, code:gg.code, id:di}).then(function(o){
      if(o && o.ok){ gg.defis=o.defis||[]; render(); }
    }).catch(function(){});
    return;
  }

  if(a==='mealdel'){
    var t3=today(), im=+el.getAttribute('data-i');
    if(state.meals[t3]) state.meals[t3].splice(im,1);
    save(); render(); return;
  }
  if(a==='bougeok'){ bougeOk(el.getAttribute('data-id')); return; }
  if(a==='bougedur'){ dureeLibre=clamp(dureeLibre+(+el.getAttribute('data-d'))*15,15,240); bougeToday(); return; }
  if(a==='editseance'){ var hs=habitById(el.getAttribute('data-id')); if(hs) openSeance(hs); return; }
  if(a==='gocarnet'||a==='gorecup'){ state.tab='sport'; save(); render(); toTop(); return; }
  if(a==='bface'){ bodyFace=el.getAttribute('data-f'); render(); return; }
  if(a==='opencarnet'){ ficheCarnet(el.getAttribute('data-k'), el.getAttribute('data-id')); return; }

  /* --- stats --- */
  if(a==='mprev'||a==='mnext'){
    var m=statsMonth||new Date(nowD().getFullYear(),nowD().getMonth(),1);
    statsMonth=new Date(m.getFullYear(), m.getMonth()+(a==='mnext'?1:-1), 1);
    render(); return;
  }
  if(a==='dayinfo'){
    var dkey=el.getAttribute('data-day'), s=dayStat(dkey);
    toast(frShort(fromKey(dkey))+' — '+(dkey>today() ? s.total+' tâche'+(s.total>1?'s':'')+' à venir'
      : s.total ? s.done+'/'+s.total+' ('+s.pct+'%) · '+dayPoints(dkey)+' pts' : 'rien de prévu'),'📅');
    return;
  }

  /* --- journal --- */
  if(a==='mood'){
    var mi=+el.getAttribute('data-i');
    if(state.mood[key]===mi) delete state.mood[key]; else state.mood[key]=mi;
    save(); buzz(20); render(); return;
  }
  if(a==='wsave'){
    var w=$('#wval'), v=w?String(w.value).trim():'';
    if(!v){ delete state.weight[key]; save(); toast('Pesée effacée','🗑️'); render(); return; }
    var n=num(v,null);
    if(n===null || n<=0 || n>400){ toast('Poids invalide','⚠️'); return; }
    state.weight[key]=Math.round(n*10)/10; save(); buzz(25); toast('Poids noté : '+state.weight[key]+' kg','⚖️'); render(); return;
  }

  /* --- profil --- */
  if(a==='lb'){ lbTab=el.getAttribute('data-p'); render(); return; }
  if(a==='diag'){
    if(location.protocol==='file:'){ toast('Ouvre l\'app par son adresse web pour ce test','📴'); return; }
    diagMsg='Test en cours…'; render();
    fetch(API+'?check=1',{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(o){
        var ok = o && o.redis==='ok';
        var nb = (o && o.cles) || 0;
        diagMsg = ok ? 'Base connectée — le classement se synchronise seul ('+nb+' entrée'+(nb>1?'s':'')+')'
          : (o && o.cause==='aucune_variable')? 'Base pas reliée au déploiement — relie-la puis redéploie'
          : (o && o.redis==='absente')       ? 'Aucune base branchée'
          : (o && o.redis==='injoignable')   ? 'Base branchée mais elle ne répond pas'
          : 'Réponse inattendue du serveur';
        if(ok) netOff=false;          /* le test réussit : on relance les synchros */
        toast(diagMsg, ok?'✅':'⚠️');
        render();
        if(ok) syncNow(true);
      })
      .catch(function(){
        diagMsg='Serveur injoignable — vérifie ta connexion';
        toast(diagMsg,'⚠️'); render();
      });
    return;
  }
  if(a==='pushon'){  pushEnable();  return; }
  if(a==='pushoff'){ pushDisable(); return; }
  if(a==='pushtest'){ pushTest();   return; }
  if(a==='logout'){
    if(!window.confirm('Te déconnecter ? Tes données restent sur ce téléphone.')) return;
    var tk=state.account&&state.account.token;
    state.account=null; state.cloudAt=0; save(); render();
    toast('Déconnecté','👋');
    if(tk) acctCall({action:'logout',token:tk}).catch(function(){});
    return;
  }
  if(a==='cloudnow'){
    toast('Sauvegarde…','☁️');
    cloudSave(true).then(function(ok){ render(); toast(ok?'Sauvegardé':'Sauvegarde impossible', ok?'✅':'⚠️'); });
    return;
  }
  if(a==='mergeRemote'){
    closeSheet();
    cloudRestore().then(function(ok){ toast(ok?'Données du compte restaurées':'Restauration impossible', ok?'☁️':'⚠️'); });
    return;
  }
  if(a==='mergeLocal'){
    closeSheet(); render();
    cloudSave(true).then(function(ok){ toast(ok?'Ce téléphone fait foi désormais':'Sauvegarde impossible', ok?'✅':'⚠️'); });
    return;
  }
  if(a==='resync'){
    if(!netReady()){ toast('Classement hors ligne — codes à la main','📴'); return; }
    toast('Synchronisation…','🔄'); diagMsg='';
    syncNow(true).then(function(ch){
      render();
      toast(syncFail?'Serveur injoignable':(ch?'Classement à jour':'Rien de nouveau'), syncFail?'⚠️':'✅');
    });
    return;
  }
  if(a==='avatar'){
    var pn=$('#pname'); if(pn) state.profile.name=pn.value.trim()||'Moi';
    state.profile.avatar=el.getAttribute('data-a'); save(); buzz(20); render(); return;
  }
  if(a==='psave'){
    var p2=$('#pname');
    state.profile.name=(p2?p2.value.trim():'')||'Moi';
    save(); toast('Profil enregistré','👤'); render(); syncNow(true); return;
  }
  if(a==='badge'){
    var bid=el.getAttribute('data-b'), st2=badgeState();
    for(var bi=0;bi<BADGES.length;bi++){
      if(BADGES[bi].id===bid) toast(BADGES[bi].n+' — '+BADGES[bi].d, st2.got[bid]?'✅':'🔒');
    }
    return;
  }
  if(a==='mycode'){ copyText(myCode(),'Ton code ami est copié'); return; }
  if(a==='addfriend'){ var fc=$('#fcode'); addFriend(fc?fc.value:''); return; }
  if(a==='unfriend'){
    if(!window.confirm('Retirer cet ami du classement ?')) return;
    state.friends=state.friends.filter(function(f){ return f.id!==id; });
    if(state.pendingDrop.indexOf(id)<0) state.pendingDrop.push(id);
    save(); toast('Ami retiré','🗑️'); render();
    /* sans effacer le lien, il reviendrait à la synchro suivante */
    api({action:'unlink', me:state.profile.id, target:id})
      .then(function(){
        var i=state.pendingDrop.indexOf(id); if(i>-1) state.pendingDrop.splice(i,1); save();
      }).catch(function(){});
    return;
  }
  if(a==='ics'){ makeICS(); return; }
  if(a==='notifperm'){ askNotif(); return; }
  if(a==='export'){ exportData(); return; }
  if(a==='import'){ importData(); return; }

  /* --- tutoriel --- */
  if(a==='cnop')  return;
  if(a==='cnext'){ if(coachOn) coachNext(); return; }
  if(a==='cprev'){ coachPrev(); return; }
  if(a==='cskip'){ closeTour(true); toast('Tuto passé — tu peux le revoir dans Profil › Aide','👍'); return; }
  if(a==='retuto'){
    state.tutoSeen=false; state.tutoStep=0; save();
    maybeTour(); return;
  }

  /* --- focus --- */
  if(a==='fxclose'){ focusClose(); return; }
  if(a==='fxstep'){
    var l=focusList(); if(!l.length) return;
    var r2=toggleStep(key,l[0],+el.getAttribute('data-i'));
    buzz(r2==='done'?[30,50,30]:15);
    if(r2==='done'){ fxStart=Date.now(); toast('Validée','✅'); }
    focusRender(); return;
  }
  if(a==='fxdone'){
    var l2=focusList(); if(!l2.length) return;
    setDone(key,l2[0],true); buzz([30,50,30]);
    toast('+'+(entry(key,l2[0].id).pts)+' pts','✅');
    fxStart=Date.now(); focusRender(); return;
  }
  if(a==='fxskip'){
    var l3=focusList(); if(!l3.length) return;
    fxSkipped.push(l3[0].id); fxStart=Date.now(); buzz(15); focusRender(); return;
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.key!=='Escape') return;
  if($('#focus').classList.contains('open')) focusClose();
  else if($('#modal').classList.contains('open')){ closeSheet(); render(); }
});

function toTop(){ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } }

/* ======================================================================= */
/*                        TUTORIEL (projecteur)                            */
/* ======================================================================= */
/* Un seul parcours, coupé en deux : les 5 premières étapes expliquent l'écran
   de choix de la journée, les suivantes visitent l'app une fois débloquée.  */
var TOUR=[
 /* ---------- partie 1 : poser sa journée ---------- */
 {tab:'jour', sel:null, t:'Bienvenue dans Cadence',
  x:"Ton carnet de discipline. Sans compte, tout reste dans ce navigateur ; relie un compte Google et tes données te suivent d'un téléphone à l'autre. Six étapes, et tu sais tout faire."},
 {tab:'jour', sel:'#planlist|#planhead|.task|.dayhead', t:'Chaque jour commence ici',
  x:"Tu choisis d'abord ce que tu fais aujourd'hui. Touche une tâche pour la retirer de ta journée — repos, imprévu, blessure : elle ne comptera pas contre toi."},
 {tab:'jour', sel:'#fab', t:'Ajoute ce que tu veux',
  x:"Le + crée une tâche : nom, emoji, heure de rappel, étapes et couleur. « Juste aujourd'hui » disparaît demain, « récurrente » revient les jours que tu choisis."},
 {tab:'jour', sel:'[data-act="planok"]|[data-act="replan"]', t:'Valide ta journée',
  x:"Valider ouvre Stats, Habitudes et Journal, cadenassés tant que ta journée n'est pas posée. Et « Modifier ma journée » te ramène à ce choix quand tu veux."},
 /* ---------- partie 2 : l'app débloquée ---------- */
 {tab:'jour', sel:'.dayhead', t:'Ta journée',
  x:"L'anneau montre ton avancement, à côté tes points et ta meilleure série. Touche une tâche pour cocher ses étapes une par une, ou la coche pour la valider d'un coup : 10 points, +5 si tu es dans l'heure. Le bouton éclair lance le mode focus."},
 {tab:'sport', sel:'.hrow|.empty', t:'Le sport a son onglet',
  x:"Une séance n'est pas une case à cocher : tu la composes avec les exercices du catalogue, tu la déroules série par série, et elle laisse tes charges derrière elle. Elle rapporte ses points comme le reste, mais elle ne compte pas dans tes tâches du jour — ce sont deux choses différentes."},
 {tab:'jour', sel:'.tabs', t:'Le reste de l\'app',
  x:"Stats : ta régularité mois par mois et tes records. Habitudes : réorganiser et modifier. Journal : humeur, note, poids et nutrition. Profil : ton rang, tes badges, et le classement — envoie ton code à un pote, dès qu'il l'ajoute vous apparaissez chacun chez l'autre."}
];
var PART1=4;                      /* étapes 0..3 : avant la validation du jour */
var coachOn=false, coachI=0, coachTo=0;

function startTour(from,to){
  coachOn=true; coachI=from; coachTo=to;
  $('#coach').classList.add('on');
  coachShow();
}
function closeTour(done){
  coachOn=false;
  $('#coach').classList.remove('on');
  state.tutoStep=coachI;
  if(done){ state.tutoSeen=true; state.tutoV=TUTO_V; state.tutoStep=TOUR.length; state.tab='jour'; }
  save(); render();
}
/* première cible présente parmi les sélecteurs séparés par | */
function coachFind(sel){
  if(!sel) return null;
  var parts=sel.split('|');
  for(var i=0;i<parts.length;i++){ var el=$(parts[i]); if(el) return el; }
  return null;
}
/* un élément fixe (le +, la barre d'onglets) est déjà à l'écran : inutile de faire défiler */
function isFixed(el){
  for(var n=el; n && n!==document.body; n=n.parentElement){
    if(getComputedStyle(n).position==='fixed') return true;
  }
  return false;
}
function coachShow(){
  var st=TOUR[coachI];
  if(!coachOn || !st){ closeTour(true); return; }
  if(st.tab && state.tab!==st.tab){ state.tab=st.tab; render(); }
  var el = coachFind(st.sel);
  if(el){
    try{
      /* on remonte la cible juste sous l'en-tête pour dégager la place à la bulle */
      if(!isFixed(el)){
        window.scrollBy(0, el.getBoundingClientRect().top - ($('#topbar').offsetHeight+12));
      }
    }catch(e){}
  }
  setTimeout(function(){ coachPlace(st); },80);
}
function coachPlace(st){
  if(!coachOn) return;
  var hole=$('#chole'), box=$('#cbox');
  var el = coachFind(st.sel), r=null;
  if(el){
    r=el.getBoundingClientRect();
    if(r.width<2 || r.height<2 || r.bottom<0 || r.top>window.innerHeight) { el=null; r=null; }
  }
  if(r){
    var pad = st.pad==null ? 8 : st.pad;
    hole.className='';
    hole.style.left  =(r.left-pad)+'px';
    hole.style.top   =(r.top-pad)+'px';
    hole.style.width =(r.width+pad*2)+'px';
    hole.style.height=(r.height+pad*2)+'px';
  }else{
    hole.className='none';
    hole.style.left='50%'; hole.style.top='50%'; hole.style.width='0px'; hole.style.height='0px';
  }
  var last = coachI===coachTo-1;
  var partEnd = last && coachTo===PART1;      /* fin de la partie 1 : on rend la main */
  box.innerHTML=
    '<div class="cstep">Étape '+(coachI+1)+' sur '+TOUR.length+'</div>'+
    '<h3>'+esc(TOUR[coachI].t)+'</h3><p>'+esc(TOUR[coachI].x)+'</p>'+
    '<div class="cnav">'+
      '<button class="skip lnk" data-act="cskip">Passer le tuto</button>'+
      (coachI>0 ? '<button class="btn sm" data-act="cprev" aria-label="Précédent">'+ic('left')+'</button>' : '')+
      '<button class="btn pri sm" data-act="cnext">'+
        (partEnd ? "J'ai compris" : last ? "C'est parti" : 'Suivant '+ic('right'))+'</button>'+
    '</div>'+
    '<div class="cdots">'+TOUR.map(function(_,i){ return '<i class="'+(i===coachI?'on':'')+'"></i>'; }).join('')+'</div>';

  /* la bulle prend le plus grand espace libre, et sa hauteur y est bornée :
     elle ne recouvre jamais la zone éclairée, même sur un petit écran. */
  var H=window.innerHeight, top;
  if(!r){
    box.style.maxHeight=(H-36)+'px';
    top=Math.max(18,(H-box.offsetHeight)/2);
  }else{
    var below=H-r.bottom-14, above=r.top-14;
    var under=below>=above;
    box.style.maxHeight=Math.max(130,(under?below:above)-10)+'px';
    var bh=box.offsetHeight;
    top = under ? r.bottom+14 : Math.max(8, r.top-14-bh);
  }
  box.style.top=Math.max(8,Math.min(top,H-box.offsetHeight-8))+'px';
}
function coachNext(){
  coachI++;
  state.tutoStep=coachI; save();          /* on reprendra ici si l'app est fermée en route */
  if(coachI>=coachTo) closeTour(coachTo>=TOUR.length);
  else coachShow();
}
function coachPrev(){ if(coachI>0){ coachI--; coachShow(); } }
function maybeTour(){
  /* Tutoriel jamais vu DANS CETTE VERSION : on repart du début, quel que soit l'état
     précédent. Sans ça, un tutoStep resté bloqué au-delà du début (tuto interrompu,
     données d'une version antérieure) empêchait le tutoriel de reparaître à jamais. */
  if((state.tutoV||0) < TUTO_V){
    state.tutoSeen=false; state.tutoStep=0; state.tutoV=TUTO_V; save();
  }
  if(state.tutoStep<0 || state.tutoStep>TOUR.length) state.tutoStep=0;   /* valeur aberrante */
  if(state.tutoSeen) return;
  /* On ne touche JAMAIS à la journée validée pour faire de la place au tutoriel :
     l'annuler reverrouillait Stats, Habitudes et Journal. Les étapes du choix du
     jour ont des cibles de repli et restent lisibles depuis la journée en cours. */
  if(!dayReady()){
    if(state.tutoStep>=PART1) return;     /* partie 1 déjà vue : on attend la validation du jour */
    startTour(state.tutoStep, PART1);      /* coupé en deux : la validation reprend la suite */
  }else{
    startTour(state.tutoStep, TOUR.length); /* journée déjà posée : les 6 étapes d'affilée */
  }
}
window.addEventListener('resize', function(){ if(coachOn) coachPlace(TOUR[coachI]); });

/* ======================================================================= */
/*                              DÉMARRAGE                                  */
/* ======================================================================= */
var lastDay=today();

function boot(){
  load();
  poserAccent();
  seed();
  if(TABS.map(function(t){return t[0];}).indexOf(state.tab)<0) state.tab='jour';
  $('#banner').classList.add('hide');
  render();
  maybeTour();

  syncNow(true);   /* on récupère ceux qui t'ont ajouté depuis la dernière fois */
  crewRefresh().then(function(){ if(state.tab==='profil') render(); });
  if(logged()) cloudRestore();   /* un autre téléphone a pu prendre la main */

  /* rappels : toutes les 20 s tant que l'app est ouverte */
  setTimeout(checkReminders, 1500);
  setInterval(checkReminders, 20000);

  /* changement de jour (les tâches « juste aujourd'hui » disparaissent) */
  setInterval(function(){
    var t=today();
    if(t!==lastDay){ lastDay=t; statsMonth=null; planDate=null; render(); }   /* la journée préparée devient celle du jour */
  }, 30000);

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible'){
      var t=today();
      if(t!==lastDay){ lastDay=t; statsMonth=null; planDate=null; }
      render(); checkReminders(); syncNow(false);
    }
  });
}
boot();
</script>
