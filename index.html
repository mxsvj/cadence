    seeded:false
  };
}
var state = defaults();

/* Les couleurs d'habitude sont un choix de l'utilisateur, mais celles proposées
   avant le changement de palette jurent avec le reste : on les transpose vers
   leur équivalent dans la nouvelle gamme. Une couleur inconnue n'est pas
   touchée. */
function repeindre(o){
  var table = { '#FF4D36':'#3B82F6', '#FFC94D':'#A78BFA', '#3ECF8E':'#34D399',
                '#59A9FF':'#22D3EE', '#B47DFF':'#A78BFA', '#FF7AB8':'#F472B6' };
  (o.habits||[]).forEach(function(h){
    if(h && table[h.color]) h.color = table[h.color];
  });
}

function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(!o || typeof o!=='object') return;
    var d = defaults();
    for(var k in d){ if(!(k in o)) o[k]=d[k]; }
    if(!Array.isArray(o.habits))  o.habits  = [];
    if(!Array.isArray(o.friends)) o.friends = [];
    if(!Array.isArray(o.pendingDrop)) o.pendingDrop = [];
    if(!o.log     || typeof o.log!=='object')     o.log={};
    if(!o.mood    || typeof o.mood!=='object')    o.mood={};
    if(!o.notes   || typeof o.notes!=='object')   o.notes={};
    if(!o.weight  || typeof o.weight!=='object')  o.weight={};
    if(!o.notified|| typeof o.notified!=='object')o.notified={};
    if(!Array.isArray(o.myexos)) o.myexos=[];
    if(!Array.isArray(o.foods))  o.foods=[];
    if(!Array.isArray(o.crews))  o.crews=[];
    if(!Array.isArray(o.gene))   o.gene=[];
    if(!Array.isArray(o.suivis)) o.suivis=[];
    if(!o.suppl || typeof o.suppl!=='object') o.suppl={};
    /* le coach a existé le temps d'une version : on efface ce qu'il avait
       rangé, sinon ça traînerait indéfiniment dans la sauvegarde. */
    delete o.coach; delete o.coachMsgs;
    o.wtarget=+o.wtarget||0;
    if(o.season && (!o.season.from || !o.season.to)) o.season=null;
    if(!o.meals   || typeof o.meals!=='object')   o.meals={};
    if(!o.body    || typeof o.body!=='object')    o.body={};
    if(!o.off     || typeof o.off!=='object')     o.off={};
    if(!o.plannedDays || typeof o.plannedDays!=='object') o.plannedDays={};
    if(typeof o.planned==='string' && o.planned){ o.plannedDays[o.planned]=true; }  /* ancien format */
    delete o.planned;
    var vieux=dk(addDays(nowD(),-60));
    for(var pk in o.plannedDays){ if(pk<vieux) delete o.plannedDays[pk]; }          /* on ne garde pas tout */
    if((+o.v||1) < 2) repeindre(o);   /* la palette a changé : on suit les habitudes déjà créées */
    o.v = d.v;
    o.tutoStep=+o.tutoStep||0; o.tutoV=+o.tutoV||0;
    if(!o.profile || !o.profile.id) o.profile = d.profile;
    o.focus = +o.focus || 0;
    state = o;
  }catch(e){
    console.warn('Cadence : lecture du stockage impossible, données par défaut.', e);
  }
}
function save(){
  calCache = null;                    /* les données ont bougé : la mesure est à refaire */
  try{ localStorage.setItem(LS, JSON.stringify(state)); }
  catch(e){ toast('Sauvegarde impossible (stockage plein ou navigation privée)','⚠️'); }
  if(typeof cloudSave==='function' && logged()) cloudSave(false);   /* différée */
}
function seed(){
  if(state.seeded || state.habits.length) return;
  var t = today();
  state.habits = DEFAULTS.map(function(h){
    var n={id:uid(), name:h.name, emoji:h.emoji, time:h.time, type:h.type,
           days:h.days.slice(), date:null, color:h.color, steps:h.steps.slice(), createdAt:t};
    if(h.kind==='seance'){ n.kind='seance'; n.exos=h.exos.map(function(e){ return {x:e.x,s:e.s,r:e.r,w:e.w,rest:e.rest}; }); }
    return n;
  });
  state.seeded = true;
  save();
}

/* ------------------------------------------------------- logique habitudes */
/* au calendrier : cette habitude tombe-t-elle ce jour-là ? */
function scheduled(h,key){
  if(h.createdAt && key < h.createdAt) return false;
  if(h.type==='once') return h.date===key;
  return (h.days||[]).indexOf(fromKey(key).getDay()) > -1;
}
/* retirée à la main de cette journée-là */
function isOff(key,id){ var a=state.off[key]; return !!(a && a.indexOf(id)>-1); }
/* retenue pour la journée = au calendrier ET pas retirée */
function planned(h,key){ return scheduled(h,key) && !isOff(key,h.id); }
function byTime(a,b){ return toMin(a.time)-toMin(b.time) || a.name.localeCompare(b.name); }
function scheduledFor(key){
  return state.habits.filter(function(h){ return !isSeance(h) && scheduled(h,key); }).sort(byTime);
}
/* Les tâches de la journée : les séances n'en font plus partie. Un
   entraînement n'est pas une case à cocher — il a son onglet, ses compteurs et
   ses points, mais il n'occupe plus un créneau du « 3 sur 5 ». */
function habitsFor(key){
  return state.habits.filter(function(h){ return !isSeance(h) && planned(h,key); }).sort(byTime);
}
/* Les séances prévues ce jour-là, pour l'onglet Sport. */
function seancesFor(key){
  return state.habits.filter(function(h){ return isSeance(h) && planned(h,key); }).sort(byTime);
}
/* la journée du jour a-t-elle été validée ? */
function dayReady(){ return !!state.plannedDays[today()]; }
var planDate=null;   /* non nul quand on prépare un autre jour qu'aujourd'hui */
function planKey(){ return planDate || today(); }
/* Tant qu'elle ne l'est pas : rien d'autre que Jour et Profil. Le Sport n'est
   pas verrouillé — le verrou existe pour qu'on pose sa journée avant d'aller
   consulter des chiffres, et s'entraîner n'est pas consulter. */
function locked(tab){
  return !dayReady() && tab!=='jour' && tab!=='profil' && tab!=='sport';
}
function habitById(id){
  for(var i=0;i<state.habits.length;i++) if(state.habits[i].id===id) return state.habits[i];
  return null;
}
function entry(key,id){ return (state.log[key] && state.log[key][id]) || null; }
function ensure(key,id){
  if(!state.log[key]) state.log[key]={};
  if(!state.log[key][id]) state.log[key][id]={done:false,steps:[],pts:0,doneAt:null};
  var e=state.log[key][id];
  if(!Array.isArray(e.steps)) e.steps=[];
  return e;
}
function isDone(key,id){ var e=entry(key,id); return !!(e&&e.done); }
function stepsDone(key,h){
  var e=entry(key,h.id); if(!e||!e.steps) return 0;
  var n=0, len=(h.steps||[]).length;
  for(var i=0;i<len;i++) if(e.steps[i]) n++;
  return n;
}
/* 10 pts par tâche, +5 si validée dans l'heure qui suit son horaire */
function computePts(h,doneAt){
  var p=10;
  if(h.time && doneAt){ var d=toMin(doneAt)-toMin(h.time); if(d>=0 && d<=60) p+=5; }
  return p;
}
function setDone(key,h,val){
  var e=ensure(key,h.id);
  if(val){
    if(!e.done){
      e.doneAt = (key===today()) ? nowHM() : (h.time||'12:00');
      e.pts    = computePts(h,e.doneAt);
    }
    e.done=true;
    if((h.steps||[]).length) e.steps = h.steps.map(function(){ return true; });
    /* une séance cochée sans avoir été déroulée compte quand même : on
       inscrit ce qui était prévu, sinon le carnet et la récupération
       resteraient vides alors que la séance a bien eu lieu. */
    if(isSeance(h) && !e.sea) e.sea = seanceParDefaut(h);
  }else{
    e.done=false; e.doneAt=null; e.pts=0; delete e.sea;
  }
  save();
}
function toggleStep(key,h,i){
  var e=ensure(key,h.id);
  e.steps[i] = !e.steps[i];
  var all = (h.steps||[]).length>0 && h.steps.every(function(_,j){ return !!e.steps[j]; });
  if(all && !e.done){
    e.done=true; e.doneAt=(key===today())?nowHM():(h.time||'12:00'); e.pts=computePts(h,e.doneAt);
    save(); return 'done';
  }
  if(!all && e.done){ e.done=false; e.doneAt=null; e.pts=0; }
  save(); return 'step';
}

/* -------------------------------------------------------------- scores */
function dayStat(key){
  var hs=habitsFor(key), d=0;
  for(var i=0;i<hs.length;i++) if(isDone(key,hs[i].id)) d++;
  return {done:d, total:hs.length, pct: hs.length ? Math.round(d*100/hs.length) : 0};
}
function dayPoints(key){
  var m=state.log[key]||{}, s=0;
  for(var k in m) if(m[k].done) s += (+m[k].pts || 10);
  return s;
}
function rangePoints(from,to){
  var s=0, d=new Date(from.getTime());
  while(d<=to){ s+=dayPoints(dk(d)); d=addDays(d,1); }
  return s;
}
function rangeStat(from,to){
  var done=0,total=0,d=new Date(from.getTime());
  while(d<=to){ var st=dayStat(dk(d)); done+=st.done; total+=st.total; d=addDays(d,1); }
  return {done:done,total:total,pct: total?Math.round(done*100/total):0};
}
function totalXP(){
  var s=0;
  for(var day in state.log){ var m=state.log[day]; for(var id in m) if(m[id].done) s+=(+m[id].pts||10); }
  return s;
}
function totalDone(){
  var n=0;
  for(var day in state.log){ var m=state.log[day]; for(var id in m) if(m[id].done) n++; }
  return n;
}
function doneBefore9(){
  var n=0;
  for(var day in state.log){ var m=state.log[day];
    for(var id in m){ var e=m[id]; if(e.done && e.doneAt && toMin(e.doneAt)<540) n++; } }
  return n;
}
function rankOf(xp){
  var i=0;
  for(var k=0;k<RANKS.length;k++) if(xp>=RANKS[k].xp) i=k;
  var cur=RANKS[i], nxt=RANKS[i+1]||null;
  var pct = nxt ? clamp(Math.round((xp-cur.xp)*100/(nxt.xp-cur.xp)),0,100) : 100;
  return {i:i, cur:cur, next:nxt, pct:pct, need: nxt ? nxt.xp-xp : 0};
}

/* premier jour connu (création d'habitude la plus ancienne ou plus vieux log) */
function firstDay(){
  var min=null;
  state.habits.forEach(function(h){ if(h.createdAt && (!min||h.createdAt<min)) min=h.createdAt; });
  for(var k in state.log){ if(!min||k<min) min=k; }
  return min || today();
}
function streakOf(h){
  var s=0, d=nowD(), t=today(), guard=0;
  while(guard++ < 1200){
    var key=dk(d);
    if(h.createdAt && key<h.createdAt) break;
    if(planned(h,key)){
      if(isDone(key,h.id)) s++;
      else if(key!==t) break;
    }
    d=addDays(d,-1);
  }
  return s;
}
function bestStreakOf(h){
  var best=0,cur=0,d=fromKey(h.createdAt||firstDay()),end=nowD();
  while(d<=end){
    var key=dk(d);
    if(planned(h,key)){
      if(isDone(key,h.id)){ cur++; if(cur>best) best=cur; }
      else if(key!==today()) cur=0;
    }
    d=addDays(d,1);
  }
  return best;
}
function globalStreak(){
  var s=0, d=nowD(), t=today(), first=firstDay(), guard=0;
  while(guard++ < 2000){
    var key=dk(d);
    if(key<first) break;
    var st=dayStat(key);
    if(st.total>0){
      if(st.done===st.total) s++;
      else if(key!==t) break;
    }
    d=addDays(d,-1);
  }
  return s;
}
function globalBestStreak(){
  var best=0,cur=0,d=fromKey(firstDay()),end=nowD();
  while(d<=end){
    var key=dk(d), st=dayStat(key);
    if(st.total>0){
      if(st.done===st.total){ cur++; if(cur>best) best=cur; }
      else if(key!==today()) cur=0;
    }
    d=addDays(d,1);
  }
  return best;
}
function perfectDays(){
  var n=0,d=fromKey(firstDay()),end=nowD();
  while(d<=end){ var st=dayStat(dk(d)); if(st.total>0 && st.done===st.total) n++; d=addDays(d,1); }
  return n;
}
function weekStat(monday){ return rangeStat(monday, addDays(monday,6)); }
/* nombre de semaines bouclées à 100% */
function weeks100(){
  var n=0,d=mondayOf(fromKey(firstDay())),end=mondayOf(nowD());
  while(d<=end){ var w=weekStat(d); if(w.total>0 && w.pct===100) n++; d=addDays(d,7); }
  return n;
}
/* jours où au moins une tâche a été validée */
function activeDays(){
  var n=0;
  for(var k in state.log){ var m=state.log[k];
    for(var id in m){ if(m[id].done){ n++; break; } } }
  return n;
}
function doneAfter22(){
  var n=0;
  for(var day in state.log){ var m=state.log[day];
    for(var id in m){ var e=m[id]; if(e.done && e.doneAt && toMin(e.doneAt)>=1320) n++; } }
  return n;
}
function notesCount(){
  return Object.keys(state.notes).filter(function(k){ return String(state.notes[k]||'').trim(); }).length;
}
function bestWeek(){
  var best=0,d=mondayOf(fromKey(firstDay())),end=mondayOf(nowD());
  while(d<=end){ var w=weekStat(d); if(w.total>0 && w.pct>best) best=w.pct; d=addDays(d,7); }
  return best;
}
function bestDayOfWeek(monday){
  var bp=-1,bd=null;
  for(var i=0;i<7;i++){
    var day=addDays(monday,i), st=dayStat(dk(day));
    if(st.total>0 && st.pct>bp){ bp=st.pct; bd=day; }
  }
  return bd ? {day:bd,pct:bp} : null;
}
function isLate(h,key){
  return key===today() && h.time && toMin(nowHM())>toMin(h.time) && !isDone(key,h.id);
}
function badgeState(){
  var xp=totalXP(), tot=totalDone(), gb=globalBestStreak();
  /* plus longue suite de jours consécutifs avec une note */
  var nk=Object.keys(state.notes).filter(function(k){ return String(state.notes[k]||'').trim(); }).sort();
  var notesRun=0, run=0, prev=null;
  nk.forEach(function(k){
    run = (prev && dk(addDays(fromKey(prev),1))===k) ? run+1 : 1;
    if(run>notesRun) notesRun=run;
    prev=k;
  });
  var pd=perfectDays(), b9h=doneBefore9(), fo=state.focus||0,
      w=Object.keys(state.weight).length, fr=state.friends.length, nc=notesCount();
  var got={
    b1: tot>=1,          b2: pd>=1,            b3: gb>=7,           b4: gb>=30,
    b5: gb>=100,         b6: bestWeek()>=100,  b7: weeks100()>=4,   b8: pd>=30,
    b9: tot>=100,        b10:tot>=500,         b11:tot>=1000,       b12:xp>=10000,
    b13:b9h>=10,         b14:b9h>=50,          b15:doneAfter22()>=20, b16:activeDays()>=100,
    b17:fo>=10,          b18:fo>=50,           b19:notesRun>=7,     b20:nc>=30,
    b21:w>=4,            b22:w>=30,            b23:fr>=1,           b24:fr>=5
  };
  return {got:got, xp:xp};
}

/* ========================================================================= */
/*                        ENTRAÎNEMENT : LA LOGIQUE                          */
/* ========================================================================= */
/* Une séance n'est pas un objet à part : c'est une tâche comme les autres,
   avec kind:'seance' et une liste d'exercices. Tout ce qui existe déjà — le
   choix de la journée, les points, la série, le classement, les rappels —
   continue de marcher sans une ligne de plus. */
function isSeance(h){ return !!(h && h.kind === 'seance'); }
function exosOf(h){ return (h && Array.isArray(h.exos)) ? h.exos : []; }
function setsPrevus(h){
  return exosOf(h).reduce(function(n, e){ return n + (+e.s || 0); }, 0);
}
/* « 3 × 12 rép. », « 3 × 45 s », et le poids quand il y en a un */
function ligneExo(e){
  var x = exoOr(e.x), t = (+e.s || 0) + ' × ' + (+e.r || 0) + ' ' + (UNITE[x.u] || '');
  if(+e.w) t += ' · ' + (+e.w) + ' kg';
  return t;
}
function seances(){ return state.habits.filter(isSeance); }

/* La prochaine séance : celle d'aujourd'hui si elle n'est pas faite, sinon la
   première des jours suivants. On ne regarde pas plus loin que deux semaines. */
function prochaineSeance(){
  var d = nowD();
  for(var j = 0; j < 14; j++){
    var key = dk(addDays(d, j));
    var l = state.habits.filter(function(h){ return isSeance(h) && planned(h, key); }).sort(byTime);
    for(var i = 0; i < l.length; i++){
      if(j > 0 || !isDone(key, l[i].id)) return { h: l[i], key: key, jours: j };
    }
  }
  return null;
}

/* ------------------------------------------------------------- le carnet */
/* Ce qui a été réellement fait est rangé dans le journal du jour, avec les
   identifiants d'exercice recopiés : le carnet survit à une séance modifiée
   ou supprimée. */
function seanceLog(key, id){
  var e = entry(key, id);
  return (e && e.sea) ? e.sea : null;
}
/* Validée sans être déroulée : on inscrit ce qui était prévu, sinon les
   compteurs et la récupération raconteraient n'importe quoi. */
function seanceParDefaut(h){
  return { d:0, plein:false, x: exosOf(h).map(function(e){
    var sets = [];
    for(var i = 0; i < (+e.s || 0); i++) sets.push({ r: +e.r || 0, w: +e.w || 0 });
    return { i: e.x, s: sets };
  })};
}
function statSeance(sea){
  var series = 0, reps = 0, secs = 0;
  (sea && sea.x || []).forEach(function(ex){
    var x = exoOr(ex.i);
    (ex.s || []).forEach(function(st){
      series++;
      if(x.u === 'rep')      reps += (+st.r || 0);
      else if(x.u === 'sec') secs += (+st.r || 0);
      else if(x.u === 'min') secs += (+st.r || 0) * 60;
    });
  });
  return { series: series, reps: reps, secs: secs };
}
/* Toutes les séances faites entre deux dates, la plus récente d'abord. */
function carnet(from, to){
  var out = [];
  for(var key in state.log){
    if(from && key < from) continue;
    if(to   && key > to)   continue;
    var jour = state.log[key];
    for(var id in jour){
      if(!jour[id].done || !jour[id].sea) continue;
      var h = habitById(id);
      out.push({ key: key, id: id, sea: jour[id].sea, at: jour[id].doneAt || '',
                 nom: (h && h.name) || 'Séance', emoji: (h && h.emoji) || 'dumbbell',
                 color: (h && h.color) || COLORS[0] });
    }
  }
  return out.sort(function(a, b){ return a.key < b.key ? 1 : (a.key > b.key ? -1 : 0); });
}
function statSemaine(monday){
  var fin = dk(addDays(monday, 6)), l = carnet(dk(monday), fin);
  var t = { seances: l.length, series: 0, reps: 0, secs: 0, parExo: {} };
  l.forEach(function(s){
    var st = statSeance(s.sea);
    t.series += st.series; t.reps += st.reps; t.secs += st.secs;
    (s.sea.x || []).forEach(function(ex){
      var n = (ex.s || []).reduce(function(a, b){ return a + (+b.r || 0); }, 0);
      t.parExo[ex.i] = (t.parExo[ex.i] || 0) + n;
    });
  });
  return t;
}
/* Les jours de la semaine où il y a eu une séance — pour la bande de rythme. */
function joursActifs(monday){
  var set = {};
  carnet(dk(monday), dk(addDays(monday, 6))).forEach(function(s){ set[s.key] = true; });
  return set;
}
/* Le meilleur d'un exercice : la série la plus lourde, sinon la plus longue. */
function recordExo(id){
  var best = null;
  carnet().forEach(function(s){
    (s.sea.x || []).forEach(function(ex){
      if(ex.i !== id) return;
      (ex.s || []).forEach(function(st){
        var poids = +st.w || 0, val = +st.r || 0;
        if(!best || poids > best.w || (poids === best.w && val > best.r))
          best = { w: poids, r: val, key: s.key };
      });
    });
  });
  return best;
}

/* -------------------------------------------------------- récupération */
/* Quand un muscle a-t-il travaillé pour la dernière fois, et à quel point.
   Un muscle moteur prend la durée pleine, un muscle qui suit en prend 60 %. */
function derniereCharge(){
  var out = {};
  carnet().forEach(function(s){
    /* une sauvegarde abîmée peut rendre une heure illisible : midi par
       défaut, plutôt qu'un « NaN jour » incompréhensible à l'écran */
    var mn = toMin(s.at || '12:00');
    var t = fromKey(s.key).getTime() + (isFinite(mn) ? mn : 720) * 60000;
    (s.sea.x || []).forEach(function(ex){
      var x = exoOr(ex.i), n = (ex.s || []).length;
      if(!n) return;
      (x.m || []).forEach(function(m){ pose(m, t, 1); });
      (x.s || []).forEach(function(m){ pose(m, t, .6); });
    });
    function pose(m, t2, part){
      if(!out[m] || t2 > out[m].t) out[m] = { t: t2, part: part };
      else if(t2 === out[m].t && part > out[m].part) out[m].part = part;
    }
  });
  return out;
}
function recuperation(){
  var charge = derniereCharge(), maintenant = Date.now();
  return MUSCLES.map(function(m){
    var c = charge[m.id];
    if(!c) return { id:m.id, n:m.n, f:m.f, etat:'pret', pct:1, depuis:null, reste:0 };
    var besoin = m.h * c.part;                          /* en heures */
    var passe  = (maintenant - c.t) / 3600000;
    var pct    = besoin > 0 ? passe / besoin : 1;
    return {
      id:m.id, n:m.n, f:m.f,
      etat: pct >= 1 ? 'pret' : (pct >= .5 ? 'recup' : 'chaud'),
      pct: clamp(pct, 0, 1),
      depuis: Math.max(0, Math.round(passe)),
      reste: Math.max(0, Math.round(besoin - passe))
    };
  });
}
/* Feu tricolore, pas palette de marque : sur un muscle, le rouge veut dire
   « n'y touche pas » dans toutes les applis de sport, et c'est plus fort que
   la cohérence chromatique. */
var ETATS = { chaud:{n:'Chaud', c:'#EF4444'}, recup:{n:'En récupération', c:'var(--gold)'},
              pret:{n:'Prêt à travailler', c:'var(--ok)'} };
/* Ce qu'il reste de frais, du plus reposé au moins reposé. */
function fraisDabord(){
  return recuperation().slice().sort(function(a, b){
    return (b.pct - a.pct) || (b.depuis || 9999) - (a.depuis || 9999);
  });
}

/* Pas d'accès à Apple Santé depuis le web : le métabolisme de repos est donc
   estimé (Mifflin-St Jeor, la formule la plus utilisée en diététique), et la
   dépense du jour vient des séances réellement inscrites au carnet. C'est une
   estimation, l'écran le dit. */
var ACTIVITES = [
  {id:'assis',  n:'Assis',       d:'Bureau, voiture, peu de marche',   k:1.25},
  {id:'debout', n:'Debout',      d:'Serveur, vendeur, beaucoup de marche', k:1.45},
  {id:'dur',    n:'Physique',    d:'Chantier, manutention, déménagement',  k:1.65}
];
var OBJECTIFS = [
  {id:'seche', n:'Sèche',    k:-.18, prot:2.0},
  {id:'maint', n:'Maintien', k:0,    prot:1.7},
  {id:'prise', n:'Prise',    k:+.12, prot:1.9}
];
function objectif(){
  var id=(state.body&&state.body.obj)||'maint';
  for(var i=0;i<OBJECTIFS.length;i++) if(OBJECTIFS[i].id===id) return OBJECTIFS[i];
  return OBJECTIFS[1];
}
function dernierPoids(){
  var ks=Object.keys(state.weight||{}).sort();
  return ks.length ? +state.weight[ks[ks.length-1]] : null;
}
function corpsPret(){
  var b=state.body||{};
  return !!(dernierPoids() && +b.taille && +b.age && b.sexe);
}
/* Mifflin-St Jeor : le repos, sans un gramme de sport dedans. */
function metabolismeRepos(){
  var b=state.body||{}, kg=dernierPoids();
  if(!kg || !+b.taille || !+b.age || !b.sexe) return 0;
  var base = 10*kg + 6.25*(+b.taille) - 5*(+b.age);
  return Math.round(base + (b.sexe==='f' ? -161 : 5));
}
function coefActivite(){
  var id=(state.body&&state.body.act)||'assis';
  for(var i=0;i<ACTIVITES.length;i++) if(ACTIVITES[i].id===id) return ACTIVITES[i].k;
  return ACTIVITES[0].k;
}

/* ------------------------------------------------- ce que coûte une séance
   Un MET, c'est la dépense au repos ; six MET, c'est six fois plus. Les
   valeurs viennent du Compendium of Physical Activities (Ainsworth 2011), la
   table que tout le monde utilise pour ça. On s'arrête à la famille : prétendre
   distinguer un curl d'un rowing donnerait une fausse précision, personne ne
   pousse deux séries de la même manière.

   Deux corrections par rapport à la version précédente, qui comptait 8 à
   10 kcal par minute pour tout le monde :
     · le poids de corps entre dans le calcul — à effort égal, 95 kg dépense
       bien plus que 60 kg, et une constante ne peut pas le savoir ;
     · on retire un MET. Ces minutes-là sont déjà comptées dans le métabolisme
       de la journée ; les compter deux fois gonflait une grosse séance de
       200 à 300 kcal, et c'est précisément ce genre d'erreur qui fait qu'on
       « mange ce qu'on a brûlé » sans jamais bouger sur la balance. */
var MET_EXO      = { course:9.0, corde:11.8, velo:7.5, rameur:7.0, burpees:8.0,
                     montclim:8.0, muscleup:8.0, suspension:3.0 };
var MET_CHARGE   = 5.0;   /* fonte : développé, squat, curl…                  */
var MET_CORPS    = 6.0;   /* traction, pompe, dip : tout le corps se déplace  */
var MET_ISO      = 4.0;   /* gainage, hollow : on tient, on ne bouge pas      */
var MET_CARDIO   = 7.5;   /* une minute de souffle, à défaut de mieux         */
var MET_LIBRE    = 5.0;   /* « autre chose » : une séance moyenne, sans plus */
var SEC_PAR_REP  = 3;     /* une répétition propre, descente comprise         */
var REPOS_MAX    = 180;   /* au-delà de trois minutes, on discute, on ne s'entraîne plus */
function metDe(x){
  if(MET_EXO[x.id]) return MET_EXO[x.id];
  if(x.u === 'min') return MET_CARDIO;
  if(x.u === 'sec') return MET_ISO;
  return (x.eq==='halt' || x.eq==='barbell' || x.eq==='elast') ? MET_CHARGE : MET_CORPS;
}
function kcalMin(met, kg){ return Math.max(0, met-1) * 3.5 * kg / 200; }

/* Un point qui se trompe facilement : les valeurs du Compendium se rapportent
   à la séance entière, repos entre les séries compris — pas aux seules secondes
   sous la barre. Ne compter que le temps sous tension donnerait quarante
   calories pour une séance d'une heure, ce qui n'a aucun sens : entre deux
   séries le cœur reste haut, et c'est déjà dans le chiffre.
   On déduit donc le mélange d'exercices du temps d'effort, puis on applique ce
   mélange à toute la durée de la séance. */
function depenseSeance(sea){
  var kg = dernierPoids();
  if(!kg || !sea) return 0;
  var minEffort = 0, minRepos = 0, metPondere = 0;
  (sea.x || []).forEach(function(ex){
    var x = exoOr(ex.i), met = metDe(x), min = 0;
    (ex.s || []).forEach(function(st){
      var v = +st.r || 0;
      if(x.u === 'min')      min += v;
      else if(x.u === 'sec') min += v / 60;
      else                   min += v * SEC_PAR_REP / 60;
      minRepos += Math.min(ex.rest != null ? +ex.rest : (x.r || 60), REPOS_MAX) / 60;
    });
    minEffort += min; metPondere += min * met;
  });
  var met = minEffort ? metPondere / minEffort : MET_LIBRE;
  /* Une durée mesurée vaut mieux qu'une durée devinée. */
  var minutes = (+sea.d > 0) ? +sea.d / 60 : minEffort + minRepos;
  return Math.round(minutes * kcalMin(met, kg));
}
function depenseSeances(key){
  var total = 0;
  carnet(key, key).forEach(function(sn){ total += depenseSeance(sn.sea); });
  return Math.round(total);
}

/* ------------------------------------------------------- calibrage réel
   Mifflin-St Jeor est une moyenne : à poids, taille et âge identiques, deux
   personnes peuvent avoir trois cents calories d'écart, et aucune formule ne
   le voit. La seule mesure honnête est la tienne — ce que tu manges, et ce que
   la balance en fait.

   Un kilo de corps vaut environ 7 700 kcal. Si sur trois semaines tu manges
   2 600 kcal par jour et que tu prends 400 g, ton vrai besoin est de
   2 600 − (0,4 × 7 700 / 21) ≈ 2 453.

   On ne compare pas la première pesée à la dernière : l'eau d'une seule
   journée suffirait à tout renverser. On prend la pente de toutes les pesées
   de la fenêtre, au moindre carré. */
var KCAL_PAR_KG   = 7700;
var CAL_FENETRE   = 28;     /* on regarde quatre semaines en arrière          */
var CAL_JOURS_MIN = 14;     /* moins de deux semaines, c'est du bruit         */
var CAL_PESEES_MIN= 4;
var CAL_MAX       = 600;    /* garde-fou : au-delà, c'est le carnet qui ment  */

function penteKgJour(pts){
  var n=pts.length, sx=0, sy=0, sxy=0, sxx=0, i;
  if(n < 2) return null;
  for(i=0;i<n;i++){ sx+=pts[i].j; sy+=pts[i].kg; sxy+=pts[i].j*pts[i].kg; sxx+=pts[i].j*pts[i].j; }
  var d = n*sxx - sx*sx;
  return d ? (n*sxy - sx*sy)/d : 0;
}
/* Quatre semaines à parcourir, et chaque journée relit tout le carnet : c'est
   trop cher pour le refaire à chaque rendu. On garde le résultat jusqu'au
   prochain save(), qui est le seul moment où il peut changer. */
var calCache = null;
function calibrage(fin){
  var repos = metabolismeRepos();
  if(!repos) return null;
  fin = fin || today();
  if(calCache && calCache.k === fin) return calCache.v;
  var d0 = addDays(fromKey(fin), -(CAL_FENETRE-1));
  var pesees=[], apports=[], sport=0, i, k, r;
  for(i=0;i<CAL_FENETRE;i++){
    k = dk(addDays(d0, i));
    if(state.weight[k] != null) pesees.push({ j:i, kg:+state.weight[k] });
    /* Une journée à moitié notée ressemble à une journée légère, et rien ne
       permet de les distinguer. On écarte celles qui tombent sous 60 % du
       repos : personne ne vit à ce régime, c'est un carnet incomplet. */
    r = totalRepas(k).kcal;
    if(r >= repos*0.6) apports.push(r);
    sport += depenseSeances(k);
  }
  var garde = function(v){ calCache = { k:fin, v:v }; return v; };
  if(pesees.length < CAL_PESEES_MIN || apports.length < CAL_JOURS_MIN) {
    return garde({ ok:false, pesees:pesees.length, notes:apports.length });
  }
  var etendue = pesees[pesees.length-1].j - pesees[0].j;
  if(etendue < CAL_JOURS_MIN) return garde({ ok:false, pesees:pesees.length, notes:apports.length });

  var moyen = apports.reduce(function(a,b){ return a+b; }, 0) / apports.length;
  var mesure = moyen - penteKgJour(pesees) * KCAL_PAR_KG;
  /* La mesure englobe les séances de la fenêtre : on la compare donc à ce que
     la formule prévoyait sur la même fenêtre, séances comprises, et on ne
     garde que l'écart. Le besoin du jour reste ainsi sensible à la séance
     d'aujourd'hui, tout en étant recalé sur ton métabolisme à toi. */
  var prevu  = Math.round(repos*coefActivite()) + sport/CAL_FENETRE;
  var ecart  = clamp(Math.round(mesure - prevu), -CAL_MAX, CAL_MAX);
  return garde({ ok:true, kcal:Math.round(mesure), ecart:ecart, prevu:Math.round(prevu),
                 pesees:pesees.length, notes:apports.length, jours:etendue+1 });
}
/* L'écart appliqué au besoin du jour : mesuré si on l'a et si tu l'acceptes. */
function ecartPerso(){
  var b = state.body || {};
  if(b.cal === false) return 0;
  var c = calibrage();
  return (c && c.ok) ? c.ecart : 0;
}

function besoinDuJour(key){
  var repos=metabolismeRepos();
  if(!repos) return null;
  var o=objectif(), sport=depenseSeances(key||today());
  /* Un maintien tapé à la main court-circuite tout le calcul : on ne recale
     pas un chiffre que quelqu'un a mesuré mieux que nous. */
  var main=+(state.body&&state.body.kcal)||0;
  var vie  = main>0 ? main : Math.round(repos*coefActivite());
  var perso= main>0 ? 0    : ecartPerso();
  var brut = vie + sport + perso;
  var vise = Math.round(brut*(1+o.k));
  /* Un objectif de sèche ne descend jamais sous le métabolisme de repos :
     en dessous, ce n'est plus un déficit, c'est une carence. */
  var plancher = o.k < 0 && vise < repos;
  return {
    repos:repos, vie:vie, sport:sport, perso:perso, manuel:main>0,
    brut:brut, plancher:plancher,
    kcal: plancher ? repos : vise,
    prot: Math.round((dernierPoids()||0)*o.prot)
  };
}
function repasDuJour(key){ return (state.meals[key]||[]).slice(); }
function totalRepas(key){
  return repasDuJour(key).reduce(function(a,r){
    return {kcal:a.kcal+(+r.kcal||0), prot:a.prot+(+r.prot||0)};
  }, {kcal:0, prot:0});
}
function ajouterRepas(key,r){
  if(!state.meals[key]) state.meals[key]=[];
  state.meals[key].push(r);
  /* on retient l'aliment pour ne pas le retaper demain */
  var deja=-1;
  for(var i=0;i<state.foods.length;i++) if(state.foods[i].n.toLowerCase()===r.n.toLowerCase()) deja=i;
  if(deja>-1) state.foods.splice(deja,1);
  state.foods.unshift({n:r.n, kcal:+r.kcal||0, prot:+r.prot||0});
  state.foods=state.foods.slice(0,40);
  save();
}

/* Un jour compte comme actif dès qu'une tâche y a été validée : c'est la
   définition que l'app utilise partout ailleurs, autant s'y tenir. */
function faitsDuJour(key){
  var j=state.log[key], n=0;
  if(!j) return 0;
  for(var id in j) if(j[id].done) n++;
  return n;
}
function joursActifsAnnee(an){
  var out={};
  for(var key in state.log){
    if(key.slice(0,4)!==String(an)) continue;
    var n=faitsDuJour(key);
    if(n) out[key]=n;
  }
  return out;
}
function anneesConnues(){
  var set={}, tk=today().slice(0,4);
  Object.keys(state.log).forEach(function(k){
    var j=state.log[k], a=false;
    for(var id in j) if(j[id].done) a=true;
    if(a) set[k.slice(0,4)]=true;
  });
  set[tk]=true;
  return Object.keys(set).sort().reverse();
}
/* Les cases de l'année, alignées sur les semaines : la première colonne
   commence au lundi qui précède le 1er janvier. */
function grilleAnnee(an){
  var debut=mondayOf(new Date(an,0,1)), fin=new Date(an,11,31);
  var actifs=joursActifsAnnee(an), cols=[], d=new Date(debut.getTime());
  while(d<=fin || d.getDay()!==1){
    if(d>fin && d.getDay()===1) break;
    var col=[];
    for(var i=0;i<7;i++){
      var key=dk(d), dedans=(d.getFullYear()===an);
      col.push({ key:key, dedans:dedans, n:actifs[key]||0, futur: key>today() });
      d=addDays(d,1);
    }
    cols.push(col);
    if(cols.length>53) break;
  }
  return { cols:cols, total:Object.keys(actifs).length };
}

/* ------------------------------------------------------------- la saison */
var SAISONS = [
  {m:[11,0,1], n:'Winter Arc'},
  {m:[2,3,4],  n:'Spring Cut'},
  {m:[5,6,7],  n:'Summer Shred'},
  {m:[8,9,10], n:'Autumn Build'}
];
function nomSaison(d){
  var mo=d.getMonth();
  for(var i=0;i<SAISONS.length;i++) if(SAISONS[i].m.indexOf(mo)>-1) return SAISONS[i].n;
  return 'Ma saison';
}
function saisonEtat(){
  var s=state.season;
  if(!s) return null;
  /* On compare des minuits, pas des instants : sinon l'heure qu'il est
     déciderait du numéro du jour. */
  var d0=fromKey(s.from), d1=fromKey(s.to), aujourdhui=fromKey(today());
  var total=Math.max(1,Math.round((d1-d0)/86400000)+1);
  var passe=clamp(Math.round((aujourdhui-d0)/86400000)+1,0,total);
  /* on ne compte que les jours déjà écoulés : une saison à venir est à zéro */
  var faits=0, parfaits=0;
  for(var i=0;i<passe;i++){
    var key=dk(addDays(d0,i));
    if(key>today()) break;
    if(faitsDuJour(key)) faits++;
    var st=dayStat(key);
    if(st.total && st.pct>=100) parfaits++;
  }
  return { n:s.n, from:s.from, to:s.to, total:total, passe:passe,
           reste:Math.max(0,total-passe), faits:faits, parfaits:parfaits,
           pct: Math.round(passe*100/total),
           tenue: passe ? Math.round(faits*100/passe) : 0,
           finie: today()>s.to, future: today()<s.from };
}

/* -------------------------------------------------------- zones sensibles */
/* On ne cache rien et on n'interdit rien : on signale. Un exercice qui charge
   une zone déclarée sensible porte un repère, et c'est à toi de décider. */
function exoSensible(x){
  if(!state.gene.length) return null;
  var m=(x.m||[]).filter(function(y){ return state.gene.indexOf(y)>-1; });
  var se=(x.s||[]).filter(function(y){ return state.gene.indexOf(y)>-1; });
  if(!m.length && !se.length) return null;
  return { fort:m.length>0, muscles:m.concat(se).map(function(y){ return MNAME[y]; }) };
}
function marqueSensible(x){
  var g=exoSensible(x);
  if(!g) return '';
  return '<span class="gene'+(g.fort?'':' faible')+'" title="'+esc(g.muscles.join(', '))+
         (g.fort?' — muscle moteur':' — muscle secondaire')+'">'+ic('alert')+'</span>';
}

var toastT=null;
/* Les appels à toast() passent encore un emoji : c'est la façon la plus courte
   d'écrire « ça a marché » ou « attention » au fil du code. On le traduit ici, une
   fois pour toutes, plutôt que de retoucher la centaine d'appels. */
var TEINTE_ICO = { alert:'var(--gold)', check:'var(--ok)', fire:'var(--gold)' };
function toast(msg,emoji){
  var el=$('#toast'), nom=emoji?icoDe(emoji,'check'):'';
  el.innerHTML=(nom?'<span class="ti"'+(TEINTE_ICO[nom]?' style="color:'+TEINTE_ICO[nom]+'"':'')+'>'+ic(nom)+'</span>':'')+
               '<span>'+esc(msg)+'</span>';
  el.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ el.classList.remove('on'); },2400);
}
/* les navigateurs bloquent (et signalent) toute vibration avant la 1re interaction :
   on attend donc que l'utilisateur ait touché l'écran au moins une fois. */
var touched=false;
['pointerdown','touchstart','keydown'].forEach(function(ev){
  document.addEventListener(ev, function(){ touched=true; }, {passive:true});
});
function buzz(p){ if(!touched) return; try{ if(navigator.vibrate) navigator.vibrate(p||30); }catch(e){} }

var TABS=[['jour','day','Jour'],['sport','dumbbell','Sport'],['stats','stats','Stats'],
          ['habitudes','habits','Habitudes'],['journal','journal','Journal'],['profil','profile','Profil']];
var pendingDel=null, delT=null, statsMonth=null, lbTab='day', justDone=null;

function renderTabs(){
  $('#tabs').innerHTML = TABS.map(function(t){
    var lk=locked(t[0]);
    return '<button class="tab'+(state.tab===t[0]?' on':'')+(lk?' lock':'')+'" data-act="tab" data-tab="'+t[0]+'"'+
           (lk?' aria-label="'+t[2]+' — verrouillé"':'')+'>'+
           '<span class="ti">'+ic(t[1])+(lk?'<span class="lk">'+ic('lock')+'</span>':'')+'</span>'+t[2]+'</button>';
  }).join('');
}
function ring(pct,size){
  var r=52, c=2*Math.PI*r, off=c*(1-clamp(pct,0,100)/100);
  var full=pct>=100;
  return '<div class="ringwrap"'+(size?' style="width:'+size+'px;height:'+size+'px;flex-basis:'+size+'px"':'')+'>'+
    '<svg class="ring'+(full?' full':'')+'" viewBox="0 0 120 120"'+(size?' style="width:'+size+'px;height:'+size+'px"':'')+'>'+
      '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">'+
        (full ? '<stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#7BE8B8"/>'
              : '<stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#22D3EE"/>')+
      '</linearGradient></defs>'+
      '<circle class="bgc" cx="60" cy="60" r="'+r+'"></circle>'+
      '<circle class="fgc" cx="60" cy="60" r="'+r+'" stroke="url(#rg)" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"></circle>'+
    '</svg>'+
    '<div class="ringtxt"><b>'+pct+'<span style="font-size:14px">%</span></b><small>DU JOUR</small></div></div>';
}
function quoteOfDay(){
  var d=nowD(), start=new Date(d.getFullYear(),0,0);
  var doy=Math.floor((d-start)/86400000);
  return QUOTES[doy % QUOTES.length];
}
function schedLabel(h){
  if(h.type==='once') return h.date===today() ? "Juste aujourd'hui" : 'Le '+frShort(fromKey(h.date));
  var ds=h.days||[];
  if(ds.length===7) return 'Tous les jours';
  if(ds.length===5 && [1,2,3,4,5].every(function(x){return ds.indexOf(x)>-1;})) return 'En semaine';
  if(ds.length===2 && ds.indexOf(0)>-1 && ds.indexOf(6)>-1) return 'Week-end';
  return DIDX.filter(function(x){ return ds.indexOf(x)>-1; })
             .map(function(x){ return DSHORT[x]; }).join(' · ');
}

function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  $('[data-act="theme"]').innerHTML = ic(state.theme==='dark'?'moon':'sun');
  var mt=$('meta[name="theme-color"]'); if(mt) mt.setAttribute('content', state.theme==='dark'?'#0E1116':'#F6F8FB');
  if(locked(state.tab)) state.tab='jour';
  renderTabs();
  var v=$('#view');
  if(state.tab==='jour')           v.innerHTML= (planDate || !dayReady()) ? viewPlan() : viewJour();
  else if(state.tab==='sport')     v.innerHTML=viewSport();
  else if(state.tab==='stats')     v.innerHTML=viewStats();
  else if(state.tab==='habitudes') v.innerHTML=viewHabitudes();
  else if(state.tab==='journal'){  v.innerHTML=viewJournal(); bindJournal(); }
  else                           { v.innerHTML=viewProfil(); bindAccount(); }
  justDone=null;   /* la pulsation ne se rejoue pas au rendu suivant */
  $('#fab').classList.toggle('hide', !(state.tab==='jour'||state.tab==='habitudes'||state.tab==='sport'));
  /* verrouillé = visible avec un cadenas, pas caché : on doit comprendre pourquoi */
  var fb=$('#topbar [data-act="gofocus"]');
  fb.innerHTML = ic('bolt') + (dayReady()?'':'<span class="lk">'+ic('lock')+'</span>');
  fb.classList.toggle('locked', !dayReady());
}

/* --------------------------------------------------------------- ONGLET JOUR */
function taskCard(h,key,done){
  var e=entry(key,h.id)||{};
  var ns=(h.steps||[]).length, ds=stepsDone(key,h), st=streakOf(h);
  var late=isLate(h,key);
  var meta=[];
  if(h.time) meta.push('<span class="num '+(late?'late':'')+'">'+esc(h.time)+'</span>');
  if(ns)     meta.push('<span class="num">'+ds+'/'+ns+' étapes</span>');
  if(isSeance(h)){
    var sea=e.sea, sx=sea?statSeance(sea):null;
    meta.push('<span class="num">'+(sx ? sx.series+' séries · '+(sx.reps||Math.round(sx.secs/60)+' min')
                                       : exosOf(h).length+' exercices')+'</span>');
  }
  if(st>1)   meta.push('<span>'+ic('fire')+' '+st+' j</span>');
  if(done && e.doneAt) meta.push('<span class="grn num">'+esc(e.doneAt)+' · +'+(e.pts||10)+' pts</span>');
  if(h.type==='once' && !done) meta.push('<span>'+ic('bolt')+' aujourd\'hui</span>');
  var sure = pendingDel===h.id;
  var pulse = (justDone===h.id) ? ' pulse' : '';
  return '<article class="card lift task'+(done?' done':'')+pulse+'" data-act="open" data-id="'+h.id+'">'+
    '<span class="etile"'+tileStyle(h.color)+'><span class="emo">'+ico(h.emoji,'star')+'</span></span>'+
    '<div class="tmain"><div class="tname">'+esc(h.name)+'</div>'+
      (meta.length?'<div class="tmeta">'+meta.join('')+'</div>':'')+'</div>'+
    '<div class="tright">'+
      '<button class="chk'+(done?' on':'')+'" data-act="toggle" data-id="'+h.id+'" aria-label="Valider">'+ic('check')+'</button>'+
      '<button class="del'+(sure?' sure':'')+'" data-act="del" data-id="'+h.id+'" aria-label="Supprimer">'+(sure?'Sûr ?':ic('trash'))+'</button>'+
    '</div></article>';
}

/* La bande des sept jours, et ce que pèse la semaine. */
/* Les sept cases de la semaine : un jour est actif dès qu'une tâche y a été
   validée. Les compteurs d'entraînement, eux, sont passés dans Sport — les
   mélanger ici n'avait plus de sens une fois les deux comptes séparés. */
function carteRythme(){
  var lundi=mondayOf(nowD()), actifs=joursActifs(lundi), tk=today();
  var h='<section class="card pop"><div class="sec" style="margin:0 0 2px"><h2>Ton rythme</h2>'+
        '<span class="small">cette semaine</span></div>'+
        '<div class="rythme">';
  for(var i=0;i<7;i++){
    var d=addDays(lundi,i), key=dk(d);
    var cl = actifs[key] ? 'on' : (key>tk ? 'fut' : '');
    if(key===tk) cl+=' now';
    h+='<div class="rday"><small>'+DL[i]+'</small><div class="rbox '+cl+'">'+
       (actifs[key]?ic('check'):'')+'</div></div>';
  }
  h+='</div></section>';
  return h;
}
/* La prochaine séance, avec de quoi la commencer sans la chercher. */
/* Dans la journée, le sport ne prend plus toute la place : une ligne quand
   une séance est prévue aujourd'hui, et elle renvoie vers l'onglet Sport où
   tout se passe. */
function rappelSport(){
  var t=today(), l=seancesFor(t).filter(function(x){ return !isDone(t,x.id); });
  if(!l.length) return '';
  var h=l[0];
  return '<div class="sec"><h2>Séance du jour</h2><span class="small">'+
      (l.length>1 ? l.length+' prévues' : esc(h.time||''))+'</span></div>'+
    '<article class="card lift hrow" data-act="tab" data-tab="sport">'+
      '<span class="etile"'+tileStyle(h.color)+'><span class="emo">'+ico(h.emoji,'dumbbell')+'</span></span>'+
      '<div class="tmain"><div class="tname">'+esc(h.name)+'</div>'+
        '<div class="tmeta"><span class="num">'+exosOf(h).length+' exercices · '+setsPrevus(h)+' séries</span>'+
        '<span class="acc">'+ic('right')+' dans Sport</span></div></div>'+
      '<div class="tright"><button class="del" data-act="runstart" data-id="'+h.id+'" aria-label="Démarrer">'+
        ic('play')+'</button></div>'+
    '</article>';
}
/* On a bougé sans ouvrir l'app : on inscrit la séance après coup. */
function bougeToday(){
  var l=seances(), key=today();
  var out='<div class="shead"><span class="etile">'+ic('fire')+'</span>'+
    '<div style="flex:1;min-width:0"><h2>Tu as fait quoi ?</h2>'+
    '<div class="muted small">Ça part directement dans le carnet</div></div>'+
    '<button class="iconbtn" data-act="closesheet" aria-label="Fermer">'+ic('close')+'</button></div>'+
    '<div style="height:12px"></div>';
  out+= l.length ? l.map(function(h){
      var deja=isDone(key,h.id);
      return '<button class="pickrow" data-act="bougeok" data-id="'+h.id+'"'+(deja?' disabled style="opacity:.4"':'')+'>'+
        '<span class="etile"'+tileStyle(h.color)+'><span class="emo">'+ico(h.emoji,'dumbbell')+'</span></span>'+
        '<span class="ei"><span class="pn">'+esc(h.name)+'</span><br><span class="pm">'+
        (deja?'déjà notée aujourd\'hui':exosOf(h).length+' exercices · '+setsPrevus(h)+' séries')+'</span></span></button>';
    }).join('') : '';

    'La durée sert à estimer la dépense, rien de plus.</div>'+
    '<div class="setgrid" style="grid-template-columns:1fr;margin:0 0 9px">'+
      nombre('Durée', dureeLibre, 'min', 'bougedur', 0)+'</div>'+
    '<button class="btn wide" data-act="bougeok" data-id="">'+ic('bolt')+' Noter une séance libre</button></div>';
  openSheet(out);
}
var dureeLibre=45;
function bougeOk(id){
  var key=today(), h=id?habitById(id):null;
  if(h){
    if(isDone(key,h.id)){ toast('Elle est déjà notée','👌'); closeSheet(); return; }
    if(isOff(key,h.id)){ var a=state.off[key]; a.splice(a.indexOf(h.id),1); }
    if(!scheduled(h,key)){                    /* pas prévue ce jour-là : on la pose pour aujourd'hui */
      state.habits.push({id:uid(), name:h.name, emoji:h.emoji, time:h.time||nowHM(), type:'once',
        days:[], date:key, color:h.color, steps:[], kind:'seance', exos:exosOf(h).slice(), createdAt:key});
      h=state.habits[state.habits.length-1];
    }
    setDone(key,h,true);
  }else{
    var libre={id:uid(), name:'Séance libre', emoji:'bolt', time:nowHM(), type:'once',
      days:[], date:key, color:COLORS[0], steps:[], kind:'seance', exos:[], createdAt:key};
    state.habits.push(libre);
    setDone(key,libre,true);
    /* sans exercice il n'y aurait rien à inscrire : on pose la durée annoncée,
       sinon la séance n'apparaîtrait ni au carnet ni dans les compteurs. */
    ensure(key,libre.id).sea={ d:dureeLibre*60, plein:false, x:[] };
  }
  /* La séance ne valide plus la journée d'habitudes : ce sont deux choses
     séparées depuis que le sport a son onglet. */
  save(); buzz([25,50,25]); toast('Noté — respect','🔥'); syncLater();
  closeSheet(); render();
}

function viewJour(){
  var key=today(), hs=habitsFor(key), st=dayStat(key);
  var todo=hs.filter(function(h){ return !isDone(key,h.id); });
  var done=hs.filter(function(h){ return  isDone(key,h.id); });
  var h='';

  h+='<section class="card dayhead pop">'+ring(st.pct)+
     '<div class="dh"><div class="date">'+esc(frDate(nowD()))+'</div>'+
     '<h1>'+st.done+'/'+st.total+' tâche'+(st.total>1?'s':'')+'</h1>'+
     '<div class="chips">'+
       '<span class="chip"><b>+'+dayPoints(key)+'</b> pts du jour</span>'+
       '<span class="chip">'+ic('fire')+' <b>'+globalBestStreak()+' j</b> meilleure série</span>'+
     '</div>'+
     '<button class="btn pri sm" data-act="gofocus">'+ic('bolt')+' Mode focus</button>'+
     '</div></section>';

  h+='<div class="sec"><h2>À faire</h2><span>'+todo.length+' restante'+(todo.length>1?'s':'')+'</span></div>';
  if(!todo.length){
    h+= hs.length
      ? '<div class="card empty"><span class="e">'+ic('trophy')+'</span><b>Journée bouclée.</b><br>Tout est validé, respect.</div>'
      : '<div class="card empty"><span class="e">'+ic('sprout')+'</span>Rien de prévu aujourd\'hui.<br>Appuie sur <b>+</b> pour créer une tâche.</div>';
  } else h+=todo.map(function(x){ return taskCard(x,key,false); }).join('');

  if(done.length){
    h+='<div class="sec"><h2>Fait</h2><span class="grn">'+done.length+' '+ic('check')+'</span></div>';
    h+=done.map(function(x){ return taskCard(x,key,true); }).join('');
  }

  h+= rappelSport();
  h+= carteRythme();

  var demain=dk(addDays(nowD(),1)), pret=!!state.plannedDays[demain];
  h+='<div class="grid2" style="margin-top:16px">'+
     '<button class="btn ghost sm" data-act="replan">'+ic('edit')+' Modifier</button>'+
     '<button class="btn '+(pret?'ghost':'')+' sm" data-act="plannext">'+ic('moon')+' '+(pret?'Demain est prêt':'Préparer demain')+'</button>'+
     '</div>';
  h+='<div class="quote"><p>« '+esc(quoteOfDay())+' »</p><small>CADENCE · '+esc(frShort(nowD()))+'</small></div>';
  return h;
}

/* ------------------------------------------------------- fiche routine (sheet) */
var openHabit=null, timers={};

function stepSecs(txt){
  var m=String(txt).match(/(\d+)\s*(?:[-–à]\s*\d+\s*)?min/i);
  return m ? (+m[1])*60 : 0;
}
function openSheet(html){ $('#sheet').innerHTML='<div class="grab"></div>'+html; $('#modal').classList.add('open'); }
function closeSheet(){
  if(typeof scanStop==='function') scanStop();
  $('#modal').classList.remove('open'); openHabit=null; formData=null;
}

function renderSheet(){
  var h=openHabit; if(!h) return;
  var key=today(), e=ensure(key,h.id), steps=h.steps||[];
  var out='<div class="shead"><span class="etile"'+tileStyle(h.color)+
    '><span class="emo">'+ico(h.emoji,'star')+'</span></span>'+
    '<div style="flex:1;min-width:0"><h2>'+esc(h.name)+'</h2><div class="muted small">'+
      (h.time?esc(h.time)+' · ':'')+esc(schedLabel(h))+' · '+ic('fire')+' '+streakOf(h)+' j'+
      (bestStreakOf(h)>streakOf(h)?' (record '+bestStreakOf(h)+')':'')+'</div></div>'+
    '<button class="iconbtn" data-act="closesheet" aria-label="Fermer">'+ic('close')+'</button></div>';

  if(steps.length){
    out+='<div class="steps">'+steps.map(function(s,i){
      var secs=stepSecs(s), tk=h.id+'_'+i, t=timers[tk];
      var tb='';
      if(secs){
        var left = t ? t.left : secs;
        tb='<button class="tmr'+(t&&t.run?' run':'')+'" data-act="timer" data-i="'+i+'" data-key="'+tk+'">'+
           ic(t&&t.run?'pause':'timer')+'<span class="tv">'+mmss(left)+'</span></button>';
      }
      return '<button class="step'+(e.steps[i]?' on':'')+'" data-act="step" data-i="'+i+'">'+
             '<span class="box">'+ic('check')+'</span><span class="lbl">'+esc(s)+'</span>'+tb+'</button>';
    }).join('')+'</div>';
    var n=stepsDone(key,h);
    out+='<div class="muted small center" style="margin-bottom:4px">'+n+' / '+steps.length+' étapes'+
         (e.done?' · <span class="grn">validée à '+esc(e.doneAt||'')+' (+'+(e.pts||10)+' pts)</span>':'')+'</div>';
  }else{
    out+='<div class="empty" style="padding:16px 0">Pas d\'étapes sur cette tâche.<br>Valide-la d\'un coup '+ic('down')+'</div>';
  }

  out+='<div class="sactions">'+
    '<button class="btn ghost" data-act="editHabit">'+ic('edit')+' Modifier</button>'+
    (e.done ? '<button class="btn" data-act="undo">'+ic('undo')+' Dévalider</button>'
            : '<button class="btn ok" data-act="validate">'+ic('check')+' Valider</button>')+
    '</div>';
  openSheet(out);
}
function openTask(id){
  var h=habitById(id); if(!h) return;
  openHabit=h;
  if(isSeance(h)) ficheSeance(h); else renderSheet();
}

/* -------------------------------------------------------------- ONGLET STATS */
function lvl(pct,total){
  if(!total)  return '';
  if(pct<=0)  return 'miss';
  if(pct<34)  return 'l1';
  if(pct<67)  return 'l2';
  if(pct<100) return 'l3';
  return 'l4';
}
function monthGrid(){
  var m = statsMonth || new Date(nowD().getFullYear(), nowD().getMonth(), 1);
  var y=m.getFullYear(), mo=m.getMonth();
  var first=new Date(y,mo,1), ndays=new Date(y,mo+1,0).getDate();
  var lead=(first.getDay()+6)%7, t=today();
  var cells='';
  for(var i=0;i<lead;i++) cells+='<div class="mcell pad"></div>';
  var mdone=0,mtotal=0;
  for(var d=1;d<=ndays;d++){
    var key=y+'-'+pad(mo+1)+'-'+pad(d), st=dayStat(key), fut=key>t;
    if(!fut){ mdone+=st.done; mtotal+=st.total; }   /* le futur ne compte pas comme raté */
    var cls=fut?'fut':lvl(st.pct,st.total);
    cells+='<div class="mcell '+cls+(key===t?' today':'')+'" data-act="dayinfo" data-day="'+key+'" title="'+key+'">'+d+'</div>';
  }
  var label=MONTHS[mo].charAt(0).toUpperCase()+MONTHS[mo].slice(1)+' '+y;
  var pct=mtotal?Math.round(mdone*100/mtotal):0;
  return {html:
    '<section class="card pop">'+
      '<div class="mnav"><button data-act="mprev" aria-label="Mois précédent">'+ic('left')+'</button>'+
        '<b>'+esc(label)+' · '+pct+'%</b>'+
        '<button data-act="mnext" aria-label="Mois suivant">'+ic('right')+'</button></div>'+
      '<div class="mhead">'+DL.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>'+
      '<div class="mgrid">'+cells+'</div>'+
      '<div class="legend">moins <i style="background:var(--card2)"></i>'+
        '<i style="background:rgba(52,211,153,.22)"></i><i style="background:rgba(52,211,153,.42)"></i>'+
        '<i style="background:rgba(52,211,153,.68)"></i><i style="background:var(--grn)"></i> plus</div>'+
    '</section>', done:mdone, total:mtotal, pct:pct, y:y, mo:mo};
}
function weeksChart(){
  var mon=mondayOf(nowD()), arr=[];
  for(var i=7;i>=0;i--){ var m=addDays(mon,-7*i); var w=weekStat(m); arr.push({m:m,pct:w.pct,total:w.total}); }
  var best=0; arr.forEach(function(a){ if(a.total&&a.pct>best) best=a.pct; });
  return '<section class="card pop"><div class="bars">'+arr.map(function(a){
    var hgt=a.total?Math.max(4,Math.round(a.pct*0.9)):3;   /* px : 100% -> 90px */
    var cls=a.total?(a.pct===best&&best>0?'best':'has'):'';
    return '<div class="barw"><span class="barv">'+(a.total?a.pct+'%':'–')+'</span>'+
      '<div class="bar '+cls+'" style="height:'+hgt+'px"></div>'+
      '<small>'+a.m.getDate()+'/'+(a.m.getMonth()+1)+'</small></div>';
  }).join('')+'</div></section>';
}
function weekTable(){
  var mon=mondayOf(nowD()), t=today();
  var ids={}, rows=[];
  for(var i=0;i<7;i++){
    habitsFor(dk(addDays(mon,i))).forEach(function(h){ if(!ids[h.id]){ ids[h.id]=1; rows.push(h); } });
  }
  if(!rows.length) return '<div class="card empty">Rien de planifié cette semaine.</div>';
  var head='<tr><th class="n" style="text-align:left">Habitude</th>'+DL.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
  var body=rows.map(function(h){
    var tds='';
    for(var i=0;i<7;i++){
      var key=dk(addDays(mon,i));
      if(!planned(h,key))          tds+='<td class="na">·</td>';
      else if(isDone(key,h.id))    tds+='<td class="yes">'+ic('check')+'</td>';
      else if(key>=t)              tds+='<td class="na">'+ic('dot')+'</td>';
      else                         tds+='<td class="no">'+ic('close')+'</td>';
    }
    return '<tr><td class="n">'+ico(h.emoji,'star')+' '+esc(h.name)+'</td>'+tds+'</tr>';
  }).join('');
  return '<section class="card pop"><table class="wtable">'+head+body+'</table></section>';
}
/* ------------------------------------------------- récupération et carnet */
var bodyFace='av', anneeVue=null;

/* ------------------------------------------------------ années de salle */
function carteAnnee(){
  var ans=anneesConnues(), an=anneeVue||+ans[0];
  var g=grilleAnnee(an), i=ans.indexOf(String(an));
  var h='<section class="card pop">'+
    '<div class="sec" style="margin:0 0 4px"><h2 style="font-size:17px">'+an+'</h2>'+
    '<span class="small">'+
      (ans.length>1?'<button data-act="anprev" class="acc"'+(i>=ans.length-1?' disabled style="opacity:.3"':'')+'>'+ic('left')+'</button> ':'')+
      '<b>'+g.total+' jours</b>'+

/* -------------------------------------------------------------- ONGLET SPORT */
/* Le sport a son onglet parce qu'une séance n'est pas une case à cocher : on la
   choisit, on la déroule série par série, elle laisse des charges et des
   répétitions derrière elle. Elle rapporte toujours ses points — l'XP, le rang
   et les défis du Crew continuent de la voir — mais elle n'occupe plus un
   créneau du « 3 tâches sur 5 » : ce sont deux comptes différents. */
function ligneSeance(h, key, compacte){
  var fait = key && isDone(key, h.id), l = exosOf(h);
  return '<article class="card lift hrow">'+
    '<span class="etile"'+tileStyle(h.color)+'><span class="emo">'+ico(h.emoji,'dumbbell')+'</span></span>'+
    '<div class="tmain"><div class="tname"'+(fait?' style="text-decoration:line-through;text-decoration-color:var(--mut2)"':'')+'>'+esc(h.name)+'</div>'+
      '<div class="tmeta"><span class="num">'+l.length+' exercice'+(l.length>1?'s':'')+' · '+
        setsPrevus(h)+' séries</span>'+
      (compacte ? '' : '<span>'+esc(schedLabel(h))+'</span>')+
      (fait ? '<span class="grn">'+ic('check')+' faite</span>' : '')+'</div></div>'+
    '<div class="tright">'+
      (fait ? '' : '<button class="del" data-act="runstart" data-id="'+h.id+'" aria-label="Démarrer">'+ic('play')+'</button>')+
      '<button class="del" data-act="editseance" data-id="'+h.id+'" aria-label="Modifier">'+ic('edit')+'</button>'+
      (compacte ? '' : '<button class="del'+(pendingDel===h.id?' sure':'')+'" data-act="del" data-id="'+h.id+'" aria-label="Supprimer">'+
        (pendingDel===h.id?'Sûr ?':ic('trash'))+'</button>')+
    '</div></article>';
}

function weightSpark(){
  var keys=Object.keys(state.weight).sort().slice(-30);
  if(keys.length<2){
    return '<div class="empty" style="padding:18px 0">'+
      (keys.length? 'Une seule pesée ('+state.weight[keys[0]]+' kg). Note-en une autre pour voir la courbe.'
                  : 'Aucune pesée. Note ton poids pour lancer la courbe.')+'</div>';
  }
  var vals=keys.map(function(k){ return state.weight[k]; });
  var cible=+state.wtarget||0;
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(cible){ mn=Math.min(mn,cible); mx=Math.max(mx,cible); }
  if(mx-mn<1){ mn-=0.5; mx+=0.5; }
  var W=320,H=110,P=8,PT=14,PB=18;
  var x=function(i){ return P + i*(W-2*P)/(keys.length-1); };
  var y=function(v){ return PT + (mx-v)*(H-PT-PB)/(mx-mn); };
  var pts=vals.map(function(v,i){ return x(i).toFixed(1)+','+y(v).toFixed(1); }).join(' ');
  var area='M'+x(0).toFixed(1)+','+(H-PB)+' L'+pts.split(' ').join(' L')+' L'+x(keys.length-1).toFixed(1)+','+(H-PB)+' Z';
  var last=vals[vals.length-1], first=vals[0], diff=+(last-first).toFixed(1);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#3B82F6" stop-opacity=".45"/>'+
      '<stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></linearGradient></defs>'+
    '<line class="gl" x1="'+P+'" y1="'+PT+'" x2="'+(W-P)+'" y2="'+PT+'"/>'+
    '<line class="gl" x1="'+P+'" y1="'+(H-PB)+'" x2="'+(W-P)+'" y2="'+(H-PB)+'"/>'+
    '<path class="ar" d="'+area+'"/>'+
    '<polyline class="ln" points="'+pts+'"/>'+
    (cible ? '<line class="tg" x1="'+P+'" y1="'+y(cible).toFixed(1)+'" x2="'+(W-P)+'" y2="'+y(cible).toFixed(1)+'"/>'+
             '<text class="tgt" x="'+(W-P)+'" y="'+(y(cible)-5).toFixed(1)+'" text-anchor="end">objectif '+cible+' kg</text>'
           : '')+
    '<circle class="dt" cx="'+x(keys.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="3.5"/>'+
    '<text x="'+P+'" y="'+(PT-4)+'">'+mx.toFixed(1)+' kg</text>'+
    '<text x="'+P+'" y="'+(H-5)+'">'+mn.toFixed(1)+' kg</text>'+
    '<text x="'+(W-P)+'" y="'+(H-5)+'" text-anchor="end">'+keys.length+' pesées · '+(diff>0?'+':'')+diff+' kg</text>'+
  '</svg>';
}

/* Le calibrage, tel qu'il se montre. Tant qu'il n'y a pas de quoi mesurer,
   on dit exactement ce qui manque plutôt que de rester muet : c'est la seule
   partie de l'app où l'utilisateur peut rendre le chiffre juste, et il faut
   qu'il sache combien de jours il lui reste à tenir. */
function carteCalibrage(){
  var b = state.body || {};
  if(+b.kcal > 0){
    return '<div class="calbox"><div class="ct">'+ic('edit')+' Maintien saisi à la main</div>'+
      '<div class="cv">'+(+b.kcal)+'<small style="font-size:14px;color:var(--mut)"> kcal</small></div>'+
      '<div class="cd">Cadence ne recalcule rien tant que ce chiffre est là. '+
      'La formule proposait '+Math.round(metabolismeRepos()*coefActivite())+' kcal hors sport.</div>'+
      '<div class="cb"><button class="btn ghost" data-act="calclear" style="flex:1;padding:8px">Revenir au calcul</button></div></div>';
  }
  var c = calibrage();
  if(!c) return '';
  if(!c.ok){
    var manquePes = Math.max(0, CAL_PESEES_MIN - c.pesees), manqueJ = Math.max(0, CAL_JOURS_MIN - c.notes);
    var fait = Math.min(c.pesees, CAL_PESEES_MIN)/CAL_PESEES_MIN*.5 + Math.min(c.notes, CAL_JOURS_MIN)/CAL_JOURS_MIN*.5;
    return '<div class="calbox"><div class="ct">'+ic('scale')+' Mesurer ton vrai besoin</div>'+
      '<div class="jauge"><i style="width:'+Math.round(fait*100)+'%"></i></div>'+
      '<div class="cd">Aucune formule ne connaît ton métabolisme : deux personnes du même gabarit '+

/*                    LES ALIMENTS : OPEN FOOD FACTS                         */
/* ========================================================================= */
/* Deviner « une assiette de pâtes, disons 600 kcal » est ce qui fausse le plus
   un suivi : l'erreur se répète à chaque repas. Une base d'aliments donne le
   chiffre imprimé sur le paquet, et le code-barres évite même de le chercher.

   Open Food Facts est tenue par des bénévoles, ouverte, gratuite, sans clé
   d'API. Trois millions de produits, et on peut la lire sans rien devoir à
   personne — c'est exactement ce qu'il fallait pour une app qui doit rester
   gratuite. On passe par /api/food, qui met en cache et allège les réponses.

   Et la photo du plat ? Voir le mot du même nom dans l'aide : un modèle qui
   reconnaît l'image coûte de l'argent à chaque appel, et de toute façon le
   gros de l'erreur n'est pas « qu'est-ce que c'est » mais « combien il y en
   a » — ce qu'aucune photo ne dit. Le code-barres, lui, ne se trompe pas. */
var FOOD='/api/food';
var offEtat='';              /* '' | 'cherche' | 'vide' | 'ko' */
var offRes=[];               /* derniers résultats */
var offQ='';

function food(payload){
  if(!netReady()) return Promise.reject(new Error('off'));
  return fetch(FOOD,{method:'POST',headers:{'Content-Type':'application/json'},
                     body:JSON.stringify(payload)})
    .then(function(r){
      if(r.status===404) return {ok:false, error:'inconnu'};
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    });
}
function chercherAliment(q){
  q=String(q||'').trim();
  if(q.length<2){ offEtat=''; offRes=[]; renderRepas(); return; }
  offQ=q; offEtat='cherche'; renderRepas();
  food({action:'search', q:q}).then(function(o){
    if(offQ!==q) return;                      /* une frappe plus récente a pris la main */
    offRes=(o&&o.produits)||[];
    offEtat=offRes.length?'':'vide';
    renderRepas();
  }).catch(function(){
    if(offQ!==q) return;
    offEtat='ko'; offRes=[]; renderRepas();
  });
}
/* Un code-barres ne désigne qu'un produit : le faire choisir dans une liste
   d'un seul élément serait un clic pour rien. On le prend directement. */
function alimentParCode(code){
  offEtat='cherche'; renderRepas();
  return food({action:'code', code:code}).then(function(o){
    if(o && o.ok && o.produit){ offEtat=''; prendreProduit(o.produit); buzz(20); }
    else { offRes=[]; offEtat='vide'; renderRepas(); }
    return o && o.produit;
  }).catch(function(){ offEtat='ko'; offRes=[]; renderRepas(); });
}

/* Le lecteur de code-barres du navigateur. Chrome sur Android l'a, Safari sur
   iPhone ne l'a pas encore : plutôt qu'embarquer une bibliothèque de plus, on
   propose alors de taper les chiffres sous les barres. C'est deux secondes,
   et ça marche partout. */
function scanPossible(){ return typeof window.BarcodeDetector === 'function'; }
var scanStop=null;
function ouvrirScanManuel(sousTitre){
  openSheet('<div class="shead"><span class="etile">'+ic('scan')+'</span>'+

    '<button class="iconbtn" data-act="closesheet" aria-label="Fermer">'+ic('close')+'</button></div>'+
    '<div style="height:14px"></div>'+

      '<input id="bcode" type="text" inputmode="numeric" maxlength="14" placeholder="ex. 3017620422003"></div>'+
    '<div class="sactions"><button class="btn ghost" data-act="closesheet">Annuler</button>'+
    '<button class="btn pri" data-act="bcodeok">Chercher</button></div>');
}
function ouvrirScan(){
  if(!netReady()){ toast('Ouvre l\'app par son adresse web pour chercher un produit','📴'); return; }
  if(!scanPossible()){ ouvrirScanManuel('Ce navigateur ne sait pas lire un code-barres'); return; }
  openSheet('<div class="shead"><span class="etile">'+ic('scan')+'</span>'+
    '<div style="flex:1;min-width:0"><h2>Vise le code-barres</h2>'+
    '<div class="muted small">Le paquet, pas l\'assiette</div></div>'+
    '<button class="iconbtn" data-act="scanclose" aria-label="Fermer">'+ic('close')+'</button></div>'+
    '<div class="scanbox"><video id="scanv" playsinline muted></video><div class="scanmire"></div></div>'+
    '<div class="small muted center" id="scanmsg" style="margin-top:10px">Autorise la caméra…</div>'+
    '<div class="sactions" style="margin-top:12px">'+
      '<button class="btn ghost wide" data-act="scanmanuel">Taper le code à la main</button></div>');
  demarrerScan();
}
function demarrerScan(){
  var v=$('#scanv'), msg=$('#scanmsg'), flux=null, det=null, vivant=true;
  scanStop=function(){
    vivant=false;
    try{ if(flux) flux.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    scanStop=null;
  };
  try{ det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}); }
  catch(e){ if(msg) msg.textContent='Ce téléphone ne lit pas ce type de code.'; return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(function(st){
      /* La feuille a pu se refermer pendant que l'utilisateur répondait à la
         demande d'autorisation : dans ce cas on rend la caméra tout de suite. */
      if(!vivant || !v || !v.isConnected){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
      flux=st; v.srcObject=st;
      var joue=v.play(); if(joue && joue.catch) joue.catch(function(){});
      if(msg) msg.textContent='Approche jusqu\'à ce que le code remplisse le cadre.';
      var boucle=function(){
        if(!vivant) return;
        det.detect(v).then(function(codes){
          if(!vivant) return;
          var c=codes && codes[0] && String(codes[0].rawValue||'').replace(/[^0-9]/g,'');
          if(c && c.length>=6){
            buzz(30); scanStop();
            closeSheet(); openRepas(); alimentParCode(c);
            return;
          }
          setTimeout(boucle, 260);
        }).catch(function(){ if(vivant) setTimeout(boucle, 400); });
      };
      setTimeout(boucle, 400);
    })
    .catch(function(){
      if(msg) msg.textContent='Caméra refusée. Tu peux taper le code à la main.';
    });
}

/* Un produit choisi dans la base est retenu « pour cent grammes » : c'est la
   seule manière d'être juste, puisque le paquet ne dit rien de ce qu'on a mis
   dans l'assiette. La quantité, elle, reste à la main — c'est la seule chose
   que le téléphone ne peut pas savoir, et prétendre la deviner serait pire
   que de la demander. */
function prendreProduit(x){
  repasF.n = x.m ? (x.n+' · '+x.m) : x.n;
  repasF.p100 = {kcal:x.kcal, prot:x.prot};

  var h='<div class="sec"><h2>Humeur du jour</h2><span>'+esc(frShort(nowD()))+'</span></div>';
  h+='<section class="card pop"><div class="moods">'+MOODS.map(function(m,i){
    return '<button class="mood'+(state.mood[t]===i?' on':'')+'" data-act="mood" data-i="'+i+'">'+ic(m)+'</button>';
  }).join('')+'</div></section>';

  h+='<div class="sec"><h2>Note du jour</h2><span class="saveflag" id="noteflag">'+ic('check')+' Enregistré</span></div>';
  h+='<section class="card pop"><textarea id="note" rows="4" placeholder="Comment ça s\'est passé ? Ce que tu retiens…">'+
      esc(state.notes[t]||'')+'</textarea></section>';

  var lastW=null, wk=Object.keys(state.weight).sort();
  if(wk.length) lastW=state.weight[wk[wk.length-1]];
  h+='<div class="sec"><h2>Poids</h2><span>'+(lastW!=null?lastW+' kg':'—')+'</span></div>';
  h+='<section class="card pop">'+
     '<div class="row" style="margin-bottom:10px">'+
       '<input id="wval" type="number" step="0.1" inputmode="decimal" placeholder="ex. 78.4" value="'+
         (state.weight[t]!=null?state.weight[t]:'')+'">'+
       '<button class="btn pri" data-act="wsave" style="flex:0 0 auto">Noter</button>'+
     '</div>'+ weightSpark() +
     '<button class="btn ghost wide sm" data-act="wtarget" style="margin-top:10px">'+ic('target')+' '+
       (state.wtarget ? 'Objectif : '+state.wtarget+' kg'+(lastW!=null?' · '+
          (Math.abs(lastW-state.wtarget)<.05 ? 'atteint'
           : (Math.abs(+(lastW-state.wtarget).toFixed(1))+' kg '+(lastW>state.wtarget?'à perdre':'à prendre'))) : '')
                      : 'Se donner un objectif')+
     '</button></section>';

  h+= carteNutrition();

  h+='<div class="sec"><h2>7 derniers jours</h2></div><section class="card pop" style="padding:2px 2px">';
  for(var i=0;i<7;i++){
    var d=addDays(nowD(),-i), k=dk(d), st=dayStat(k);
    var bits=[];
    bits.push(st.total? st.done+'/'+st.total+' tâches' : 'rien de prévu');
    if(state.weight[k]!=null) bits.push(state.weight[k]+' kg');
    if(state.notes[k] && state.notes[k].trim()) bits.push('« '+state.notes[k].trim().slice(0,44)+(state.notes[k].trim().length>44?'…':'')+' »');
    h+='<div class="hist"><div class="hd">'+esc(i===0?"auj.":frShort(d))+'</div>'+
       '<div style="font-size:19px;width:24px">'+(state.mood[k]!=null?ic(MOODS[state.mood[k]]):'<span class="muted" style="font-size:13px">–</span>')+'</div>'+
       '<div class="hn">'+esc(bits.join(' · '))+'</div>'+
       '<div class="small '+(st.total&&st.done===st.total?'grn':'muted')+'" style="font-weight:800">'+(st.total?st.pct+'%':'')+'</div></div>';
  }
  h+='</section>';
  return h;
}

/* ------------------------------------------------------------- ONGLET PROFIL */
function periodScores(){
  var t=today(), mon=mondayOf(nowD()), d=nowD();
  var m0=new Date(d.getFullYear(),d.getMonth(),1), m1=new Date(d.getFullYear(),d.getMonth()+1,0);
  var mEnd=m1>d?d:m1;                       /* le mois en cours s'arrête aujourd'hui */
  return {
    day:   dayPoints(t),                      dayP:  dayStat(t).pct,
    dayK:  t,
    week:  rangePoints(mon, addDays(mon,6)),  weekP: weekStat(mon).pct,
    weekK: dk(mon),
    month: rangePoints(m0, m1),               monthP:rangeStat(m0, mEnd).pct,
    monthK:d.getFullYear()+'-'+pad(d.getMonth()+1),
    xp:    totalXP()
  };
}

/*            CLASSEMENT PARTAGÉ  (seule partie qui sort du téléphone)        */
/* ========================================================================= */
/* Ce qui part : blaze, avatar, points du jour/semaine/mois et XP. Rien d'autre.
   Les habitudes, les notes, le poids et le journal ne quittent pas l'appareil. */
var API='/api/board';
var netOff=false;            /* pas de base branchée, ou fichier ouvert en local */
var diagMsg='';              /* verdict du dernier test de connexion */
var syncing=false, syncFail=0;

function netReady(){ return !netOff && (location.protocol==='http:'||location.protocol==='https:'); }
function api(payload){
  if(!netReady()) return Promise.reject(new Error('off'));
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(payload)})
    .then(function(r){
      if(r.status===501){ netOff=true; throw new Error('no_store'); }   /* aucune base : on arrête d'essayer */
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    });
}
function wireMe(){
  var sc=periodScores(), p=state.profile, t=statSemaine(mondayOf(nowD()));
  /* Seulement les exercices comptés en répétitions, et pas plus de vingt :
     c'est ce dont les défis du Crew ont besoin, rien de plus. */
  var exo={}, n=0;
  Object.keys(t.parExo).forEach(function(k){
    if(n>=20 || !/^[a-z0-9]{1,24}$/.test(k)) return;
    if(exoOr(k).u!=='rep') return;
    exo[k]=t.parExo[k]; n++;
  });
  return {id:p.id, name:p.name, avatar:p.avatar,
          day:sc.day,   dayP:sc.dayP,   dayK:sc.dayK,
          week:sc.week, weekP:sc.weekP, weekK:sc.weekK,
          month:sc.month, monthP:sc.monthP, monthK:sc.monthK,
          sea:t.seances, ser:t.series, rep:t.reps, exo:exo,
          xp:sc.xp, at:today(), ts:Date.now()};
}
/* On complète, on n'écrase jamais : un ami connu localement reste si le serveur
   ne le renvoie pas (hors ligne, base vide), et un nouveau venu s'ajoute seul. */
function mergeFriends(list){
  var changed=false, mine=state.profile.id;
  (list||[]).forEach(function(f){
    if(!f || !f.id || f.id===mine) return;
    if(state.pendingDrop.indexOf(f.id)>-1) return;    /* retrait pas encore parti */
    var found=null;
    for(var i=0;i<state.friends.length;i++) if(state.friends[i].id===f.id) found=state.friends[i];
    if(found && (+f.ts||0) < (+found.ts||0)) return;  /* fiche du serveur plus vieille : on garde la nôtre */
    if(found){
      if(found.name!==f.name||found.avatar!==f.avatar||found.day!==f.day||
         found.week!==f.week||found.month!==f.month||found.xp!==f.xp||
         found.dayP!==f.dayP||found.weekP!==f.weekP||found.monthP!==f.monthP) changed=true;
      found.name=f.name; found.avatar=f.avatar; found.at=f.at||found.at; found.ts=+f.ts||found.ts||0;
      found.day=f.day; found.dayK=f.dayK; found.dayP=f.dayP;
      found.week=f.week; found.weekK=f.weekK; found.weekP=f.weekP;
      found.month=f.month; found.monthK=f.monthK; found.monthP=f.monthP;
      found.xp=f.xp;
    }else{
      state.friends.push(f); changed=true;
    }
  });
  return changed;
}
function syncNow(force){
  if(syncing || !netReady()) return Promise.resolve(false);
  if(!force && Date.now()-(state.syncAt||0) < 25000) return Promise.resolve(false);
  syncing=true;
  return api({action:'sync', me:wireMe(), drop:state.pendingDrop.slice(0,20)})
    .then(function(o){
      syncing=false; syncFail=0; state.syncAt=Date.now();
      (o.dropped||[]).forEach(function(id){
        var i=state.pendingDrop.indexOf(id); if(i>-1) state.pendingDrop.splice(i,1);
      });
      var changed=mergeFriends(o.friends);
      save();
      if(changed && state.tab==='profil' && !coachOn) render();
      return changed;
    })
    .catch(function(){ syncing=false; syncFail++; return false; });
}
var syncT=null;
function syncLater(){ clearTimeout(syncT); syncT=setTimeout(function(){ syncNow(false); },4000); }

/* ========================================================================= */
/*                          NOTIFICATIONS PUSH                               */
/* ========================================================================= */
/* Sur iPhone, les vraies notifications n'existent que pour une app posée sur
   l'écran d'accueil : dans un onglet Safari, PushManager n'existe même pas.
   Et comme c'est le serveur qui décide de l'heure d'envoi, il lui faut les
   habitudes — donc il faut être connecté. */
var PUSH='/api/push';
var pushOn=false, pushDevices=0, pushMsg='';

function isStandalone(){
  return window.navigator.standalone===true ||
         !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function b64ToU8(base64){
  var s=(base64+'='.repeat((4-base64.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');
  var raw=atob(s), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function swReady(){
  if(!('serviceWorker' in navigator)) return Promise.reject(new Error('sw'));
  return navigator.serviceWorker.register('/sw.js').then(function(){
    return navigator.serviceWorker.ready;
  });
}
function pushCall(payload){
  return fetch(PUSH,{method:'POST',headers:{'Content-Type':'application/json'},
                     body:JSON.stringify(payload)})
    .then(function(r){ return r.json().then(function(o){ o._status=r.status; return o; }); });
}

/* Ce qu'on affiche dépend d'où l'on bloque : chaque cas appelle un geste différent. */
function pushLabel(){
  if(pushMsg) return pushMsg;
  if(location.protocol==='file:')   return 'Ouvre l\'app par son adresse web';
  if(!logged())                     return 'Connecte-toi pour activer les rappels';
  if(!pushSupported())              return isStandalone()
      ? 'Ton navigateur ne gère pas les notifications'
      : 'Ajoute l\'app à ton écran d\'accueil, puis reviens ici';
  if(window.Notification && Notification.permission==='denied')
                                    return 'Notifications refusées dans les réglages du téléphone';
  return pushOn ? 'Rappels actifs sur '+pushDevices+' appareil'+(pushDevices>1?'s':'')
                : 'Rappels éteints';
}
function pushReady(){
  return logged() && pushSupported() && location.protocol!=='file:' &&
         !(window.Notification && Notification.permission==='denied');
}

/* Vérifie l'abonnement réel plutôt que de se fier à un drapeau local. */
function pushRefresh(){
  if(!pushSupported() || !logged()) { pushOn=false; return Promise.resolve(); }
  return swReady().then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    pushOn=!!sub;
    if(!sub) return;
    return pushCall({action:'status', token:state.account.token}).then(function(o){
      if(o && o.ok) pushDevices=o.appareils||1;
    });
  }).catch(function(){ pushOn=false; });
}

function pushEnable(){
  if(location.protocol==='file:'){ toast('Ouvre l\'app par son adresse web','📴'); return; }
  if(!logged()){ toast('Connecte-toi d\'abord','🔑'); return; }
  if(!pushSupported()){
    toast(isStandalone()?'Non géré par ce navigateur':'Ajoute d\'abord l\'app à ton écran d\'accueil','📲');
    return;
  }
  pushMsg='Activation…'; render();
  Notification.requestPermission().then(function(perm){
    if(perm!=='granted'){ pushMsg=''; toast('Refusé — tu peux revenir sur ce choix dans les réglages','🙃'); render(); return; }
    return fetch(PUSH,{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(cfg){
      if(!cfg || !cfg.vapid) throw new Error('clé absente');
      return swReady().then(function(reg){
        return reg.pushManager.subscribe({userVisibleOnly:true,
          applicationServerKey:b64ToU8(cfg.vapid)});
      });
    }).then(function(sub){
      var j=sub.toJSON();
      return pushCall({action:'subscribe', token:state.account.token,
        subscription:{endpoint:j.endpoint, keys:j.keys},
        tz:new Date().getTimezoneOffset()});
    }).then(function(o){
      pushMsg='';
      if(o && o.ok){ pushOn=true; pushDevices=o.appareils||1; toast('Rappels activés','🔔'); }
      else toast('Activation refusée par le serveur','⚠️');
      render();
    });
  }).catch(function(e){
    pushMsg=''; toast('Activation impossible','⚠️'); render();
  });
}
function pushDisable(){
  pushMsg='Extinction…'; render();
  swReady().then(function(reg){ return reg.pushManager.getSubscription(); })
    .then(function(sub){
      if(!sub) return null;
      var ep=sub.endpoint;
      return sub.unsubscribe().then(function(){
        return pushCall({action:'unsubscribe', token:state.account.token, endpoint:ep});
      });
    })
    .then(function(){ pushMsg=''; pushOn=false; toast('Rappels éteints','🔕'); render(); })
    .catch(function(){ pushMsg=''; render(); });
}
function pushTest(){
  toast('Envoi en cours…','📨');
  pushCall({action:'test', token:state.account.token}).then(function(o){
    toast(o && o.ok ? 'Envoyée — elle doit arriver dans quelques secondes'
                    : 'Aucun appareil joignable', o && o.ok ? '✅' : '⚠️');
  }).catch(function(){ toast('Envoi impossible','⚠️'); });
}
