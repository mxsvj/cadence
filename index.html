<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="theme-color" content="#0E1116">
<meta name="description" content="Cadence — tracker d'habitudes, discipline et régularité.">
<title>Cadence</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230E1116'/%3E%3Ctext x='90' y='124' font-size='96' text-anchor='middle' fill='%233B82F6' font-family='Helvetica,Arial' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
<style>
/* ============================ 1. jetons ============================ */
:root{
  --bg:#0E1116; --surf:#171C24; --surf2:#1F2630; --nav:rgba(16,20,27,.86);
  --line:#242C38; --line2:#333D4C;
  --txt:#F2F5F9; --mut:#8C97A8; --mut2:#5F6B7C;
  --acc:#3B82F6; --acc-hi:#5B9BFF; --acc-soft:rgba(59,130,246,.14);
  --ok:#34D399; --ok-soft:rgba(52,211,153,.14);
  --gold:#FBBF24; --info:#22D3EE;
  --sh1:0 1px 2px rgba(0,0,0,.34), 0 3px 8px rgba(0,0,0,.22);
  --sh2:0 4px 10px rgba(0,0,0,.32), 0 14px 30px rgba(0,0,0,.34);
  --sh3:0 10px 24px rgba(0,0,0,.42), 0 30px 64px rgba(0,0,0,.5);
  --glow:0 6px 18px rgba(59,130,246,.30);
  --rl:20px; --r:14px; --rs:10px;
  --maxw:560px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
html[data-theme="light"]{
  --bg:#F6F8FB; --surf:#FFFFFF; --surf2:#EDF1F7; --nav:rgba(255,255,255,.88);
  --line:#E2E8F0; --line2:#CDD7E4;
  --txt:#0F1622; --mut:#59657A; --mut2:#8B97A6;
  --acc-soft:rgba(59,130,246,.10); --ok-soft:rgba(52,211,153,.14);
  --sh1:0 1px 2px rgba(22,42,74,.07), 0 2px 6px rgba(22,42,74,.06);
  --sh2:0 3px 8px rgba(22,42,74,.09), 0 12px 26px rgba(22,42,74,.11);
  --sh3:0 8px 20px rgba(22,42,74,.13), 0 28px 56px rgba(22,42,74,.16);
  --glow:0 6px 16px rgba(59,130,246,.26);
}

/* ============================ 2. socle ============================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.45;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Manrope',sans-serif;text-transform:uppercase;
  letter-spacing:.012em;font-weight:700;margin:0;line-height:1.04}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
/* surfaces du navigateur : elles font partie du design */
::selection{background:var(--acc);color:#fff}
input,textarea{caret-color:var(--acc)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:7px}
::-webkit-scrollbar-track{background:transparent}
.num,.wtable,.rec b,.ringtxt b,.fxtime,.tmr,.lbrow .pt,.barv{font-variant-numeric:tabular-nums}

input,textarea,select{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;width:100%;transition:border-color .16s,background .16s}
input::placeholder,textarea::placeholder{color:var(--mut2)}
input:focus,textarea:focus,select:focus{border-color:var(--acc);background:var(--surf)}
textarea{resize:vertical;line-height:1.55}
.muted{color:var(--mut)} .small{font-size:12.5px} .center{text-align:center}
.grn{color:var(--ok)} .acc{color:var(--acc)} .gld{color:var(--gold)}
.hide{display:none!important}

/* icônes dessinées, un seul jeu, une seule graisse de trait */
#sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:1em;height:1em;flex:0 0 auto;display:inline-block;vertical-align:-.14em;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ============================ 3. structure ============================ */
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;position:relative}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:linear-gradient(180deg,var(--bg) 0,var(--bg) 78%,rgba(14,17,22,0))}
html[data-theme="light"] #topbar{background:linear-gradient(180deg,var(--bg) 0,var(--bg) 78%,rgba(246,248,251,0))}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;
  letter-spacing:.15em;text-transform:uppercase;user-select:none;line-height:1}
.logo b{color:var(--acc);font-weight:700}
.tbr{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--surf);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mut);
  position:relative;transition:transform .16s var(--ease),background .16s,color .16s,border-color .16s}
.iconbtn:active{transform:scale(.9)}
@media (hover:hover){.iconbtn:hover{background:var(--surf2);color:var(--txt);border-color:var(--line2)}}
.iconbtn.locked{color:var(--mut2);opacity:.6}
.iconbtn .lk{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;
  background:var(--surf2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--mut)}
main{flex:1;padding:2px 16px 150px}
.sec{margin:26px 2px 11px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:20px}
.sec span,.sec .lnk{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}

/* ============================ 4. cartes & boutons ============================ */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--sh1);
  padding:15px;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s}
@media (hover:hover){.card.lift:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--line2)}}
.card.lift:active{transform:scale(.985)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:var(--r);background:var(--surf2);border:1px solid var(--line);
  font-weight:700;font-size:14px;letter-spacing:-.005em;color:var(--txt);
  transition:transform .14s var(--ease),background .16s,border-color .16s,opacity .16s}
.btn:active{transform:scale(.955)}
@media (hover:hover){.btn:hover{background:var(--surf);border-color:var(--line2)}}
.btn[disabled],.btn.off{opacity:.42;pointer-events:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--glow)}
@media (hover:hover){.btn.pri:hover{background:var(--acc-hi);border-color:var(--acc-hi)}}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#07120C;box-shadow:0 6px 18px rgba(52,211,153,.24)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{padding:10px 13px;font-size:13px;border-radius:12px}
.btn .ic{font-size:17px}
.lnk{font-size:12.5px;color:var(--mut);font-weight:700;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--line2);transition:color .16s}
@media (hover:hover){.lnk:hover{color:var(--txt)}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.chip b{color:var(--txt);font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* la tuile d'emoji porte la couleur de l'habitude — pas de filet coloré sur le bord */
.etile{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:var(--surf2);border:1px solid var(--line);transition:transform .18s var(--ease)}
.emo{font-size:23px;line-height:1;display:inline-block;will-change:transform}
@keyframes bounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-6px) scale(1.14)}
  62%{transform:translateY(0) scale(.97)}100%{transform:translateY(0) scale(1)}}
@media (hover:hover){.lift:hover .emo{animation:bounce .5s var(--ease)}}
.lift:active .emo{animation:bounce .42s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes chkpop{0%{transform:scale(1)}38%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}100%{box-shadow:0 0 0 14px rgba(52,211,153,0)}}
.task.pulse .chk{animation:chkpop .42s var(--ease), glow .6s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ============================ 5. barre d'onglets ============================ */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;
  padding:0 12px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
/* Six onglets sur un écran de 390 px : chacun tient dans 62 px, donc plus de
   gouttière ni de bourrage latéral, et un libellé d'un point plus petit. */
.tabs{pointer-events:auto;width:100%;max-width:var(--maxw);display:grid;grid-template-columns:repeat(6,1fr);
  gap:0;background:var(--nav);border:1px solid var(--line);border-radius:22px;padding:7px 4px;
  box-shadow:var(--sh2);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 1px;border-radius:14px;
  font-size:9px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--mut2);
  overflow:hidden;white-space:nowrap;
  transition:transform .14s var(--ease),color .18s,background .18s}
.tab .ti{position:relative;display:flex;font-size:19px;line-height:1;transition:transform .2s var(--ease)}
.tab:active{transform:scale(.92)}
.tab.on{color:var(--acc);background:var(--acc-soft)}
.tab.on .ti{transform:translateY(-1px)}
.tab.lock{color:var(--mut2);opacity:.55}
.tab.lock .ti .ic:first-child{opacity:.45}
.tab .lk{position:absolute;right:-8px;bottom:-4px;font-size:12px;color:var(--txt);opacity:.75;
  background:var(--surf);border-radius:50%;padding:1.5px;box-shadow:0 0 0 2.5px var(--bg)}

/* ============================ 6. bouton + ============================ */
#fab{position:fixed;z-index:46;right:max(16px,calc(50vw - var(--maxw)/2 + 16px));
  bottom:calc(env(safe-area-inset-bottom) + 88px);width:56px;height:56px;border-radius:19px;
  background:var(--acc);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(59,130,246,.4);transition:transform .16s var(--ease),background .16s}
#fab:active{transform:scale(.88)}
@media (hover:hover){#fab:hover{background:var(--acc-hi);transform:translateY(-2px)}}

/* ============================ 7. bannière de rappel ============================ */
#banner{position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:39;margin:0 16px 10px;
  display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--r);
  background:var(--acc);color:#fff;box-shadow:0 10px 24px rgba(59,130,246,.34);
  animation:rise .3s var(--ease) both}
#banner .bn{font-weight:800;font-size:14px}
#banner .bs{font-size:12px;opacity:.88}
#banner .x{margin-left:auto;font-size:17px;opacity:.9;padding:5px}

/* ============================ 8. onglet Jour ============================ */
.dayhead{display:flex;gap:16px;align-items:center;padding:17px 16px}
.ringwrap{position:relative;width:98px;height:98px;flex:0 0 98px}
.ring{width:98px;height:98px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--surf2)}
.ring .fgc{transition:stroke-dashoffset .55s var(--ease)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1;letter-spacing:-.01em}
.ringtxt small{font-size:9.5px;color:var(--mut);font-weight:700;letter-spacing:.09em;margin-top:1px}
.dh{flex:1;min-width:0}
.dh .date{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.dh h1{font-size:26px;margin:4px 0 9px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}

.task{display:flex;align-items:center;gap:13px;padding:12px 13px;margin-bottom:9px}
.tmain{flex:1;min-width:0}
.tname{font-weight:700;font-size:15.5px;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 9px;font-size:12px;color:var(--mut);font-weight:600;margin-top:3px}
.tmeta .late{color:var(--acc);font-weight:700}
.tmeta .num{font-variant-numeric:tabular-nums}
.tright{display:flex;align-items:center;gap:8px}
.chk{width:38px;height:38px;border-radius:12px;border:1.8px solid var(--line2);background:transparent;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:transparent;
  transition:background .2s var(--ease),border-color .2s,color .2s,transform .16s var(--ease)}
.chk:active{transform:scale(.87)}
@media (hover:hover){.chk:hover{border-color:var(--ok);color:var(--ok-soft)}}
.chk.on{background:var(--ok);border-color:var(--ok);color:#07120C}
.del{width:34px;height:34px;border-radius:11px;background:transparent;border:1px solid var(--line);
  font-size:16px;color:var(--mut);display:flex;align-items:center;justify-content:center;
  transition:transform .16s var(--ease),color .16s,background .16s,border-color .16s}
.del:active{transform:scale(.87)}
@media (hover:hover){.del:hover{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}}
.del.sure{width:auto;padding:0 11px;background:var(--acc);border-color:var(--acc);color:#fff;
  font-size:12px;font-weight:800;font-family:'Manrope',sans-serif}
.task.done{opacity:.58}
.task.done .tname{text-decoration:line-through;text-decoration-color:var(--mut2)}
.task.done .etile{filter:saturate(.5)}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.6}
.empty .e{font-size:36px;display:block;margin-bottom:10px}
.empty b{color:var(--txt)}
.quote{margin:28px 0 6px;padding:20px 16px;border-radius:var(--rl);
  background:var(--surf2);border:1px solid var(--line);text-align:center}
.quote p{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:21px;text-transform:uppercase;
  letter-spacing:.01em;line-height:1.18}
.quote small{display:block;margin-top:9px;color:var(--mut2);font-size:10.5px;font-weight:800;letter-spacing:.16em}

/* ============================ 9. choix de la journée ============================ */
.pcard{display:flex;align-items:center;gap:13px;padding:12px 13px;margin-bottom:9px}
.pchk{width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:1.8px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;
  transition:background .2s var(--ease),border-color .2s,color .2s}
.pcard.on .pchk{background:var(--ok);border-color:var(--ok);color:#07120C}
.pcard.off{opacity:.44}
.pcard.off .etile{filter:grayscale(1)}
.planbar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:20;margin-top:18px;
  padding:14px 0 4px;background:linear-gradient(180deg,transparent,var(--bg) 44%)}

/* ============================ 10. feuilles ============================ */
.modal{position:fixed;inset:0;z-index:70;display:none}
.modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .22s ease both}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--maxw);
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surf);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 22px);box-shadow:var(--sh3);
  animation:up .3s var(--ease) both}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:2px auto 15px}
.shead{display:flex;align-items:center;gap:13px;margin-bottom:4px}
.shead .etile{width:52px;height:52px;flex-basis:52px;border-radius:15px}
.shead .emo{font-size:28px}
.shead h2{font-size:23px}
.steps{margin:18px 0 8px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin-bottom:8px;
  background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);
  transition:transform .14s var(--ease),border-color .16s,background .16s}
.step:active{transform:scale(.98)}
@media (hover:hover){.step:hover{border-color:var(--line2)}}
.step .box{width:24px;height:24px;flex:0 0 24px;border-radius:8px;border:1.8px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;
  transition:background .2s var(--ease),border-color .2s,color .2s}
.step.on{background:transparent}
.step.on .box{background:var(--ok);border-color:var(--ok);color:#07120C}
.step.on .lbl{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--mut2)}
.step .lbl{flex:1;font-weight:600;font-size:14px}
.tmr{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;
  background:var(--surf);border:1px solid var(--line2);font-size:12px;font-weight:800;
  transition:transform .14s var(--ease),background .16s}
.tmr:active{transform:scale(.9)}
.tmr.run{background:var(--gold);border-color:var(--gold);color:#12161C}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);margin-bottom:7px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:var(--r);background:var(--surf2);border:1px solid var(--line);
  font-weight:700;font-size:13px;transition:transform .14s var(--ease),background .16s,border-color .16s}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{height:42px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);
  font-weight:800;font-size:13px;transition:transform .14s var(--ease),background .16s,border-color .16s}
.dchip:active{transform:scale(.9)}
.dchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.echips{display:flex;flex-wrap:wrap;gap:7px}
.echip{width:44px;height:44px;border-radius:13px;background:var(--surf2);border:1px solid var(--line);
  font-size:22px;color:var(--mut);display:flex;align-items:center;justify-content:center;
  transition:transform .14s var(--ease),background .16s,border-color .16s,color .16s}
.echip:active{transform:scale(.88)}
.echip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-hi)}
.cchips{display:flex;gap:10px;flex-wrap:wrap}
.cchip{width:38px;height:38px;border-radius:12px;border:2px solid transparent;
  transition:transform .16s var(--ease),box-shadow .16s}
.cchip:active{transform:scale(.88)}
.cchip.on{border-color:var(--txt);transform:scale(1.06)}
.sactions{display:flex;gap:10px;margin-top:18px}
.sactions .btn{flex:1}

/* ============================ 11. onglet Stats ============================ */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mnav b{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.mnav button{width:34px;height:34px;border-radius:11px;background:var(--surf2);border:1px solid var(--line);
  font-size:16px;color:var(--mut);display:flex;align-items:center;justify-content:center;
  transition:transform .14s var(--ease),color .16s,border-color .16s}
.mnav button:active{transform:scale(.87)}
@media (hover:hover){.mnav button:hover{color:var(--txt);border-color:var(--line2)}}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mhead div{text-align:center;font-size:9.5px;font-weight:800;color:var(--mut2);letter-spacing:.08em;margin-bottom:6px}
.mcell{aspect-ratio:1;min-height:30px;border-radius:9px;background:var(--surf2);border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--mut2);
  font-variant-numeric:tabular-nums;transition:transform .14s var(--ease)}
.mcell:active{transform:scale(.9)}
.mcell.l1{background:rgba(52,211,153,.20);color:#A9DCC4}
.mcell.l2{background:rgba(52,211,153,.40);color:#08160F}
.mcell.l3{background:rgba(52,211,153,.66);color:#07120C}
.mcell.l4{background:var(--ok);color:#07120C}
.mcell.miss{background:rgba(59,130,246,.13);color:var(--mut)}
.mcell.fut{background:transparent;border-color:var(--line);color:var(--mut2);opacity:.6}
.mcell.pad{background:transparent}
.mcell.today{border-color:var(--acc);color:var(--acc);font-weight:800}
.mcell.today.l2,.mcell.today.l3,.mcell.today.l4{color:#07120C}
.legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:11px;
  font-size:10px;color:var(--mut2);font-weight:700}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:7px;padding-top:8px}
.barw{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.bar{width:100%;border-radius:6px 6px 3px 3px;background:var(--surf2);min-height:3px;
  transition:height .5s var(--ease)}
.bar.has{background:rgba(59,130,246,.62)}
.bar.best{background:var(--ok)}
.barw small{font-size:9.5px;color:var(--mut2);font-weight:700}
.barv{font-size:9.5px;color:var(--mut);font-weight:800}
.wtable{width:100%;border-collapse:collapse;font-size:12px}
.wtable th{font-size:9.5px;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.07em;
  padding:0 0 9px}
.wtable td{padding:8px 2px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
.wtable td.n{text-align:left;font-weight:700;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.wtable .yes{color:var(--ok)} .wtable .no{color:var(--acc);opacity:.8} .wtable .na{color:var(--mut2);opacity:.45}
.wtable .ic{font-size:14px;stroke-width:2.4}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px;
  box-shadow:var(--sh1);display:flex;flex-direction:column;gap:2px}
.rec.hero{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;padding:15px 16px;
  background:linear-gradient(120deg,var(--surf),var(--surf2))}
.rec.hero .rt{flex:1}
.rec.hero .rt b,.rec.hero .rt small{display:block}
.rec.hero .rt b{margin-bottom:2px}
.rec.hero b{font-size:38px}
.rec b{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.rec small{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.bilan{padding:15px}
.bilan h3{font-size:16px;margin-bottom:6px}
.bilan p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.6}
.bilan p b{color:var(--txt);font-weight:700}
.up{color:var(--ok);font-weight:800} .down{color:var(--acc);font-weight:800}

/* ============================ 12. onglet Habitudes ============================ */
.hrow{display:flex;align-items:center;gap:12px;padding:12px 13px;margin-bottom:9px}
.ord{display:flex;flex-direction:column;gap:3px}
.ord button{width:28px;height:21px;border-radius:7px;background:var(--surf2);border:1px solid var(--line);
  font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:center;
  transition:transform .14s var(--ease),color .16s}
.ord button:active{transform:scale(.85)}
@media (hover:hover){.ord button:hover{color:var(--txt)}}
.ord button:disabled{opacity:.25;pointer-events:none}

/* ============================ 13. onglet Journal ============================ */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{aspect-ratio:1;min-height:56px;border-radius:16px;background:var(--surf2);border:1.8px solid var(--line);
  font-size:27px;display:flex;align-items:center;justify-content:center;
  transition:transform .18s var(--ease),border-color .18s,background .18s}
.mood:active{transform:scale(.88)}
.mood.on{border-color:var(--acc);background:var(--acc-soft);transform:scale(1.04)}
.saveflag{font-size:11px;color:var(--ok);font-weight:800;opacity:0;transition:opacity .3s}
.saveflag.on{opacity:1}
.spark{width:100%;height:auto;display:block}
.spark .ln{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:url(#wgrad)}
.spark .dt{fill:var(--acc)}
.spark .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.spark text{fill:var(--mut2);font-size:9px;font-weight:700;font-family:'Manrope',sans-serif}
.hist{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist .hd{width:68px;flex:0 0 68px;font-size:11.5px;font-weight:800;color:var(--mut)}
.hist .hn{flex:1;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================ 14. onglet Profil ============================ */
.rankcard{display:flex;align-items:center;gap:16px;padding:18px 16px;
  background:linear-gradient(125deg,var(--surf),var(--surf2))}
.rankcard .re{font-size:44px;line-height:1;width:62px;height:62px;flex:0 0 62px;border-radius:19px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(251,191,36,.20),transparent 68%)}
.rankcard h2{font-size:25px}
.prog{height:8px;border-radius:8px;background:var(--surf2);border:1px solid var(--line);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .6s var(--ease)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.badge{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 5px;text-align:center;
  box-shadow:var(--sh1);transition:transform .16s var(--ease),border-color .16s}
.badge:active{transform:scale(.93)}
.badge .be{font-size:25px;display:block;line-height:1.1}
.badge small{display:block;font-size:9.5px;font-weight:700;color:var(--mut);margin-top:6px;line-height:1.22}
.badge.off{opacity:.32;filter:grayscale(1)}
.badge.on{border-color:rgba(251,191,36,.4);background:linear-gradient(180deg,rgba(251,191,36,.09),var(--surf))}
.avarow{display:flex;flex-wrap:wrap;gap:7px}
.lbtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:13px}
.lbtabs button{padding:10px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);
  font-weight:700;font-size:12.5px;transition:transform .14s var(--ease),background .16s}
.lbtabs button:active{transform:scale(.95)}
.lbtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lbrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r);margin-bottom:7px;
  background:var(--surf2);border:1px solid var(--line)}
.lbrow.me{border-color:var(--acc);background:var(--acc-soft)}
.lbrow .pos{width:28px;flex:0 0 28px;text-align:center;font-weight:800;font-size:17px;color:var(--mut);line-height:1}
.lbrow .av{font-size:23px}
.lbrow .nm{flex:1;min-width:0}
.lbrow .nm b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .nm small{font-size:10.5px;color:var(--mut);font-weight:700}
.lbrow .pt{display:flex;flex-direction:column;align-items:flex-end;line-height:1;min-width:44px}
.lbrow .pt b{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;
  font-variant-numeric:tabular-nums}
.lbrow .pt small{font-size:10.5px;font-weight:700;color:var(--mut);margin-top:4px;
  font-variant-numeric:tabular-nums}
.lbrow.me .pt small{color:var(--acc)}
details{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  margin-bottom:9px;box-shadow:var(--sh1)}
details summary{font-weight:700;font-size:14px;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary .ic:first-child{font-size:19px;color:var(--mut)}
details summary .cv{margin-left:auto;font-size:16px;color:var(--acc);transition:transform .22s var(--ease)}
details[open] summary .cv{transform:rotate(180deg)}
details .dc{margin-top:12px;font-size:13px;color:var(--mut);line-height:1.65}
details .dc b{color:var(--txt)}
details .dc ol,details .dc ul{padding-left:18px;margin:8px 0}
details .dc li{margin-bottom:6px}
.ver{font-size:10.5px;color:var(--mut2);font-weight:700;letter-spacing:.06em}

/* ============================ 14b. entraînement ============================ */
.silh{display:block;flex:0 0 auto}
.silh.mini{border-radius:9px;background:var(--surf2)}

/* le dessin d'un exercice : le corps est une masse pleine, le matériel reste
   un trait. Le contraste entre les deux suffit à les distinguer sans couleur */
.exodraw{display:block;flex:0 0 auto;stroke-linecap:round;stroke-linejoin:round;
  color:var(--mut);border-radius:9px;background:var(--surf2)}
.exodraw .co{fill:currentColor;stroke:none}
.exodraw .mt{fill:none;stroke:currentColor}
.exorow .exodraw,.pickrow .exodraw{padding:1px}

/* une photo d'exercice : même gabarit que le dessin, mais elle a besoin de
   place — sous 40 px une salle de sport n'est plus qu'une tache */
.exophoto{display:block;flex:0 0 auto;object-fit:cover;border-radius:10px;
  background:var(--surf2)}
.rnbody .exophoto{border-radius:16px;margin-bottom:10px}
.exorow.now .exodraw{color:var(--acc)}
.rnbody .exodraw{color:var(--txt);background:none;margin-bottom:4px}

/* la bande des sept jours */
.rythme{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.rday{text-align:center}
.rday small{display:block;font-size:10.5px;font-weight:800;color:var(--mut2);letter-spacing:.06em;margin-bottom:5px}
.rbox{height:40px;border-radius:11px;border:1.6px solid var(--line);background:var(--surf2);
  display:flex;align-items:center;justify-content:center;color:var(--ok);
  transition:transform .16s var(--ease)}
.rbox .ic{font-size:15px;stroke-width:2.4}
.rbox.on{background:var(--ok-soft);border-color:rgba(52,211,153,.42)}
.rbox.now{border-color:var(--acc);border-width:2px}
.rbox.fut{border-style:dashed;background:transparent;border-color:var(--line)}
.wkstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px;
  padding-top:13px;border-top:1px solid var(--line)}
.wkstat div{text-align:center}
.wkstat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1}
.wkstat span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.05em}


/* une ligne d'exercice : dans la fiche et dans le formulaire */
.exorow{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--r);
  background:var(--surf2);border:1px solid var(--line);margin-bottom:8px}
.exorow .ei{flex:1;min-width:0}
.exorow .en{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exorow .em{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.exorow .eg{display:flex;flex-direction:column;gap:3px}
.exorow.done{opacity:.55}
.exorow.now{border-color:var(--acc);background:var(--acc-soft)}

/* réglage d'un nombre : moins, valeur, plus */
.step3{display:flex;align-items:center;gap:7px}
.step3 button{width:30px;height:30px;border-radius:9px;background:var(--surf);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--mut);transition:transform .14s var(--ease)}
.step3 button:active{transform:scale(.86)}
@media (hover:hover){.step3 button:hover{color:var(--txt);border-color:var(--line2)}}
.step3 .v{min-width:48px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.step3 .v small{font-weight:600;color:var(--mut);font-size:11px}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.setgrid .fl{font-size:11px;color:var(--mut2);font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:4px}

/* choix d'un exercice */
.pickbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.pickbar button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--surf2);
  border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.pickbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.picklist{max-height:46vh;overflow-y:auto;margin:0 -2px;padding:0 2px}
.pickrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;
  border-radius:var(--r);border:1px solid transparent;transition:background .14s}
.pickrow:active{background:var(--surf2)}
@media (hover:hover){.pickrow:hover{background:var(--surf2)}}
.pickrow .pn{font-weight:700;font-size:14.5px}
.pickrow .pm{font-size:11.5px;color:var(--mut)}

/* le mode séance : plein écran, une série à la fois */
#run{position:fixed;inset:0;z-index:82;display:none;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto}
#run.open{display:block;animation:fade .22s ease both}
.rnwrap{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.rntop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.rntop .cnt{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.rnprog{display:flex;gap:4px;margin-bottom:16px}
.rnprog i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.rnprog i.on{background:var(--acc)}
.rnprog i.dn{background:var(--ok)}
.rnbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rnname{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;text-transform:uppercase;
  line-height:1.04;margin:10px 0 2px}
.rnserie{font-size:12.5px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.1em}
.rnbig{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:700;line-height:1;
  margin:10px 0 0;font-variant-numeric:tabular-nums}
.rnbig small{font-size:22px;color:var(--mut);margin-left:5px}
.rnrepos{font-family:'Barlow Condensed',sans-serif;font-size:62px;font-weight:700;color:var(--gold);
  font-variant-numeric:tabular-nums;line-height:1;margin:6px 0}
.rnact{display:flex;gap:10px;margin-top:20px;width:100%}
.rnact .btn{flex:1;padding:16px}
.rnnext{margin-top:16px;font-size:12.5px;color:var(--mut);text-align:center}

/* récupération */
.bodywrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 2px}
/* attention : .mgrid est déjà la grille du mois. Celle-ci s'appelle autrement. */
.mrecup{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:12px}
.mrow{display:flex;align-items:flex-start;gap:8px}
.mrow i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.mrow .mn{font-size:13.5px;font-weight:700;line-height:1.2}
.mrow .ms{font-size:11.5px;color:var(--mut)}
.mleg{display:flex;justify-content:center;gap:15px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.mleg span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);font-weight:700}
.mleg i{width:8px;height:8px;border-radius:50%}

/* carnet */
.lgrow{display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:8px}
.lgd{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.lgs{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}

/* ============================ 14c. nutrition ============================ */
.nring{display:flex;gap:10px}
.nring>div{flex:1;text-align:center}
.nrsvg{display:block;margin:0 auto 6px}
.nrsvg .bg{fill:none;stroke:var(--line);stroke-width:9}
.nrsvg .fg{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .6s var(--ease)}
.nrv{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.nrv small{font-size:13px;color:var(--mut);font-weight:600}
.nrl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin-top:3px}
.nrg{font-size:11.5px;color:var(--mut2);font-variant-numeric:tabular-nums}
.nsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px;padding-top:13px;
  border-top:1px solid var(--line)}
.nsplit.trois{grid-template-columns:1fr 1fr 1fr}
.calbox{margin-top:11px;padding:11px 12px;border-radius:var(--r);background:var(--surf2);
  border:1px solid var(--line)}
.calbox .ct{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.calbox .cv{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;margin:6px 0 2px}
.calbox .cd{font-size:11.5px;color:var(--mut);line-height:1.45}
.calbox .cb{display:flex;gap:8px;margin-top:10px}
.jauge{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:7px 0 3px}
.jauge i{display:block;height:100%;background:var(--acc);border-radius:99px}
.nsplit div{text-align:center}
.nsplit b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;
  font-variant-numeric:tabular-nums}
.nsplit span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.05em}
.mealrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);
  background:var(--surf2);border:1px solid var(--line);margin-bottom:7px}
.mealrow .mi{flex:1;min-width:0}
.mealrow .mn2{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mealrow .mk{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.rsearch{display:flex;gap:7px;align-items:center}
.rsearch input{flex:1;min-width:0}
.rsearch .iconbtn{flex:0 0 auto;width:46px;height:46px}
.gramrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gchip{padding:10px 4px;border-radius:12px;background:var(--surf2);
  border:1px solid var(--line);color:var(--mut);font-weight:800;font-size:13px;
  transition:transform .14s var(--ease),background .16s,border-color .16s,color .16s}
.gchip:active{transform:scale(.94)}
.gchip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-hi)}
.scanbox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;
  border:1px solid var(--line2)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanmire{position:absolute;inset:18% 10%;border:2.5px solid rgba(255,255,255,.85);border-radius:12px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.objchips{display:flex;gap:7px;margin-bottom:12px}
.objchips button{flex:1;padding:9px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--mut)}
.objchips button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ============================ 14d. crew ============================ */
.crewtabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:3px}
.crewtabs button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--surf2);
  border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.crewtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.crewcode{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r);
  background:var(--surf2);border:1px dashed var(--line2);margin-bottom:11px}
.crewcode b{font-family:'Barlow Condensed',sans-serif;font-size:25px;letter-spacing:.14em;font-weight:700}
.defi{padding:12px 13px;border-radius:var(--r);background:var(--surf2);border:1px solid var(--line);
  margin-bottom:9px}
.defihead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.defihead .dn{font-weight:800;font-size:14.5px;flex:1;min-width:0}
.defihead .dc{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.defiline{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.defiline .av{font-size:17px;flex:0 0 auto}
.defiline .nm{flex:0 0 74px;font-size:12.5px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.defiline .bar{flex:1;height:7px;border-radius:5px;background:var(--line);overflow:hidden}
.defiline .bar i{display:block;height:100%;background:var(--acc);border-radius:5px;
  transition:width .6s var(--ease)}
.defiline .bar i.full{background:var(--ok)}
.defiline .pc{flex:0 0 40px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}

/* ============================ 14e. athlète ============================ */
/* les années de salle : 53 colonnes de 7 jours */
.annee{display:flex;gap:2px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.acol{display:flex;flex-direction:column;gap:2px;flex:1 0 auto}
.acell{width:100%;aspect-ratio:1;min-width:5px;min-height:5px;border-radius:2px;background:var(--surf2)}
.acell.hors{background:transparent}
.acell.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.acell.l1{background:rgba(52,211,153,.24)} .acell.l2{background:rgba(52,211,153,.48)}
.acell.l3{background:rgba(52,211,153,.72)} .acell.l4{background:var(--ok)}
.acell.miss{background:var(--surf2)}
.acell.now{box-shadow:0 0 0 1.5px var(--acc)}
.amonths{display:flex;gap:2px;font-size:9.5px;color:var(--mut2);font-weight:700;margin-top:3px}
.amonths span{flex:1 0 auto;text-align:left}

/* la saison */
.season{position:relative;padding:4px 0 0}
.seasvg{display:block;width:100%;height:auto}
.seasvg .mnt{fill:var(--surf2);stroke:var(--line2);stroke-width:1.2}
.seasvg .path{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:2 3.4;stroke-linecap:round}
.seasvg .done{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round}
.seasvg .you{fill:var(--acc);stroke:var(--bg);stroke-width:2.4}
.seasvg .flag{fill:none;stroke:var(--mut);stroke-width:1.6;stroke-linecap:round}
.seasrow{display:flex;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.seasrow div{flex:1;text-align:center}
.seasrow b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.seasrow span{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.05em}

/* classement de force */
.frow{padding:12px 13px;border-radius:var(--r);background:var(--surf2);border:1px solid var(--line);
  margin-bottom:9px}
.fhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.fhead .fn{font-weight:800;font-size:14.5px;flex:1;min-width:0}
.fhead .fv{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;
  font-variant-numeric:tabular-nums}
.fsteps{display:flex;gap:3px;margin-bottom:6px}
.fsteps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.fsteps i.on{background:var(--acc)}
.fsteps i.top{background:var(--gold)}
.flvl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.flvl b{color:var(--txt);font-weight:800}

/* la charge sur l'année */
.load{display:block;width:100%;height:auto}
.load .bar{fill:var(--acc)}
.load .bar.pale{fill:var(--line2)}
.load text{fill:var(--mut2);font-size:8px;font-weight:700}

/* la couleur d'accent */
.accrow{display:flex;gap:9px;flex-wrap:wrap}
.accdot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:transform .14s var(--ease)}
.accdot:active{transform:scale(.88)}
.accdot span{width:22px;height:22px;border-radius:50%;display:block}
.accdot.on{border-color:var(--txt)}

/* zones sensibles */
.gene{color:var(--gold);display:inline-flex;align-items:center;margin-left:5px}
.gene.faible{opacity:.45}
.gene .ic{width:.95em;height:.95em}
.zrow{display:flex;gap:7px;flex-wrap:wrap}
.zchip{padding:8px 12px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--mut)}
.zchip.on{background:rgba(251,191,36,.16);border-color:rgba(251,191,36,.45);color:var(--gold)}

/* compléments */
.suprow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.supbtn{padding:10px 4px;border-radius:var(--r);background:var(--surf2);border:1px solid var(--line);
  text-align:center;transition:transform .14s var(--ease)}
.supbtn:active{transform:scale(.93)}
.supbtn .se{font-size:20px;line-height:1.1;display:block}
.supbtn .sn{font-size:10.5px;font-weight:700;color:var(--mut);margin-top:3px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.supbtn.on{background:var(--ok-soft);border-color:rgba(52,211,153,.42)}
.supbtn.on .sn{color:var(--txt)}

/* l'avertissement */
.spark .tg{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:4 4}
.spark .tgt{fill:var(--gold);font-size:9.5px;font-weight:700}
.dispo{font-size:11.5px;color:var(--mut2);line-height:1.5;text-align:center;
  padding:16px 6px 4px;max-width:420px;margin:0 auto}
.dispo a{color:var(--mut);text-decoration:underline}

/* ============================ 15. mode focus ============================ */
#focus{position:fixed;inset:0;z-index:80;display:none;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto}
#focus.open{display:block;animation:fade .22s ease both}
.fxwrap{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.fxtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fxtop .cnt{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.fxbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 0}
.fxemo{font-size:76px;line-height:1;margin-bottom:12px}
.fxname{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;text-transform:uppercase;line-height:1.04}
.fxtime{font-family:'Barlow Condensed',sans-serif;font-size:54px;font-weight:700;color:var(--acc);
  margin:8px 0 4px;letter-spacing:.01em}
.fxsteps{width:100%;margin-top:16px;text-align:left}
.fxact{display:flex;gap:10px;margin-top:18px;width:100%}
.fxact .btn{flex:1;padding:15px}

/* ============================ 16. tutoriel ============================ */
#coach{position:fixed;inset:0;z-index:88;display:none}
#coach.on{display:block}
#chole{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:18px;
  border:2px solid var(--acc);pointer-events:none;
  box-shadow:0 0 0 9999px rgba(6,9,14,.80), 0 0 26px rgba(59,130,246,.32);
  transition:left .34s var(--ease),top .34s var(--ease),width .34s var(--ease),height .34s var(--ease)}
#chole.none{border-color:transparent;box-shadow:0 0 0 9999px rgba(6,9,14,.88)}
html[data-theme="light"] #chole{box-shadow:0 0 0 9999px rgba(15,22,34,.72), 0 0 26px rgba(59,130,246,.3)}
html[data-theme="light"] #chole.none{box-shadow:0 0 0 9999px rgba(15,22,34,.8)}
#cbox{position:fixed;left:16px;right:16px;max-width:calc(var(--maxw) - 32px);margin:0 auto;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surf);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--sh3);
  padding:17px;animation:rise .26s var(--ease) both}
#cbox .cstep{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
#cbox h3{font-size:21px;margin:7px 0 8px}
#cbox p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.6}
#cbox .cnav{display:flex;gap:8px;align-items:center;margin-top:16px}
#cbox .cnav .skip{margin-right:auto}
#cbox .cnav .btn{padding:11px 15px}
@media (max-height:660px){
  #cbox{padding:14px}
  #cbox h3{font-size:19px;margin:5px 0 6px}
  #cbox p{font-size:12.8px;line-height:1.5}
  #cbox .cnav{margin-top:12px}
  #cbox .cnav .btn{padding:9px 13px}
}
.cdots{display:flex;gap:4px;justify-content:center;margin-top:13px}
.cdots i{width:5px;height:5px;border-radius:5px;background:var(--line2);transition:all .25s var(--ease)}
.cdots i.on{background:var(--acc);width:16px}

/* ============================ 17. toast ============================ */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(22px);z-index:99;
  bottom:calc(env(safe-area-inset-bottom) + 98px);max-width:calc(100% - 32px);
  background:var(--surf);border:1px solid var(--line2);box-shadow:var(--sh3);
  border-radius:var(--r);padding:12px 15px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .24s,transform .24s var(--ease);
  display:flex;gap:9px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .ti{display:flex;flex:0 0 auto;font-size:17px;color:var(--acc-hi)}


/* ============================ 18. compléments ============================ */
.tmr .tv{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tmr .ic{font-size:14px}
.up .ic,.down .ic{font-size:13px;stroke-width:2.6;vertical-align:-.1em}
.saveflag .ic{font-size:13px}
.chk .ic{stroke-width:2.6}
.pchk .ic,.step .box .ic{stroke-width:2.7}
.del .ic{font-size:16px}
.ord .ic{font-size:14px;stroke-width:2.4}
.mnav .ic{font-size:16px}
.sec .ic{font-size:13px;stroke-width:2.6;vertical-align:-.12em}
#fab .ic{font-size:26px;stroke-width:2.2}
#banner .ic{font-size:17px}
.lbrow .del{border-color:transparent}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>

var $  = function(s,r){ return (r||document).querySelector(s); };

  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
/* une seule fabrique d'icônes : même jeu, même graisse de trait partout */
var tint = function(hex,a){
  var h=String(hex||'').replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-f]{6}$/i.test(h)) return '';
  var n=parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
};
/* style de la tuile d'emoji, teintée à la couleur de l'habitude */
var tileStyle = function(color){
  var bg=tint(color,.16), bd=tint(color,.34);
  /* le dessin hérite de la couleur du texte : on la pose ici, et la tuile
     devient une icône colorée sur un fond teinté de la même couleur. */
  return bg ? ' style="background:'+bg+';border-color:'+bd+';color:'+color+'"' : '';

/* Des ordres de grandeur publiés, rapportés au poids de corps : ce qu'on
   observe couramment en salle à chaque niveau. Ce ne sont pas des notes, et
   l'écran le répète — un chiffre de force ne dit rien de ta santé ni de ta
   technique. Les rapports féminins sont plus bas sur le haut du corps, où la
   différence de masse musculaire est la plus marquée. */
var FORCE = [
  {x:'squatbarre', n:'Squat barre',         h:[0.75,1.25,1.75,2.25,2.75], f:0.80},
  {x:'devcouche',  n:'Développé couché',    h:[0.60,1.00,1.40,1.80,2.20], f:0.65},
  {x:'sdt',        n:'Soulevé de terre',    h:[1.00,1.50,2.00,2.50,3.00], f:0.85},
  {x:'devmil',     n:'Développé militaire', h:[0.40,0.60,0.85,1.10,1.40], f:0.62},
  {x:'tractions',  n:'Tractions',           reps:[1,5,12,20,30],          f:0.45}

var NIVEAUX = ['Débutant','Novice','Intermédiaire','Avancé','Élite'];

/* Epley : l'estimation d'un maximum à partir d'une série. Au-delà de dix
   répétitions elle dérive, on s'arrête donc là. */
function unRM(poids,reps){
  if(!poids || !reps) return 0;
  return poids * (1 + Math.min(reps,10)/30);
}
/* Le meilleur effort jamais inscrit pour un mouvement. */
function meilleurEffort(id){
  var best=0, quand='';
  carnet().forEach(function(sn){
    (sn.sea.x||[]).forEach(function(ex){
      if(ex.i!==id) return;
      (ex.s||[]).forEach(function(t){
        var v = (+t.w) ? unRM(+t.w,+t.r||1) : (+t.r||0);
        if(v>best){ best=v; quand=sn.key; }
      });
    });
  });
  return best ? {v:best, key:quand} : null;
}
function niveauForce(f,valeur,kg,sexe){
  var paliers = f.reps
    ? f.reps.map(function(v){ return sexe==='f' ? Math.max(1,Math.round(v*f.f)) : v; })
    : f.h.map(function(r){ return (sexe==='f' ? r*f.f : r) * kg; });
  var i=-1;
  for(var k=0;k<paliers.length;k++) if(valeur>=paliers[k]) i=k;
  return {
    i:i, nom: i<0 ? 'Pas encore classé' : NIVEAUX[i],
    seuil: paliers[Math.min(i+1,paliers.length-1)],
    dernier: i>=paliers.length-1,
    paliers: paliers
  };
}
function classementForce(){
  var kg=dernierPoids(), sexe=(state.body&&state.body.sexe)||'h';
  if(!kg) return [];
  return FORCE.map(function(f){
    var e=meilleurEffort(f.x);
    if(!e) return null;
    return { f:f, val:e.v, key:e.key, unite:f.reps?'rép.':'kg', niv:niveauForce(f,e.v,kg,sexe) };
  }).filter(Boolean);
}

/* ------------------------------------------------------------ silhouette */
/* Elle sert en grand pour la récupération, et en petit pour un exercice créé
   à la main : elle dit ce qui travaille. Ce qu'on *fait*, c'est la pose de
   l'exercice qui le montre — elle est juste en dessous. */
function r2(n){ return Math.round(n*10)/10; }

/* Une courbe lisse qui passe par tous les points donnés. Catmull-Rom : la
   tangente en un point suit ses deux voisins, et se convertit en Bézier cubique
   en divisant par six. Les extrémités se dupliquent pour n'avoir aucun cas
   particulier. */
function lisse(p, fermee){
  var n = p.length, d = 'M' + r2(p[0][0]) + ' ' + r2(p[0][1]), i;
  var at = function(k){ return p[fermee ? ((k % n) + n) % n : Math.max(0, Math.min(n - 1, k))]; };
  var fin = fermee ? n : n - 1;
  for(i = 0; i < fin; i++){
    var p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    d += 'C' + r2(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + r2(p1[1] + (p2[1] - p0[1]) / 6)
       + ' ' + r2(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + r2(p2[1] - (p3[1] - p1[1]) / 6)
       + ' ' + r2(p2[0]) + ' ' + r2(p2[1]);
  }
  return d + (fermee ? 'Z' : '');
}
/* Un fuseau reste le bon outil pour un chef de muscle dans un membre. */
function fuseau(x1,y1,w1,x2,y2,w2){
  var k1=w1*1.25, k2=w2*1.25;
  return 'M'+r2(x1-w1)+' '+r2(y1)+
    'C'+r2(x1-w1)+' '+r2(y1-k1)+' '+r2(x1+w1)+' '+r2(y1-k1)+' '+r2(x1+w1)+' '+r2(y1)+
    'L'+r2(x2+w2)+' '+r2(y2)+
    'C'+r2(x2+w2)+' '+r2(y2+k2)+' '+r2(x2-w2)+' '+r2(y2+k2)+' '+r2(x2-w2)+' '+r2(y2)+'Z';
}
var AXE = 59.2;

/* Une masse du tronc touche l'axe du corps : son bord central doit rester
   droit. Fermer la courbe lisse sur lui le ferait gonfler — un pectoral en
   forme de cœur. On lisse donc le profil, et on referme d'un trait. */
function contreAxe(pts){
  return lisse(pts, false) + 'L' + AXE + ' ' + r2(pts[0][1]) + 'Z';
}

/* Le corps dans une position : une vraie masse, pas un trait.

   Un bonhomme en bâtons dit où sont les articulations et rien d'autre. Un
   corps, lui, a des épaules larges, une taille, des cuisses plus épaisses que
   les mollets, et il se reconnaît d'un coup d'œil.

   Chaque segment est un fuseau à bouts ronds : le bout rond EST l'articulation.
   Deux segments qui se rejoignent au coude se fondent l'un dans l'autre, et il
   ne reste aucune jointure à voir — c'est exactement ce qui manquait à la
   première silhouette, qui posait une pastille sur chaque articulation.

   Tout est rempli d'une seule couleur, donc les recouvrements disparaissent :
   on obtient un corps d'un seul tenant à partir d'une dizaine de morceaux.
*/
function r1(n){ return Math.round(n * 10) / 10; }
function xy(x, y){ return r1(x) + ' ' + r1(y); }
function vec(a, b){ return [b[0] - a[0], b[1] - a[1]]; }
function uni(d){ var l = Math.sqrt(d[0]*d[0] + d[1]*d[1]) || 1; return [d[0]/l, d[1]/l]; }
function pp(d){ return [-d[1], d[0]]; }
function pas(a, d, k){ return [a[0] + d[0]*k, a[1] + d[1]*k]; }
function mil(a, b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }

function mir(a, ax){ return [Math.round((2 * ax - a[0]) * 10) / 10, a[1]]; }

/* Le matériel, dessiné à partir de la pose : il se place sur les mains, sous
   les pieds ou sous le dos, donc il suit la position au lieu d'être posé à
   côté. */
var MATOS_POSE = {
  /* une barre fixe : elle passe dans les mains. Dessinée au-dessus, le poing
     la traversait au lieu de la tenir. */
  barre: function(P){ return '<path d="M3 ' + P.m[1] + 'H37"/>'; },
  /* une barre chargée, tenue dans les mains. De profil la main n'est pas au
     milieu du cadre : la barre se raccourcit de ce qu'il faut pour que ses
     disques restent dans la boîte plutôt que d'être coupés au bord. */
  barbell: function(P){
    var y = P.m[1], x = P.ax ? P.ax : P.m[0],
        h = Math.max(6, Math.min(16, x - 3.5, 36.5 - x));
    return '<path d="M' + (x - h) + ' ' + y + 'H' + (x + h) + '"/>'
         + '<path d="M' + (x - h + 2.5) + ' ' + (y - 3.4) + 'v6.8M'
         + (x + h - 2.5) + ' ' + (y - 3.4) + 'v6.8"/>';
  },
  /* deux haltères, un dans chaque main */
  halt: function(P){
    var h = function(m){ return '<path d="M' + (m[0] - 3.4) + ' ' + (m[1] - 2.6) + 'v5.2M'
                       + (m[0] + 3.4) + ' ' + (m[1] - 2.6) + 'v5.2M' + (m[0] - 3.4) + ' ' + m[1]
                       + 'H' + (m[0] + 3.4) + '"/>'; };
    return h(P.m) + (P.ax ? h(mir(P.m, P.ax)) : '');
  },
  /* un banc sous le corps */
  banc: function(P){

  estrade: function(P){

  /* deux barres parallèles : vues de face elles sont sous chaque main, en

  para: function(P){

/* Un morceau de chair : épais à la racine, plus fin au bout, avec un ventre
   réglable au milieu — c'est lui qui donne le galbe du mollet et de la cuisse.
   Les deux bouts sont ronds, et tracés en Bézier plutôt qu'en arc pour que le
   sens de parcours soit le même partout : deux formes qui se recouvrent
   s'additionnent au lieu de se trouer. */
function chair(a, b, wa, wb, wm){
  var d = uni(vec(a, b)), n = pp(d), m = mil(a, b), k = 4/3;
  if(wm === undefined) wm = (wa + wb) / 2;
  var e = 2*wm - (wa + wb)/2;
  return 'M' + xy(a[0] + n[0]*wa, a[1] + n[1]*wa) +
    'Q' + xy(m[0] + n[0]*e, m[1] + n[1]*e) + ' ' + xy(b[0] + n[0]*wb, b[1] + n[1]*wb) +
    'C' + xy(b[0] + n[0]*wb + d[0]*wb*k, b[1] + n[1]*wb + d[1]*wb*k) + ' ' +
          xy(b[0] - n[0]*wb + d[0]*wb*k, b[1] - n[1]*wb + d[1]*wb*k) + ' ' +
          xy(b[0] - n[0]*wb, b[1] - n[1]*wb) +
    'Q' + xy(m[0] - n[0]*e, m[1] - n[1]*e) + ' ' + xy(a[0] - n[0]*wa, a[1] - n[1]*wa) +
    'C' + xy(a[0] - n[0]*wa - d[0]*wa*k, a[1] - n[1]*wa - d[1]*wa*k) + ' ' +
          xy(a[0] + n[0]*wa - d[0]*wa*k, a[1] + n[1]*wa - d[1]*wa*k) + ' ' +
          xy(a[0] + n[0]*wa, a[1] + n[1]*wa) + 'Z';
}

/* Les épaisseurs, dans la boîte de 40. Un corps d'athlète : les épaules
   larges, la taille prise, la cuisse deux fois le bras. */
var R_TETE = 2.42;
var CH = {
  bras:[1.62, 1.14], biceps:1.5,      /* le bras est le plus gros sous l'épaule */
  avant:[1.24, 0.8], avantV:1.08,     /* l'avant-bras, juste sous le coude      */
  main:1.02,
  cuisse:[2.15, 1.38], cuisseV:1.82,
  tibia:[1.42, 0.78], mollet:1.62,    /* le mollet a son ventre                 */
  pied:[0.95, 0.6],
  cou:1.2, taille:1.95, hanche:2.05, epMin:3.1, epMax:4.6, epProfil:2.55
};

/* Le tronc n'est pas un tube. Il a une ligne d'épaules presque plate, des
   trapèzes qui montent vers le cou, une taille prise et un bassin. Construit
   en fuseau, son bout rond posait un dôme au-dessus des épaules : la tête s'y
   enfonçait et le bonhomme avait l'air voûté, sans cou.

   On le décrit donc par ses repères, en coordonnées « le long de l'axe du
   tronc » et « en travers » : la moitié droite est la même liste au signe
   près, et lisse() fait passer une courbe par tous les points. */
function tronc(ep, b, wEp, wH, wT){
  var d = uni(vec(ep, b)), n = pp(d);
  var L = Math.sqrt((b[0]-ep[0])*(b[0]-ep[0]) + (b[1]-ep[1])*(b[1]-ep[1])) || 1;
  var rep = [
    [-0.9,      1.0],        /* base du cou     */
    [ 0.15,     wEp * 0.94], /* pointe d'épaule */
    [ L * 0.30, wEp * 0.78], /* aisselle        */
    [ L * 0.56, wT],         /* taille          */
    [ L * 0.88, wH],         /* hanche          */
    [ L * 1.07, wH * 0.6]    /* bas du bassin   */
  ];
  var pt = function(q){ return [ep[0] + d[0]*q[0] + n[0]*q[1], ep[1] + d[1]*q[0] + n[1]*q[1]]; };
  return lisse(rep.map(pt).concat(rep.slice().reverse().map(function(q){
    return pt([q[0], -q[1]]);
  })), true);
}

/* Le poing est centré sur la main, pas planté au bout : c'est lui qui doit
   envelopper la barre ou l'haltère, et non les dépasser. */
function brasDe(ep, c, m){
  var h = uni(vec(c, m));
  return [ chair(ep, c, CH.bras[0], CH.bras[1], CH.biceps),
           chair(c, m, CH.avant[0], CH.avant[1], CH.avantV),
           chair(pas(m, h, -0.55), pas(m, h, 0.25), CH.main, CH.main * 0.94) ];
}
/* Le pied prolonge le tibia quand la jambe est allongée — sur une pompe les
   orteils s'appuient dans le sol. Quand elle est debout, il part vers l'avant
   *et* vers le bas : à l'horizontale pure, de face, on obtenait deux palmes. */
function jambeDe(ha, g, p, cx){
  var t = uni(vec(g, p)), pd;
  if(Math.abs(t[1]) > Math.abs(t[0])){
    var q = pp(t), vers = (p[0] - cx) || -1;
    if(q[0] * vers < 0) q = [-q[0], -q[1]];
    pd = uni([q[0] * 0.8 + t[0] * 0.6, q[1] * 0.8 + t[1] * 0.6]);
  }else pd = t;
  return [ chair(ha, g, CH.cuisse[0], CH.cuisse[1], CH.cuisseV),
           chair(g, p, CH.tibia[0], CH.tibia[1], CH.mollet),
           chair(p, pas(p, pd, 1.6), CH.pied[0], CH.pied[1]) ];
}

function bonhomme(P){
  var ax = P.ax, e = P.e, b = P.b, t = P.t, d = [];
  var wEp = ax ? Math.min(CH.epMax, Math.max(CH.epMin, Math.abs(e[0] - ax))) : CH.epProfil;
  var epMid = ax ? [ax, e[1]] : e;
  var epG = ax ? [ax - wEp, e[1]] : e, epD = ax ? [ax + wEp, e[1]] : e;
  var haG = ax ? [b[0] - CH.hanche, b[1]] : b, haD = ax ? [b[0] + CH.hanche, b[1]] : b;
  var cx = ax ? ax : b[0], u = uni(vec(epMid, t));

  d.push(chair(epMid, t, CH.cou, CH.cou * 0.92));            /* le cou   */
  d.push(tronc(epMid, b, wEp, CH.hanche, CH.taille));        /* le tronc */
  d.push(chair(pas(t, u, R_TETE * 0.25), pas(t, u, -R_TETE * 0.25),
               R_TETE * 0.98, R_TETE * 0.84));               /* la tête  */

  d = d.concat(brasDe(epG, P.c, P.m)).concat(jambeDe(haG, P.g, P.p, cx));
  if(ax){
    d = d.concat(brasDe(epD, mir(P.c, ax), mir(P.m, ax)))
         .concat(jambeDe(haD, mir(P.g, ax), mir(P.p, ax), cx));
  }else{
    if(P.c2) d = d.concat(brasDe(e, P.c2, P.m2));
    if(P.g2) d = d.concat(jambeDe(b, P.g2, P.p2, cx));
  }

  var eq = String(P.eq || '').split('+').map(function(k){
    return MATOS_POSE[k] ? MATOS_POSE[k](P) : '';
  }).join('');
  /* Chaque masse est son propre tracé : deux tracés distincts se recouvrent en
     s'additionnant, là où deux sous-chemins d'un même tracé peuvent se trouer
     s'ils ne tournent pas dans le même sens. */
  return '<g class="co">' + d.map(function(x){ return '<path d="' + x + '"/>'; }).join('') +
         '</g>' + (eq ? '<g class="mt">' + eq + '</g>' : '');
}

/* Le trait doit peser pareil à l'œil quelle que soit la taille : à 30 px on
   veut un cheveu d'un peu plus d'un pixel et demi, à 96 px on n'en veut pas
   trois fois plus. On vise donc une épaisseur à l'écran, et on la reconvertit
   dans les unités du dessin. */
function traitPose(w){
  var px = 1.55 * Math.pow(Math.max(w,8) / 30, .42);
  return Math.round(px * 40 / Math.max(w,8) * 100) / 100;
}

/* La taille d'une vignette en ligne de liste. Trente pixels suffisaient pour
   un dessin, qui est fait de six traits ; une photo de salle a besoin du
   double pour qu'on distingue l'athlète du rack de disques. */
var VIGN = 52;

/* Les exercices qui ont une photo. Trente-quatre sur quarante-trois : les
   neuf autres (suspension, pompes piquées, pistol, chaise au mur, hollow
   body, L-sit, dragon flag, burpees, montées de genoux) n'existent nulle
   part en photo libre, ou seulement sous un autre mouvement — un « fast
   skipping » élastique au pied n'est pas une montée de genoux. Ceux-là
   gardent leur dessin, qui au moins ne ment pas. */
var PHOTOS = ('tractions tracsup tracprise muscleup rowinv rowhalt curl shrug ' +
  'pompes pompesdia pompesdecl atr dips dipsbanc devcouche devmil ecarte elevlat ' +
  'squat squatbarre squatbulg fentes sdt hipthrust mollets gainage gainlat ' +
  'relevjambes crunch superman course corde velo rameur').split(' ')
  .reduce(function(o,k){ o[k]=1; return o; }, {});

/* La photo d'un exercice. Elle est servie depuis le site, pas embarquée dans
   la page : trente-quatre images pèsent un demi-méga, l'app entière en pèse
   moins. Chargée en différé, elle ne retarde donc jamais l'affichage. */
function photoExo(id,w){
  if(!PHOTOS[id]) return '';
  return '<img class="exophoto" src="exos/'+id+'.jpg" width="'+w+'" height="'+w+'"' +
         ' loading="lazy" decoding="async" alt="">';
}

/* Le dessin d'un exercice, prêt à poser dans une ligne de liste. */
function dessinExo(id,w){
  var P=POSES[id];
  if(!P) return '';
  return '<svg class="exodraw" viewBox="0 0 40 40" width="'+w+'" height="'+w+'"'+
         ' stroke-width="'+traitPose(w)+'" aria-hidden="true">'+bonhomme(P)+'</svg>';
}

function silhouette(face,couleurs,w,cls){
  var d=SIL[face]||SIL.av, out='';
  function paire(pth,c){
    return '<g fill="'+c+'"><path d="'+pth+'"/>'+
           '<path d="'+pth+'" transform="translate(120,0) scale(-1,1)"/></g>';
  }
  d.neutre.forEach(function(pth){ out+=paire(pth,'var(--line)'); });
  var ids=Object.keys(d.m);
  for(var i=0;i<ids.length;i++){
    var c=(couleurs&&couleurs[ids[i]])||'var(--line2)', pth=d.m[ids[i]];
    /* un muscle peut avoir plusieurs chefs : chacun son tracé, tous sa couleur */
    if(Array.isArray(pth)){ for(var k=0;k<pth.length;k++) out+=paire(pth[k],c); }
    else out+=paire(pth,c);
  }
  return '<svg class="silh'+(cls?' '+cls:'')+'" viewBox="0 0 120 258" width="'+w+'" height="'+
         Math.round(w*258/120)+'" aria-hidden="true">'+out+'</svg>';
}
/* Les muscles d'un exercice, moteurs en plein, secondaires en demi-teinte. */
/* L'accent est défini une seule fois, dans la feuille de style ; on le relit
   ici pour pouvoir en tirer des demi-teintes en JavaScript. */
var ACC = '#3B82F6';
function relireAccent(){
  try{
    var v=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
    if(/^#[0-9a-f]{6}$/i.test(v)) ACC=v;
  }catch(e){}
}
function couleursExo(x){
  var c={};
  (x.s||[]).forEach(function(m){ c[m]=tint(ACC,.45); });
  (x.m||[]).forEach(function(m){ c[m]='var(--acc)'; });
  return c;
}
/* La vignette d'un exercice : le geste, pas l'anatomie.

   Un exercice du catalogue a sa pose — c'est ce qu'on montre, parce que
   c'est ce qu'on cherche du regard dans une liste : « lequel c'est ? ».
   Un exercice créé à la main n'en a pas ; on retombe alors sur la
   silhouette teintée des muscles choisis, qui reste vraie. */
function vignetteExo(x,w){
  var t=w||34, p=photoExo(x.id,t);
  if(p) return p;
  var d=dessinExo(x.id,t);
  if(d) return d;
  var c=couleursExo(x), av=0, ar=0;
  Object.keys(c).forEach(function(m){ (SIL.av.m[m]?av++:0); (SIL.ar.m[m]?ar++:0); });
  return silhouette(ar>av?'ar':'av', c, t, t<=60?'mini':'');
}

/* ------------------------------------------------------------------ état */
function defaults(){
  return {
    v:2, theme:'dark', tab:'jour',
    plannedDays:{},  /* journées déjà posées : { 'YYYY-MM-DD': true } — on peut préparer la veille */
    off:{},       /* 'YYYY-MM-DD' -> [ids retirés de la journée]                                                 */
    tutoSeen:false, tutoStep:0, tutoV:0,
    habits:[],
    log:{},      /* 'YYYY-MM-DD' -> { habitId:{done,steps[],pts,doneAt} }  */
    mood:{}, notes:{}, weight:{},
    focus:0,
    profile:{ id:uid(), name:'Moi', avatar:'dumbbell' },
    friends:[], pendingDrop:[], syncAt:0,
    account:null,   /* {uid, name, picture, token} — local, ne part jamais sur le serveur */
    cloudAt:0,      /* horodatage de la dernière sauvegarde acceptée */
    notified:{},
    myexos:[],      /* exercices ajoutés à la main, en plus du catalogue */
    meals:{},       /* 'YYYY-MM-DD' -> [ {n, kcal, prot} ]                */
    foods:[],       /* aliments enregistrés pour ne pas les retaper      */
    body:{},        /* taille, âge, sexe, activité, objectif             */

    accent:'',      /* couleur d'accent choisie, vide = celle d'origine  */
    season:null,    /* la saison en cours : { n, from, to }              */
    gene:[],        /* zones sensibles : identifiants de muscles         */
    suppl:{},       /* 'YYYY-MM-DD' -> [ identifiants de compléments ]   */
    wtarget:0,      /* poids visé, 0 = pas d'objectif                    */
